[package]
name = "app"
version = "0.1.0"
description = "A Tauri workspace-shell desktop app (template)"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
ignore = "0.4"
regex = "1.10"
globset = "0.4"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
base64 = "0.22"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls", "json"] }
sha2 = "0.10.9"
hex = "0.4.3"
zip = "4.2.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
