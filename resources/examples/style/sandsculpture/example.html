<!doctype html>
<html lang="en">
  <head>

      <rect x="610" y="330" width="60" height="90" rx="30" fill="#6e4f26" />
      <g fill="#6e4f26"><rect x="420" y="460" width="46" height="70" /><rect x="770" y="460" width="46" height="70" /></g>
      <path d="M900 420 L1060 420 L1060 570 L900 570 Z" fill="#8a683a" opacity="0.5" />
    </svg>
  </body>
</html>
