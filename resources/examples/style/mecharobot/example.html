<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mecha robot</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
      body { background: linear-gradient(180deg, #ff9a5c 0%, #c65b7c 45%, #3a3f66 100%); }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720" width="1280" height="720">
      <defs>
        <linearGradient id="armor" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#5a6478" />
          <stop offset="35%" stop-color="#aeb9cc" />
          <stop offset="100%" stop-color="#3c4354" />
        </linearGradient>
        <linearGradient id="armorD" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#39404f" />
          <stop offset="50%" stop-color="#7c879c" />
          <stop offset="100%" stop-color="#262c38" />
        </linearGradient>
      </defs>
      <ellipse cx="640" cy="700" rx="420" ry="40" fill="#000" opacity="0.4" />
      <!-- legs rising out of frame bottom (low angle) -->
      <polygon points="470,720 540,470 660,470 640,720" fill="url(#armorD)" stroke="#1c212c" stroke-width="7" />
      <polygon points="640,720 660,470 780,470 850,720" fill="url(#armorD)" stroke="#1c212c" stroke-width="7" />
      <!-- towering torso widening upward -->
      <polygon points="430,480 850,480 940,120 340,120" fill="url(#armor)" stroke="#1c212c" stroke-width="8" />
      <!-- panel lines -->
      <g stroke="#1c212c" stroke-width="4">
        <line x1="430" y1="380" x2="850" y2="380" />
        <line x1="410" y1="280" x2="870" y2="280" />
        <line x1="560" y1="480" x2="600" y2="120" />
        <line x1="720" y1="480" x2="680" y2="120" />
      </g>
      <!-- chest vents -->
      <g fill="#1c212c">
        <rect x="560" y="400" width="60" height="12" rx="6" /><rect x="560" y="420" width="60" height="12" rx="6" />
        <rect x="660" y="400" width="60" height="12" rx="6" /><rect x="660" y="420" width="60" height="12" rx="6" />
      </g>
      <!-- original decals: stripe + triangle insignia -->
      <polygon points="480,200 560,200 540,160 500,160" fill="#ffd166" stroke="#1c212c" stroke-width="4" />
      <polygon points="800,200 720,200 740,160 780,160" fill="#ffd166" stroke="#1c212c" stroke-width="4" />
      <polygon points="640,320 680,250 600,250" fill="#f43f5e" stroke="#1c212c" stroke-width="5" />
      <!-- massive shoulder pads -->
      <polygon points="200,220 380,180 400,420 230,460" fill="url(#armorD)" stroke="#1c212c" stroke-width="8" />
      <polygon points="1080,220 900,180 880,420 1050,460" fill="url(#armorD)" stroke="#1c212c" stroke-width="8" />
      <line x1="230" y1="300" x2="390" y2="270" stroke="#ffd166" stroke-width="10" />
      <line x1="1050" y1="300" x2="890" y2="270" stroke="#ffd166" stroke-width="10" />
      <!-- head with glowing visor -->
      <rect x="580" y="40" width="120" height="90" rx="18" fill="#39404f" stroke="#1c212c" stroke-width="7" />
      <rect x="592" y="70" width="96" height="26" rx="13" fill="#5ef2c8" />
      <rect x="592" y="70" width="96" height="26" rx="13" fill="#ffffff" opacity="0.35" />
      <rect x="560" y="55" width="20" height="60" rx="8" fill="#7c879c" stroke="#1c212c" stroke-width="4" />
      <rect x="700" y="55" width="20" height="60" rx="8" fill="#7c879c" stroke="#1c212c" stroke-width="4" />
      <!-- antenna -->
      <line x1="690" y1="45" x2="720" y2="0" stroke="#1c212c" stroke-width="6" />
      <circle cx="722" cy="8" r="7" fill="#f43f5e" />
    </svg>
  </body>
</html>
