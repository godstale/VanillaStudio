<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Below surface</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0a3d5c;}
svg{width:1280px;height:720px;display:block;}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a6d96"/><stop offset="0.6" stop-color="#0a3d5c"/><stop offset="1" stop-color="#062338"/></linearGradient>
<filter id="ub" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#sea)"/>
<g id="rays"></g>
<g id="caus"></g>
<ellipse cx="640" cy="760" rx="760" ry="120" fill="#c9a86a" opacity="0.5"/>
<ellipse cx="640" cy="740" rx="760" ry="90" fill="#8a6f42" opacity="0.6"/>
<g id="weeds"></g>
<g id="bub"></g>
<g id="fish"></g>
</svg>
<script>
const H=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const SECONDS=4;
let r='';for(let i=0;i<4;i++){const x=(300+i*220).toFixed(0);r+='<polygon points="'+x+',0 '+(Number(x)+130)+',0 '+(Number(x)-40)+',720 '+(Number(x)-170)+',720" fill="#dff4ff" opacity="0.08"/>';}
document.getElementById('rays').innerHTML=r;
let c='';for(let i=0;i<14;i++){c+='<ellipse id="q'+i+'" cx="'+(H(i+500)*1280).toFixed(0)+'" cy="'+(120+H(i+510)*380).toFixed(0)+'" rx="'+(40+H(i+520)*70).toFixed(0)+'" ry="'+(10+H(i+530)*14).toFixed(0)+'" fill="none" stroke="#bfefff" stroke-width="3"/>';}
document.getElementById('caus').innerHTML=c;
let w='';for(let i=0;i<7;i++){const x=(80+H(i+540)*1120).toFixed(0);w+='<path id="w'+i+'" d="M'+x+' 720 Q'+(Number(x)-30)+' 600 '+x+' 480 Q'+(Number(x)+30)+' 400 '+x+' 330" stroke="#1e6b3a" stroke-width="14" fill="none" stroke-linecap="round"/>';}
document.getElementById('weeds').innerHTML=w;
const N=22;let b='';for(let i=0;i<N;i++){b+='<circle id="b'+i+'" r="'+(3+H(i+7)*7).toFixed(1)+'" fill="#d8f2ff" opacity="0.55"/>';}
document.getElementById('bub').innerHTML=b;
document.getElementById('fish').innerHTML='<g id="f0" fill="#e8a13c"><ellipse rx="34" ry="16"/><polygon points="-34,0 -58,-16 -58,16"/></g><g id="f1" fill="#d96a4a"><ellipse rx="24" ry="12"/><polygon points="-24,0 -42,-12 -42,12"/></g>';
window.seekExample=(t)=>{
const p=(t%SECONDS)/SECONDS;
for(let i=0;i<14;i++){document.getElementById('q'+i).setAttribute('opacity',(0.25+0.3*Math.abs(Math.sin(p*12.566+i*1.3))).toFixed(3));}
for(let i=0;i<N;i++){const sp=40+70*H(i+99);let yy=((H(i)*780-t*sp)%780+780)%780;
const el=document.getElementById('b'+i);el.setAttribute('cx',(H(i+3)*1240+14*Math.sin(t*2+i)).toFixed(1));el.setAttribute('cy',(700-yy).toFixed(1));}
for(let i=0;i<7;i++){document.getElementById('w'+i).setAttribute('transform','rotate('+(7*Math.sin(t*1.6+i*0.9)).toFixed(2)+' '+(80+H(i+540)*1120).toFixed(0)+' 720)');}
const f0=document.getElementById('f0'),f1=document.getElementById('f1');
f0.setAttribute('transform','translate('+((1400-((t*90)%1500))).toFixed(1)+' 300)');
f1.setAttribute('transform','translate('+(((t*60+400)%1500-100)).toFixed(1)+' 430) scale(-1 1)');};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}window.seekExample(0);
</script>
</body>
</html>
