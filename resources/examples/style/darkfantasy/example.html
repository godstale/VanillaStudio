<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>df</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0e18}
svg{display:block;width:1280px;height:720px}
</style></head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<radialGradient id="moon" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#cfe4ff"/><stop offset=".35" stop-color="#8fb4e8" stop-opacity=".8"/><stop offset="1" stop-color="#8fb4e8" stop-opacity="0"/>
</radialGradient>
<linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#9fb4cc" stop-opacity="0"/><stop offset=".5" stop-color="#9fb4cc" stop-opacity=".35"/><stop offset="1" stop-color="#9fb4cc" stop-opacity=".6"/>
</linearGradient>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1280" height="720" fill="#0b0e18"/>
<circle cx="880" cy="150" r="200" fill="url(#moon)"/>
<circle cx="880" cy="150" r="62" fill="#e8f2ff"/>
<g id="stars"></g>
<!-- ruined spires -->
<g fill="#1c2438" stroke="#05070d" stroke-width="5">
<path d="M120 720 L120 300 L170 300 L200 180 L230 300 L280 300 L280 720Z"/>
<path d="M330 720 L330 420 L380 420 L420 260 L440 420 L480 420 L480 720Z"/>
<path d="M1030 720 L1030 360 L1070 360 L1120 200 L1140 360 L1180 360 L1180 720Z"/>
<path d="M700 720 L700 480 L740 480 L770 380 L800 480 L830 480 L830 720Z"/>
</g>
<g fill="#f2c14e">
<rect x="160" y="380" width="26" height="40"/>
<rect x="390" y="480" width="22" height="34"/>
<rect x="1080" y="440" width="24" height="36"/>
<rect x="752" y="540" width="18" height="28"/>
</g>
<!-- broken tops -->
<g fill="#05070d">
<polygon points="200,180 170,230 200,215 230,235"/>
<polygon points="1120,200 1090,250 1120,235 1150,255"/>
</g>
<rect y="510" width="1280" height="210" fill="url(#fog)"/>
<g id="fg" filter="url(#blur8)"></g>
</svg>
<script>
(function(){
function h(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
var st=document.getElementById('stars'),s='';
for(var i=0;i<120;i++){
s+='<circle cx="'+(h(i)*1280).toFixed(0)+'" cy="'+(h(i+9)*300).toFixed(0)+'" r="'+(0.8+h(i+3)*1.6).toFixed(1)+'" fill="#cfe0f2" opacity="'+(0.3+h(i+5)*0.6).toFixed(2)+'"/>';
}
st.innerHTML=s;
var fg=document.getElementById('fg'),t='';
for(var k=0;k<26;k++){
var y=440+h(k+100)*260;
t+='<ellipse cx="'+(h(k+200)*1280).toFixed(0)+'" cy="'+y.toFixed(0)+'" rx="'+(120+h(k+3)*200).toFixed(0)+'" ry="'+(14+h(k+5)*22).toFixed(0)+'" fill="#8fa4bd" opacity=".28"/>';
}
fg.innerHTML=t;
})();
</script>
</body>
</html>
