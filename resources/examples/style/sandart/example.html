<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sand art</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden}
      svg{width:100%;height:100%;display:block}
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <radialGradient id="glowbox" cx="0.5" cy="0.45" r="0.75">
          <stop offset="0" stop-color="#fff8e0"/><stop offset="0.6" stop-color="#f2d98c"/><stop offset="1" stop-color="#c99a4a"/>
        </radialGradient>
        <filter id="sandsoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <rect width="1280" height="720" fill="#3a2a18"/>
      <rect x="90" y="50" width="1100" height="620" rx="20" fill="url(#glowbox)"/>
      <rect x="90" y="50" width="1100" height="620" rx="20" fill="none" stroke="#241708" stroke-width="18"/>
      <g id="sceneA" fill="#6b4a22" filter="url(#sandsoft)">
        <circle cx="640" cy="300" r="110"/>
        <path d="M300 560 Q640 380 980 560 L980 600 L300 600Z"/>
        <g id="birdsA" stroke="#6b4a22" stroke-width="10" fill="none" stroke-linecap="round">
          <path d="M480 200 q25 -22 50 0 q25 -22 50 0"/>
          <path d="M700 160 q25 -22 50 0 q25 -22 50 0"/>
        </g>
      </g>
      <g id="sceneB" fill="#6b4a22" filter="url(#sandsoft)">
        <path d="M430 560 Q430 380 640 380 Q850 380 850 560Z"/>
        <rect x="600" y="440" width="80" height="120"/>
        <polygon points="410,380 640,260 870,380"/>
        <circle cx="900" cy="200" r="60"/>
        <path d="M300 600 Q640 560 980 600 L980 620 L300 620Z"/>
      </g>
      <g id="wipe" stroke="#fff8e0" stroke-width="60" stroke-linecap="round" opacity="0.85">
        <line id="wiper" x1="200" y1="360" x2="200" y2="360"/>
      </g>
    </svg>
    <script>
      const SECONDS = 4;
      const A = document.getElementById('sceneA');
      const B = document.getElementById('sceneB');
      const wiper = document.getElementById('wiper');
      const wipe = document.getElementById('wipe');
      window.seekExample = (t) => {
        const phase = (t % SECONDS) / SECONDS;
        const morph = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
        A.setAttribute('opacity', 1 - morph);
        B.setAttribute('opacity', morph);
        const x = 200 + morph * 880;
        wiper.setAttribute('x1', x); wiper.setAttribute('x2', x);
        wiper.setAttribute('y1', 150); wiper.setAttribute('y2', 580);
        wipe.setAttribute('opacity', 0.35 + 0.5 * Math.sin(phase * Math.PI * 2) * Math.sin(phase * Math.PI * 2));
        B.setAttribute('transform', `translate(${(1 - morph) * -60} 0)`);
        A.setAttribute('transform', `translate(${morph * 60} 0)`);
      };
      if (!navigator.webdriver) {
        const loop = (ms) => { window.seekExample(ms / 1000); requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
      }
      window.seekExample(0);
    </script>
  </body>
</html>
