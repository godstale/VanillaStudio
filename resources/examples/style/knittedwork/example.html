<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Knitted work</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#3f4a63;
        font-family:'Segoe UI',system-ui,sans-serif}
      svg{display:block;margin:0 auto}
    </style>
  </head>
  <body>
    <svg width="1280" height="720" viewBox="0 0 1280 720">
      <defs>
        <pattern id="vee" width="46" height="40" patternUnits="userSpaceOnUse">
          <rect width="46" height="40" fill="#c94f5e"/>
          <path d="M4 8l19 24L42 8" fill="none" stroke="#8e2f3c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 8l19 24L42 8" fill="none" stroke="#f2a0a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </pattern>
        <pattern id="rib" width="34" height="26" patternUnits="userSpaceOnUse">
          <rect width="34" height="26" fill="#a83b48"/>
          <rect x="6" width="10" height="26" fill="#c94f5e"/>
          <rect x="22" width="4" height="26" fill="#7c2831"/>
        </pattern>
      </defs>
      <ellipse cx="640" cy="662" rx="290" ry="28" fill="#00000044"/>
      <!-- mitten -->
      <path d="M500 660V330q0-90 90-90h20l30-80q10-24 40-24t40 24l30 80h20q90 0 90 90v70q70 10 60 90l-30 150q-12 60-80 60H580q-80 0-80-60z"
        fill="url(#vee)" stroke="#7c2831" stroke-width="12" stroke-linejoin="round"/>
      <!-- cuff -->
      <rect x="484" y="560" width="312" height="110" rx="18" fill="url(#rib)" stroke="#7c2831" stroke-width="12"/>
      <!-- snowflake motif -->
      <g stroke="#f6e8d8" stroke-width="10" stroke-linecap="round">
        <path d="M640 330v130M575 365l130 60M705 365l-130 60"/>
      </g>
      <circle cx="640" cy="395" r="20" fill="#f6e8d8"/>
      <!-- hanging string -->
      <path d="M640 60v76" stroke="#e8dcc2" stroke-width="10"/>
      <circle cx="640" cy="60" r="14" fill="#e8dcc2"/>
    </svg>
  </body>
</html>
