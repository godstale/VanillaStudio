<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pop tag</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #ffd400; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <rect x="0" y="0" width="1280" height="720" fill="#ffd400" />
      <polygon points="0,0 640,0 480,720 0,720" fill="#ff4f9a" />
      <polygon points="880,0 1280,0 1280,720 720,720" fill="#00b8d9" />
      <g transform="rotate(-8 640 360)">
        <polygon points="640,120 690,300 880,300 720,410 770,590 640,480 510,590 560,410 400,300 590,300"
                 fill="#111" stroke="#f4f1ea" stroke-width="16" stroke-linejoin="round" />
        <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="120" fill="#7bd13c" stroke="#111" stroke-width="10" paint-order="stroke">ZAP!</text>
      </g>
      <g stroke-linecap="round">
        <line x1="220" y1="480" x2="216" y2="580" stroke="#111" stroke-width="12" />
        <line x1="1060" y1="500" x2="1066" y2="600" stroke="#111" stroke-width="12" />
        <circle cx="216" cy="590" r="10" fill="#111" />
        <circle cx="1066" cy="610" r="10" fill="#111" />
      </g>
      <g fill="none" stroke="#f4f1ea" stroke-width="7">
        <path d="M120 140 C200 120 260 150 300 220" />
        <path d="M980 120 C1060 110 1120 140 1150 200" />
      </g>
    </svg>
  </body>
</html>
