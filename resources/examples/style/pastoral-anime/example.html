<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pastoral anime</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
      svg{width:100%;height:100%;display:block}
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <linearGradient id="psky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a9bdc"/><stop offset="0.6" stop-color="#aee3f5"/><stop offset="1" stop-color="#fdf6d8"/>
        </linearGradient>
      </defs>
      <rect width="1280" height="720" fill="url(#psky)"/>
      <g id="clouds" fill="#fff" opacity="0.96">
        <g><ellipse cx="300" cy="150" rx="130" ry="52"/><ellipse cx="390" cy="120" rx="100" ry="60"/><ellipse cx="220" cy="120" rx="80" ry="44"/></g>
        <g><ellipse cx="880" cy="110" rx="160" ry="60"/><ellipse cx="990" cy="140" rx="110" ry="48"/><ellipse cx="780" cy="140" rx="90" ry="40"/></g>
        <g><ellipse cx="620" cy="220" rx="90" ry="34"/><ellipse cx="680" cy="205" rx="70" ry="30"/></g>
      </g>
      <polygon points="0,470 300,330 640,470 980,330 1280,470 1280,720 0,720" fill="#7fae6e"/>
      <polygon points="0,540 340,430 700,540 1040,430 1280,540 1280,720 0,720" fill="#5d9151"/>
      <rect y="600" width="1280" height="120" fill="#4a7a3f"/>
      <g fill="#f5f0dc">
        <rect x="180" y="470" width="90" height="70"/><polygon points="170,470 225,430 280,470" fill="#b5543f"/>
        <rect x="950" y="450" width="110" height="90"/><polygon points="938,450 1005,400 1072,450" fill="#b5543f"/>
        <rect x="600" y="490" width="70" height="55"/><polygon points="592,490 635,458 678,490" fill="#b5543f"/>
      </g>
      <rect x="212" y="492" width="26" height="48" fill="#6b4a2f"/>
      <rect x="992" y="478" width="30" height="62" fill="#6b4a2f"/>
      <g id="grass" stroke="#3c6631" stroke-width="7" stroke-linecap="round" fill="none"></g>
    </svg>
    <script>
      const SECONDS = 4;
      const g = document.getElementById('grass');
      const clouds = document.getElementById('clouds');
      let blades = '';
      const seed = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      for (let i = 0; i < 40; i += 1) {
        const x = 20 + (i / 40) * 1240 + seed(i) * 20;
        const h = 34 + seed(i + 99) * 40;
        blades += `<path data-i="${i}" d="M${x} 700 Q${x + 8} ${700 - h} ${x + 22} ${700 - h - 14}"/>`;
      }
      g.innerHTML = blades;
      const paths = [...g.querySelectorAll('path')];
      window.seekExample = (t) => {
        const phase = (t % SECONDS) / SECONDS;
        clouds.setAttribute('transform', `translate(${40 * Math.sin(phase * Math.PI * 2)} 0)`);
        paths.forEach((p, i) => {
          const sway = 16 * Math.sin(phase * Math.PI * 4 + i * 0.7);
          p.setAttribute('transform', `translate(${sway} 0)`);
        });
      };
      if (!navigator.webdriver) {
        const loop = (ms) => { window.seekExample(ms / 1000); requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
      }
      window.seekExample(0);
    </script>
  </body>
</html>
