<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Paper cut</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#3a3f4a;
        font-family:'Segoe UI',system-ui,sans-serif}
      .frame{position:absolute;left:190px;top:30px;width:900px;height:660px;background:#6e4a26;
        border-radius:14px;box-shadow:0 24px 60px #00000088;overflow:hidden}
      .layer{position:absolute;border-radius:6px}
      .l0{inset:36px;background:linear-gradient(#f7d774,#f2a65c)}
      .sun{position:absolute;left:390px;top:120px;width:150px;height:150px;border-radius:50%;background:#fff3d6}
      .ridge{position:absolute;left:0;right:0}
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="layer l0"></div>
      <div class="sun"></div>
      <svg class="layer ridge" style="inset:36px" width="828" height="588" viewBox="0 0 828 588">
        <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="-12" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
        </defs>
        <g filter="url(#sh)">
          <path d="M0 430L140 300l110 90 130-140 120 130 110-80 120 120 98-60v228H0z" fill="#b0512f"/>
          <path d="M0 500L120 400l110 70 140-110 130 100 120-60 108 80 100-40v138H0z" fill="#7c3a24"/>
          <path d="M0 560l150-60 120 40 150-70 140 50 130-30 138 30v68H0z" fill="#4a2416"/>
        </g>
        <g fill="#2c3a2e">
          <path d="M120 500q10-40 30-50l6 52zM660 470q12-44 34-52l4 54z"/>
        </g>
      </svg>
    </div>
  </body>
</html>
