<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Faded print</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #f4ede0; }
      .frame { width: 1224px; height: 664px; margin: 28px; background: #fbf6ea; box-shadow: 0 0 0 2px #d8c9ac; }
      svg { display: block; width: 1224px; height: 664px; }
    </style>
  </head>
  <body>
    <div class="frame">
      <svg viewBox="0 0 1224 664">
        <rect width="1224" height="664" fill="#f3e3c8" />
        <circle cx="960" cy="150" r="80" fill="#e8b04b" opacity="0.8" />
        <rect width="1224" height="420" fill="#a9c3c9" opacity="0.55" />
        <path d="M0 420 L220 260 L420 420 Z" fill="#8a9a7b" opacity="0.8" />
        <path d="M330 420 L580 240 L830 420 Z" fill="#7a8a6b" opacity="0.8" />
        <path d="M740 420 L960 270 L1224 420 Z" fill="#8a9a7b" opacity="0.8" />
        <rect y="420" width="1224" height="244" fill="#b5a37e" opacity="0.7" />
        <!-- house -->
        <rect x="180" y="430" width="220" height="150" fill="#c96f5a" opacity="0.9" />
        <path d="M160 430 L290 330 L420 430 Z" fill="#7d4a3c" opacity="0.9" />
        <rect x="265" y="490" width="50" height="90" fill="#5d3a30" />
        <rect x="200" y="460" width="44" height="40" fill="#e9f0ef" opacity="0.9" />
        <rect x="336" y="460" width="44" height="40" fill="#e9f0ef" opacity="0.9" />
        <!-- car -->
        <g opacity="0.92">
          <rect x="620" y="500" width="300" height="60" rx="28" fill="#5f7f9e" />
          <rect x="680" y="460" width="170" height="60" rx="26" fill="#5f7f9e" />
          <rect x="700" y="472" width="60" height="40" fill="#e9f0ef" />
          <rect x="770" y="472" width="60" height="40" fill="#e9f0ef" />
          <circle cx="690" cy="566" r="30" fill="#3a3a3a" />
          <circle cx="850" cy="566" r="30" fill="#3a3a3a" />
          <circle cx="690" cy="566" r="12" fill="#cfcfcf" />
          <circle cx="850" cy="566" r="12" fill="#cfcfcf" />
        </g>
        <!-- tree -->
        <rect x="1050" y="470" width="26" height="110" fill="#6b4a35" opacity="0.9" />
        <circle cx="1063" cy="430" r="60" fill="#7ba24f" opacity="0.75" />
        <!-- paper fade + wear -->
        <rect width="1224" height="664" fill="#fbf6ea" opacity="0.35" />
        <ellipse cx="200" cy="120" rx="180" ry="90" fill="#ffffff" opacity="0.25" />
      </svg>
    </div>
  </body>
</html>
