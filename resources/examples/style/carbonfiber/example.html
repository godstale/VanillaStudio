<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Woven panel</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#101216;}
svg{width:1280px;height:720px;display:block;}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<pattern id="twill" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="28" height="14" fill="#1b1e23"/>
<rect y="14" width="28" height="14" fill="#262a31"/>
<rect width="14" height="14" fill="#2e333b"/>
<rect x="14" y="14" width="14" height="14" fill="#14161a"/>
</pattern>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#cfe4ff" stop-opacity="0.35"/><stop offset="0.7" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1280" height="720" fill="#101216"/>
<rect x="90" y="70" width="1100" height="580" rx="26" fill="url(#twill)"/>
<rect x="90" y="70" width="1100" height="580" rx="26" fill="url(#sheen)"/>
<rect x="90" y="70" width="1100" height="580" rx="26" fill="none" stroke="#3d434c" stroke-width="6"/>
<rect x="120" y="100" width="1040" height="26" rx="13" fill="#fff" opacity="0.14"/>
</svg>
</body>
</html>
