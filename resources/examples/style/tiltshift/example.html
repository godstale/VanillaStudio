<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Focus band</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #87a3b8; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <filter id="blurBig" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="12" />
        </filter>
        <clipPath id="band"><rect x="0" y="270" width="1280" height="200" /></clipPath>
      </defs>
      <rect width="1280" height="720" fill="#87a3b8" />
      <!-- blurred world above and below -->
      <g filter="url(#blurBig)">
        <rect width="1280" height="300" fill="#87a3b8" />
        <circle cx="1080" cy="90" r="60" fill="#f2e7c4" />
        <rect x="120" y="120" width="120" height="150" fill="#8a7f74" />
        <rect x="900" y="80" width="150" height="190" fill="#8a7f74" />
        <rect y="470" width="1280" height="250" fill="#6f7f5a" />
        <rect x="80" y="540" width="200" height="120" fill="#5d6b4a" />
        <rect x="1000" y="560" width="220" height="110" fill="#5d6b4a" />
      </g>
      <!-- sharp horizontal band: miniature street -->
      <g clip-path="url(#band)">
        <rect y="270" width="1280" height="200" fill="#9db3a5" />
        <rect y="400" width="1280" height="70" fill="#4a4a4e" />
        <g stroke="#f2e7c4" stroke-width="6" stroke-dasharray="40 30">
          <line x1="0" y1="435" x2="1280" y2="435" />
        </g>
        <g>
          <rect x="90" y="300" width="130" height="100" fill="#c96f5a" />
          <path d="M75 300 L155 250 L235 300 Z" fill="#7d4a3c" />
          <rect x="280" y="290" width="150" height="110" fill="#e0d3b8" />
          <path d="M265 290 L355 235 L445 290 Z" fill="#5f7f9e" />
          <rect x="490" y="305" width="120" height="95" fill="#7ba24f" />
          <rect x="670" y="295" width="160" height="105" fill="#d9a441" />
          <rect x="890" y="310" width="130" height="90" fill="#3f6f8f" />
          <rect x="1080" y="300" width="120" height="100" fill="#c96f5a" />
          <g fill="#2f3a44">
            <rect x="115" y="325" width="30" height="30" /><rect x="160" y="325" width="30" height="30" />
            <rect x="310" y="315" width="32" height="32" /><rect x="360" y="315" width="32" height="32" />
            <rect x="700" y="320" width="34" height="34" /><rect x="760" y="320" width="34" height="34" />
          </g>
        </g>
        <!-- tiny car on the road -->
        <rect x="540" y="408" width="120" height="26" rx="12" fill="#b33a3a" />
        <circle cx="570" cy="436" r="10" fill="#1c1c1c" />
        <circle cx="630" cy="436" r="10" fill="#1c1c1c" />
      </g>
      <!-- blur gradients creeping into the band edges -->
      <rect width="1280" height="300" fill="#87a3b8" opacity="0.35" filter="url(#blurBig)" />
    </svg>
  </body>
</html>
