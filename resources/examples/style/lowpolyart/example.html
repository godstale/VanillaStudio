<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lowpoly art</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #f2ede0;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <svg id="s" viewBox="0 0 1280 720"></svg>
    <script>
      const NS = 'http://www.w3.org/2000/svg';
      const H = (n) => {
        const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
      };
      const mix = (a, b, f) => [
        Math.round(a[0] + (b[0] - a[0]) * f),
        Math.round(a[1] + (b[1] - a[1]) * f),
        Math.round(a[2] + (b[2] - a[2]) * f),
      ];
      const SKY_TOP = [207, 229, 242];
      const SKY_LOW = [127, 182, 217];
      const SUN = [255, 217, 138];
      const LAND_TOP = [111, 162, 135];
      const LAND_LOW = [36, 63, 54];
      const ridge = (x) => 470 - 140 * Math.abs(Math.sin(x * 0.0022 + 0.7)) - 50 * Math.pow(Math.sin(x * 0.009 + 1.9), 2);
      const colorAt = (x, y, k) => {
        const r = ridge(x);
        let c;
        if (y < r) {
          const f = Math.min(1, Math.max(0, y / r));
          c = mix(SKY_TOP, SKY_LOW, f);
          const d = Math.sqrt((x - 990) * (x - 990) + (y - 150) * (y - 150));
          if (d < 280) c = mix(c, SUN, (1 - d / 280) * 0.85);
        } else {
          const f = Math.min(1, Math.max(0, (y - r) / (720 - r)));
          c = mix(LAND_TOP, LAND_LOW, f);
        }
        const shade = 0.9 + 0.2 * H(k);
        return `rgb(${Math.round(c[0] * shade)},${Math.round(c[1] * shade)},${Math.round(c[2] * shade)})`;
      };
      const svg = document.getElementById('s');
      const bg = document.createElementNS(NS, 'rect');
      bg.setAttribute('width', '1280');
      bg.setAttribute('height', '720');
      bg.setAttribute('fill', '#f2ede0');
      svg.appendChild(bg);
      const COLS = 16;
      const ROWS = 9;
      const CW = 80;
      const CH = 80;
      const P = [];
      for (let i = 0; i <= COLS; i += 1) {
        P.push([]);
        for (let j = 0; j <= ROWS; j += 1) {
          const edge = i === 0 || j === 0 || i === COLS || j === ROWS;
          const jx = edge ? 0 : (H(i * 57.3 + j * 11.1) - 0.5) * 52;
          const jy = edge ? 0 : (H(i * 13.7 + j * 91.7) - 0.5) * 52;
          P[i].push([i * CW + jx, j * CH + jy]);
        }
      }
      let k = 0;
      const tri = (a, b, c) => {
        k += 1;
        const cx = (a[0] + b[0] + c[0]) / 3;
        const cy = (a[1] + b[1] + c[1]) / 3;
        const p = document.createElementNS(NS, 'polygon');
        p.setAttribute('points', `${a[0]},${a[1]} ${b[0]},${b[1]} ${c[0]},${c[1]}`);
        p.setAttribute('fill', colorAt(cx, cy, k));
        p.setAttribute('stroke', '#f2ede0');
        p.setAttribute('stroke-width', '3');
        p.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(p);
      };
      for (let i = 0; i < COLS; i += 1) {
        for (let j = 0; j < ROWS; j += 1) {
          tri(P[i][j], P[i + 1][j], P[i][j + 1]);
          tri(P[i + 1][j], P[i + 1][j + 1], P[i][j + 1]);
        }
      }
    </script>
  </body>
</html>
