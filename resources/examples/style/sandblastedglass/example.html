<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Frosted pane</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#2b6a8f;}
svg{width:1280px;height:720px;display:block;}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<filter id="gg" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1280" height="720" fill="#2b6a8f"/>
<g filter="url(#gg)">
<circle cx="250" cy="180" r="120" fill="#e2574c"/>
<circle cx="1050" cy="200" r="150" fill="#f2a541"/>
<circle cx="640" cy="560" r="170" fill="#7ab648"/>
<circle cx="420" cy="420" r="90" fill="#f6e27a"/>
<circle cx="900" cy="500" r="80" fill="#d94f70"/>
<rect x="100" y="480" width="1080" height="120" fill="#3f9e4d"/>
</g>
<rect width="1280" height="720" fill="#eef2f0" opacity="0.62"/>
<g id="grain"></g>
<path d="M640 120 C 560 240 560 420 640 600" stroke="#ffffff" stroke-width="10" fill="none" opacity="0.9"/>
<g id="vine"></g>
<rect x="24" y="24" width="1232" height="672" fill="none" stroke="#3a3f45" stroke-width="18"/>
<rect x="24" y="24" width="1232" height="672" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
</svg>
<script>
const H=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
let g='';
for(let i=0;i<420;i++){g+='<circle cx="'+(H(i)*1280).toFixed(0)+'" cy="'+(H(i+7)*720).toFixed(0)+'" r="1.4" fill="#5a6068" opacity="0.2"/>';}
document.getElementById('grain').innerHTML=g;
let v='';
for(let i=0;i<9;i++){const y=(170+i*48).toFixed(0),s=i%2?1:-1;
v+='<path d="M640 '+y+' q '+(70*s)+' -34 '+(120*s)+' 6" stroke="#ffffff" stroke-width="7" fill="none" opacity="0.9" stroke-linecap="round"/>';
v+='<ellipse cx="'+(640+120*s)+'" cy="'+(Number(y)+6)+'" rx="30" ry="16" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9"/>';}
v+='<circle cx="640" cy="120" r="26" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.95"/>';
document.getElementById('vine').innerHTML=v;
</script>
</body>
</html>
