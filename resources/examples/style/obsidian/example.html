<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Obsidian</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #232028, #08070a 80%); display: grid; place-items: center; }
      svg { width: 640px; height: 560px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 640 560">
      <ellipse cx="320" cy="500" rx="200" ry="20" fill="#000" opacity="0.6" />
      <g stroke="#000" stroke-width="3">
        <polygon points="320,60 430,200 380,350 260,350 210,200" fill="#17151c" />
        <polygon points="320,60 430,200 320,200" fill="#2c2836" />
        <polygon points="320,60 210,200 320,200" fill="#0b0a0e" />
        <polygon points="210,200 320,200 260,350" fill="#211e29" />
        <polygon points="430,200 320,200 380,350" fill="#100e14" />
        <polygon points="260,350 380,350 320,470" fill="#1d1a24" />
        <polygon points="150,300 230,340 190,450 110,420" fill="#141219" />
        <polygon points="490,300 570,330 540,450 470,420" fill="#141219" />
      </g>
      <g stroke="#e8f4ff" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M320 60 L430 200" />
        <path d="M380 350 L320 470" />
        <path d="M210 200 L320 200" />
        <path d="M490 300 L570 330" />
      </g>
      <g stroke="#7fb2d9" stroke-width="3" opacity="0.6">
        <path d="M260 350 L320 470" />
        <path d="M150 300 L230 340" />
      </g>
    </svg>
  </body>
</html>
