<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Photomontage</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #26262a;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
          <rect width="44" height="44" fill="#f4f1ea" />
          <rect width="22" height="44" fill="#141414" />
        </pattern>
        <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
          <rect width="36" height="36" fill="#e8a91c" />
          <circle cx="18" cy="18" r="9" fill="#7d1f2b" />
        </pattern>
      </defs>
      <rect width="1280" height="720" fill="#26262a" />
      <g transform="rotate(-10 880 300)">
        <rect x="660" y="150" width="440" height="300" fill="url(#stripes)" stroke="#f4f1ea" stroke-width="12" />
      </g>
      <g>
        <circle cx="360" cy="330" r="185" fill="#f4f1ea" />
        <circle cx="360" cy="330" r="150" fill="#c22f2f" />
        <circle cx="360" cy="330" r="105" fill="#f4f1ea" />
        <circle cx="360" cy="330" r="62" fill="#141414" />
      </g>
      <g transform="rotate(8 880 560)">
        <circle cx="880" cy="560" r="130" fill="url(#dots)" stroke="#f4f1ea" stroke-width="12" />
      </g>
      <g>
        <path d="M120 620 A150 150 0 0 1 420 620 Z" fill="#e8a91c" stroke="#f4f1ea" stroke-width="12" />
        <circle cx="1050" cy="130" r="72" fill="#2e8f86" stroke="#f4f1ea" stroke-width="12" />
        <rect x="540" y="560" width="260" height="64" fill="#141414" stroke="#f4f1ea" stroke-width="12" transform="rotate(-6 670 592)" />
      </g>
    </svg>
  </body>
</html>
