<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pastel grid</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #1a0f2e; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2b1b4d" />
          <stop offset="45%" stop-color="#ff71ce" />
          <stop offset="70%" stop-color="#ffb86b" />
          <stop offset="100%" stop-color="#1a0f2e" />
        </linearGradient>
        <pattern id="check" width="40" height="40" patternUnits="userSpaceOnUse">
          <rect width="40" height="40" fill="#ffd166" />
          <rect width="20" height="20" fill="#1a0f2e" />
          <rect x="20" y="20" width="20" height="20" fill="#1a0f2e" />
        </pattern>
        <clipPath id="sun"><circle cx="640" cy="400" r="170" /></clipPath>
      </defs>
      <rect width="1280" height="470" fill="url(#sky)" />
      <!-- checkerboard sun -->
      <circle cx="640" cy="400" r="170" fill="#ffd166" />
      <g clip-path="url(#sun)">
        <rect x="470" y="400" width="340" height="170" fill="url(#check)" />
        <rect x="470" y="400" width="340" height="12" fill="#1a0f2e" />
        <rect x="470" y="428" width="340" height="10" fill="#1a0f2e" />
        <rect x="470" y="452" width="340" height="14" fill="#1a0f2e" />
        <rect x="470" y="482" width="340" height="18" fill="#1a0f2e" />
      </g>
      <!-- grid floor -->
      <rect y="470" width="1280" height="250" fill="#140b26" />
      <g stroke="#01cdfe" stroke-width="4">
        <line x1="0" y1="470" x2="1280" y2="470" />
        <line x1="0" y1="510" x2="1280" y2="510" />
        <line x1="0" y1="560" x2="1280" y2="560" />
        <line x1="0" y1="625" x2="1280" y2="625" />
        <line x1="0" y1="700" x2="1280" y2="700" />
      </g>
      <g stroke="#ff71ce" stroke-width="4">
        <line x1="640" y1="470" x2="640" y2="720" />
        <line x1="520" y1="470" x2="380" y2="720" />
        <line x1="760" y1="470" x2="900" y2="720" />
        <line x1="400" y1="470" x2="120" y2="720" />
        <line x1="880" y1="470" x2="1160" y2="720" />
        <line x1="280" y1="470" x2="-80" y2="720" />
        <line x1="1000" y1="470" x2="1360" y2="720" />
      </g>
      <!-- floating retro windows -->
      <g>
        <rect x="150" y="150" width="260" height="190" fill="#0d0b1e" stroke="#01cdfe" stroke-width="6" />
        <rect x="150" y="150" width="260" height="44" fill="#01cdfe" />
        <circle cx="178" cy="172" r="10" fill="#0d0b1e" />
        <circle cx="206" cy="172" r="10" fill="#0d0b1e" />
        <rect x="175" y="220" width="210" height="90" fill="#ff71ce" />
        <rect x="175" y="220" width="210" height="90" fill="none" stroke="#ffd166" stroke-width="5" />
        <line x1="175" y1="265" x2="385" y2="265" stroke="#ffd166" stroke-width="5" />
      </g>
      <g>
        <rect x="880" y="120" width="260" height="190" fill="#0d0b1e" stroke="#ff71ce" stroke-width="6" />
        <rect x="880" y="120" width="260" height="44" fill="#ff71ce" />
        <circle cx="908" cy="142" r="10" fill="#0d0b1e" />
        <circle cx="936" cy="142" r="10" fill="#0d0b1e" />
        <rect x="905" y="190" width="210" height="90" fill="#01cdfe" />
        <circle cx="1010" cy="235" r="34" fill="#ffd166" />
      </g>
      <!-- mountains -->
      <path d="M0 470 L180 330 L330 470 Z" fill="#2b1b4d" />
      <path d="M950 470 L1120 320 L1280 470 Z" fill="#2b1b4d" />
    </svg>
  </body>
</html>
