<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tabletop set</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #d9c7a7; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="8" />
        </filter>
      </defs>
      <rect width="1280" height="720" fill="#d9c7a7" />
      <rect width="1280" height="720" fill="#c9b088" opacity="0.5" />
      <!-- soft shadows -->
      <g fill="#5a4326" opacity="0.28" filter="url(#soft)">
        <ellipse cx="330" cy="400" rx="180" ry="150" />
        <ellipse cx="760" cy="360" rx="170" ry="130" />
        <ellipse cx="1050" cy="420" rx="120" ry="150" />
      </g>
      <!-- plate -->
      <circle cx="330" cy="380" r="150" fill="#f6f1e5" stroke="#b09a72" stroke-width="6" />
      <circle cx="330" cy="380" r="110" fill="none" stroke="#c9b088" stroke-width="4" />
      <circle cx="330" cy="380" r="62" fill="#e0784a" />
      <circle cx="310" cy="360" r="20" fill="#f2a56b" />
      <!-- cup -->
      <rect x="660" y="270" width="150" height="130" rx="18" fill="#3f6f8f" />
      <rect x="660" y="270" width="150" height="34" rx="17" fill="#2c4f66" />
      <ellipse cx="735" cy="272" rx="62" ry="16" fill="#f3e6c8" />
      <path d="M810 300 q60 10 50 70 q-8 50 -60 44" fill="none" stroke="#3f6f8f" stroke-width="20" />
      <!-- notebook -->
      <rect x="950" y="280" width="200" height="250" rx="10" fill="#f6f1e5" stroke="#8a7452" stroke-width="5" transform="rotate(8 1050 405)" />
      <g stroke="#9db6c9" stroke-width="4" transform="rotate(8 1050 405)">
        <line x1="970" y1="340" x2="1130" y2="340" /><line x1="970" y1="375" x2="1130" y2="375" />
        <line x1="970" y1="410" x2="1130" y2="410" /><line x1="970" y1="445" x2="1130" y2="445" />
        <line x1="970" y1="480" x2="1080" y2="480" />
      </g>
      <!-- pencil -->
      <g transform="rotate(-24 560 560)">
        <rect x="470" y="548" width="180" height="24" fill="#d9a441" />
        <path d="M650 548 L686 560 L650 572 Z" fill="#e8c890" />
        <path d="M672 555 L686 560 L672 565 Z" fill="#3a3a3a" />
        <rect x="452" y="548" width="18" height="24" fill="#b9b3a6" />
      </g>
      <!-- sprigs -->
      <g stroke="#5d7d3c" stroke-width="7" fill="#7ba24f">
        <line x1="180" y1="600" x2="280" y2="520" />
        <ellipse cx="220" cy="560" rx="26" ry="14" transform="rotate(-40 220 560)" />
        <ellipse cx="250" cy="536" rx="26" ry="14" transform="rotate(-40 250 536)" />
        <line x1="1060" y1="620" x2="1150" y2="550" />
        <ellipse cx="1100" cy="588" rx="26" ry="14" transform="rotate(-40 1100 588)" />
      </g>
      <!-- glasses -->
      <g fill="none" stroke="#2f2a24" stroke-width="8">
        <circle cx="560" cy="200" r="52" />
        <circle cx="672" cy="200" r="52" />
        <line x1="612" y1="200" x2="620" y2="200" />
      </g>
    </svg>
  </body>
</html>
