<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gold scrolls</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#070a06;}
svg{width:1280px;height:720px;display:block;}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5f14"/><stop offset="0.5" stop-color="#ffe9a0"/><stop offset="1" stop-color="#a3761a"/></linearGradient>
<radialGradient id="velv" cx="0.5" cy="0.42" r="0.75"><stop offset="0" stop-color="#1c2b1a"/><stop offset="1" stop-color="#070a06"/></radialGradient>
</defs>
<rect width="1280" height="720" fill="url(#velv)"/>
<g id="scrolls" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round">
<path id="p0" d="M640 600 C 480 560 420 440 470 340 C 510 260 620 250 650 320 C 670 370 620 410 585 390 C 560 374 570 340 595 342"/>
<path id="p1" d="M640 600 C 800 560 860 440 810 340 C 770 260 660 250 630 320 C 610 370 660 410 695 390 C 720 374 710 340 685 342"/>
<path id="p2" d="M640 600 C 560 500 560 300 640 180 M640 600 C 720 500 720 300 640 180"/>
<path id="p3" d="M400 520 C 300 500 240 420 270 340 C 292 280 370 270 390 330 M880 520 C 980 500 1040 420 1010 340 C 988 280 910 270 890 330"/>
</g>
<circle cx="640" cy="600" r="46" fill="none" stroke="url(#gold)" stroke-width="9"/>
<ellipse cx="640" cy="600" rx="22" ry="26" fill="#a31f3c"/>
<ellipse cx="632" cy="590" rx="7" ry="9" fill="#ffccd6" opacity="0.8"/>
<g id="dots"></g>
</svg>
<script>
const SECONDS=4;
const ids=['p0','p1','p2','p3'],paths=ids.map(i=>document.getElementById(i));
const L=paths.map(p=>{const l=p.getTotalLength();p.setAttribute('stroke-dasharray',l);return l;});
let d='';for(let i=0;i<24;i++){const a=i/24*6.2832;
d+='<circle cx="'+(640+300*Math.cos(a)).toFixed(0)+'" cy="'+(380+220*Math.sin(a)).toFixed(0)+'" r="6" fill="#ffe9a0"/>';}
document.getElementById('dots').innerHTML=d;
window.seekExample=(t)=>{
const p=(t%SECONDS)/SECONDS;
paths.forEach((el,i)=>{const e=Math.min(1,Math.max(0,p*1.35-i*0.09));el.setAttribute('stroke-dashoffset',(L[i]*(1-e)).toFixed(1));});};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}window.seekExample(0);
</script>
</body>
</html>
