<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Felt plushie</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#e3cfa8;
        font-family:'Segoe UI',system-ui,sans-serif}
      .stage{position:relative;width:100%;height:100%;
        background:radial-gradient(circle at 50% 42%,#f2e3c2 0 300px,#e3cfa8 320px)}
      svg{display:block;margin:24px auto}
      .felt stroke,.felt{stroke-linejoin:round}
    </style>
  </head>
  <body>
    <div class="stage">
      <svg width="700" height="672" viewBox="0 0 700 672">
        <ellipse cx="350" cy="620" rx="220" ry="26" fill="#00000022"/>
        <!-- ears -->
        <g>
          <ellipse cx="235" cy="180" rx="78" ry="150" fill="#c96f4a"/>
          <ellipse cx="235" cy="180" rx="78" ry="150" fill="none" stroke="#7a3b22" stroke-width="7" stroke-dasharray="18 12"/>
          <ellipse cx="235" cy="195" rx="36" ry="100" fill="#f6c9a8"/>
          <ellipse cx="235" cy="195" rx="36" ry="100" fill="none" stroke="#7a3b22" stroke-width="5" stroke-dasharray="12 10"/>
          <ellipse cx="465" cy="180" rx="78" ry="150" fill="#c96f4a"/>
          <ellipse cx="465" cy="180" rx="78" ry="150" fill="none" stroke="#7a3b22" stroke-width="7" stroke-dasharray="18 12"/>
          <ellipse cx="465" cy="195" rx="36" ry="100" fill="#f6c9a8"/>
          <ellipse cx="465" cy="195" rx="36" ry="100" fill="none" stroke="#7a3b22" stroke-width="5" stroke-dasharray="12 10"/>
        </g>
        <!-- head -->
        <ellipse cx="350" cy="430" rx="200" ry="175" fill="#f3e2c2"/>
        <ellipse cx="350" cy="430" rx="200" ry="175" fill="none" stroke="#7a3b22" stroke-width="8" stroke-dasharray="20 13"/>
        <ellipse cx="350" cy="430" rx="182" ry="158" fill="none" stroke="#e0b98f" stroke-width="3" stroke-dasharray="4 7"/>
        <!-- muzzle -->
        <ellipse cx="350" cy="490" rx="95" ry="62" fill="#faf3e3"/>
        <ellipse cx="350" cy="490" rx="95" ry="62" fill="none" stroke="#7a3b22" stroke-width="6" stroke-dasharray="14 10"/>
        <!-- eyes -->
        <circle cx="272" cy="400" r="26" fill="#2b2320"/>
        <circle cx="281" cy="391" r="8" fill="#fff"/>
        <circle cx="428" cy="400" r="26" fill="#2b2320"/>
        <circle cx="437" cy="391" r="8" fill="#fff"/>
        <!-- nose + mouth -->
        <path d="M330 478h40l-20 22z" fill="#7a3b22"/>
        <path d="M350 500v26M350 526c-8 14-30 16-38 4M350 526c8 14 30 16 38 4" stroke="#7a3b22" stroke-width="6" fill="none" stroke-linecap="round"/>
        <!-- blush -->
        <ellipse cx="238" cy="470" rx="30" ry="16" fill="#e89a7c" opacity=".8"/>
        <ellipse cx="462" cy="470" rx="30" ry="16" fill="#e89a7c" opacity=".8"/>
      </svg>
    </div>
  </body>
</html>
