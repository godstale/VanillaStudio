<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flat vector</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #8fd0e8;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <rect width="1280" height="720" fill="#8fd0e8" />
      <circle cx="1020" cy="150" r="86" fill="#f6b40e" />
      <g fill="#ffffff">
        <ellipse cx="240" cy="150" rx="120" ry="42" />
        <ellipse cx="340" cy="130" rx="100" ry="40" />
        <ellipse cx="880" cy="230" rx="90" ry="32" />
      </g>
      <ellipse cx="400" cy="720" rx="620" ry="330" fill="#57a773" />
      <ellipse cx="1050" cy="760" rx="560" ry="330" fill="#2f7d4f" />
      <ellipse cx="640" cy="640" rx="180" ry="52" fill="#4fb3d9" />
      <g>
        <rect x="556" y="380" width="168" height="130" fill="#e86a5e" />
        <polygon points="530,390 640,300 750,390" fill="#8c3b34" />
        <rect x="610" y="440" width="60" height="70" fill="#5a2b26" />
        <rect x="486" y="330" width="34" height="70" fill="#8c3b34" />
      </g>
      <g>
        <rect x="168" y="440" width="34" height="110" fill="#7a5230" />
        <circle cx="185" cy="400" r="78" fill="#2f7d4f" />
        <circle cx="135" cy="430" r="52" fill="#3f9e63" />
        <circle cx="235" cy="430" r="52" fill="#3f9e63" />
      </g>
      <g>
        <rect x="1052" y="450" width="34" height="110" fill="#7a5230" />
        <circle cx="1069" cy="410" r="78" fill="#2f7d4f" />
        <circle cx="1019" cy="440" r="52" fill="#3f9e63" />
        <circle cx="1119" cy="440" r="52" fill="#3f9e63" />
      </g>
      <g fill="#ffffff">
        <circle cx="420" cy="600" r="16" />
        <circle cx="470" cy="612" r="12" />
        <circle cx="830" cy="606" r="14" />
      </g>
    </svg>
  </body>
</html>
