<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glass rose</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #14161c; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <rect x="0" y="0" width="1280" height="720" fill="#14161c" />
      <rect x="330" y="20" width="620" height="680" fill="#0c0d11" />
      <g stroke="#0c0d11" stroke-width="12">
        <circle cx="640" cy="360" r="270" fill="#ffd766" />
        <circle cx="640" cy="360" r="270" fill="none" stroke-width="20" />
        <circle cx="640" cy="360" r="150" fill="#ff9a3c" />
        <circle cx="640" cy="360" r="70" fill="#fff3c4" />
        <g fill="#c1272d">
          <polygon points="640,90 700,220 640,260 580,220" />
          <polygon points="640,630 700,500 640,460 580,500" />
          <polygon points="370,360 500,300 540,360 500,420" />
          <polygon points="910,360 780,300 740,360 780,420" />
        </g>
        <g fill="#1f5fa8">
          <polygon points="450,170 560,240 530,300 430,240" />
          <polygon points="830,170 720,240 750,300 850,240" />
          <polygon points="450,550 560,480 530,420 430,480" />
          <polygon points="830,550 720,480 750,420 850,480" />
        </g>
        <g fill="#2e8b57">
          <polygon points="640,90 580,220 530,300 450,170" opacity="0.9" />
          <polygon points="910,360 780,420 750,480 850,480" opacity="0.9" />
        </g>
      </g>
      <circle cx="640" cy="360" r="296" fill="none" stroke="#3a3f4a" stroke-width="18" />
      <ellipse cx="560" cy="240" rx="180" ry="60" fill="#ffffff" opacity="0.14" transform="rotate(-24 560 240)" />
      <rect x="380" y="640" width="520" height="26" fill="#3a3f4a" />
    </svg>
  </body>
</html>
