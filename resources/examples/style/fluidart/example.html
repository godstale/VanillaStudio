<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fluid art</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #08131a;
      }
      canvas {
        width: 1280px;
        height: 720px;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="720"></canvas>
    <script>
      const SECONDS = 4;
      const W = 192;
      const H = 108;
      const cv = document.getElementById('c');
      const ctx = cv.getContext('2d');
      const buf = document.createElement('canvas');
      buf.width = W;
      buf.height = H;
      const btx = buf.getContext('2d');
      const img = btx.createImageData(W, H);
      const N = (x, y) => Math.sin(x * 1.7 + Math.sin(y * 2.3) * 1.3) * Math.sin(y * 1.3 + Math.sin(x * 1.9) * 1.1);
      const C = [
        [8, 62, 72],
        [196, 44, 122],
        [232, 150, 60],
        [242, 232, 210],
      ];
      const mix = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];

      // Pure function of t: domain-warped noise fields drift with the phase.
      window.seekExample = (t) => {
        const ph = ((t % SECONDS) / SECONDS) * Math.PI * 2;
        const d = img.data;
        let k = 0;
        for (let j = 0; j < H; j += 1) {
          const y = (j / H) * 3.2;
          for (let i = 0; i < W; i += 1) {
            const x = (i / W) * 3.2;
            const q = N(x + ph * 0.25, y + 0.7) + N(x + 1.3, y - ph * 0.2);
            const w = N(x + q * 0.9 + ph * 0.15, y + q * 0.7);
            const v = N(x + q, y + w - ph * 0.1);
            const s = Math.sin((v + q * 0.5) * 3.0 + ph * 0.4);
            let f = (s + 1) / 2;
            f = f * f * (3 - 2 * f);
            let col = mix(C[0], C[1], f);
            const g = Math.min(1, Math.max(0, (w + 0.6) / 1.2));
            col = mix(col, C[2], g * 0.45 * f);
            const vein = Math.pow(1 - Math.abs(s), 10);
            col = mix(col, C[3], Math.min(1, vein * 1.6));
            d[k] = col[0];
            d[k + 1] = col[1];
            d[k + 2] = col[2];
            d[k + 3] = 255;
            k += 4;
          }
        }
        btx.putImageData(img, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(buf, 0, 0, 1280, 720);
      };

      if (!navigator.webdriver) {
        const loop = (ms) => {
          window.seekExample(ms / 1000);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
      window.seekExample(0);
    </script>
  </body>
</html>
