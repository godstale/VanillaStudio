<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cross section</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #efe9dc;
        display: grid; place-items: center; font-family: 'Segoe UI', system-ui, sans-serif; }
      svg { width: 1050px; height: 620px; }
      text { font-size: 24px; fill: #4a4238; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1050 620">
      <defs>
        <pattern id="hatch" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <rect width="12" height="12" fill="#d9cfae" />
          <line x1="0" y1="0" x2="0" y2="12" stroke="#8a7a5c" stroke-width="3" />
        </pattern>
      </defs>
      <rect x="60" y="560" width="930" height="20" fill="#8a7a5c" />
      <g>
        <rect x="150" y="120" width="420" height="440" fill="#f7f2e6" stroke="#4a4238" stroke-width="4" />
        <rect x="150" y="120" width="40" height="440" fill="url(#hatch)" />
        <rect x="530" y="120" width="40" height="440" fill="url(#hatch)" />
        <path d="M190 260 H530 M190 400 H530" stroke="#4a4238" stroke-width="3" />
        <rect x="230" y="180" width="90" height="60" fill="#9fc4dd" stroke="#4a4238" stroke-width="3" />
        <rect x="380" y="300" width="90" height="80" fill="#c9a878" stroke="#4a4238" stroke-width="3" />
        <rect x="230" y="440" width="120" height="80" fill="#b5c9a8" stroke="#4a4238" stroke-width="3" />
        <text x="640" y="200">03 Roof deck</text>
        <text x="640" y="340">02 Studio</text>
        <text x="640" y="480">01 Lobby</text>
        <path d="M570 190 H620 M570 330 H620 M570 470 H620" stroke="#4a4238" stroke-width="3" />
      </g>
      <polygon points="150,120 360,40 780,40 570,120" fill="#d9cfae" stroke="#4a4238" stroke-width="4" />
    </svg>
  </body>
</html>
