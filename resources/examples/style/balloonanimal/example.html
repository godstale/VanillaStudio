<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Balloon dog</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
      body { background: linear-gradient(180deg, #bfe3f2 0%, #e8f4f8 60%, #f5e6c8 60.5%, #e0cda3 100%); }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720" width="1280" height="720">
      <defs>
        <linearGradient id="bal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff7d8a" />
          <stop offset="45%" stop-color="#f43f5e" />
          <stop offset="100%" stop-color="#b91c3f" />
        </linearGradient>
      </defs>
      <ellipse cx="640" cy="620" rx="380" ry="34" fill="#8a6f45" opacity="0.35" />
      <g stroke="#8f1330" stroke-width="6">
        <!-- body -->
        <rect x="430" y="400" width="420" height="110" rx="55" fill="url(#bal)" />
        <!-- legs -->
        <rect x="470" y="490" width="62" height="120" rx="31" fill="url(#bal)" />
        <rect x="580" y="490" width="62" height="120" rx="31" fill="url(#bal)" />
        <rect x="700" y="490" width="62" height="120" rx="31" fill="url(#bal)" />
        <rect x="790" y="490" width="62" height="120" rx="31" fill="url(#bal)" />
        <!-- neck and head -->
        <rect x="830" y="270" width="70" height="150" rx="35" fill="url(#bal)" />
        <rect x="810" y="200" width="170" height="95" rx="47" fill="url(#bal)" />
        <!-- snout -->
        <rect x="950" y="222" width="90" height="60" rx="30" fill="url(#bal)" />
        <!-- ears -->
        <rect x="820" y="110" width="52" height="105" rx="26" fill="url(#bal)" />
        <rect x="890" y="110" width="52" height="105" rx="26" fill="url(#bal)" />
        <!-- tail -->
        <rect x="380" y="330" width="52" height="110" rx="26" fill="url(#bal)" transform="rotate(28 406 385)" />
      </g>
      <!-- pinched joints -->
      <g fill="#8f1330">
        <polygon points="836,300 856,322 836,344" />
        <polygon points="836,420 856,442 836,464" />
        <circle cx="501" cy="498" r="10" /><circle cx="611" cy="498" r="10" /><circle cx="731" cy="498" r="10" /><circle cx="821" cy="498" r="10" />
        <circle cx="952" cy="252" r="9" />
        <circle cx="404" cy="352" r="9" />
      </g>
      <!-- glossy highlights -->
      <g fill="#ffffff" opacity="0.65">
        <rect x="455" y="414" width="330" height="16" rx="8" />
        <rect x="480" y="500" width="18" height="80" rx="9" />
        <rect x="590" y="500" width="18" height="80" rx="9" />
        <rect x="710" y="500" width="18" height="80" rx="9" />
        <rect x="845" y="285" width="18" height="100" rx="9" />
        <rect x="830" y="214" width="110" height="14" rx="7" />
      </g>
      <!-- face -->
      <circle cx="880" cy="248" r="11" fill="#3a0a18" />
      <circle cx="1022" cy="252" r="13" fill="#3a0a18" />
    </svg>
  </body>
</html>
