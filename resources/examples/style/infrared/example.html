<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pale woods</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0a0f24; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#05071a" />
          <stop offset="70%" stop-color="#131a3d" />
          <stop offset="100%" stop-color="#1e2650" />
        </linearGradient>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="12" />
        </filter>
      </defs>
      <rect width="1280" height="720" fill="url(#night)" />
      <circle cx="1020" cy="130" r="60" fill="#f4f6ff" />
      <circle cx="1020" cy="130" r="95" fill="#cdd6ff" opacity="0.3" filter="url(#soft)" />
      <ellipse cx="640" cy="700" rx="700" ry="120" fill="#e8ecf7" />
      <!-- trunks stay dark -->
      <g fill="#0c0f1e">
        <rect x="180" y="330" width="34" height="300" />
        <rect x="430" y="280" width="42" height="350" />
        <rect x="700" y="310" width="36" height="320" />
        <rect x="940" y="350" width="30" height="280" />
        <rect x="1120" y="300" width="38" height="330" />
      </g>
      <!-- foliage mapped to white-pink -->
      <g>
        <ellipse cx="197" cy="280" rx="150" ry="110" fill="#fdf3f7" />
        <ellipse cx="150" cy="330" rx="90" ry="70" fill="#f5c6dd" />
        <ellipse cx="451" cy="220" rx="180" ry="125" fill="#ffffff" />
        <ellipse cx="400" cy="280" rx="100" ry="75" fill="#f0b8d4" />
        <ellipse cx="718" cy="255" rx="160" ry="115" fill="#fdf3f7" />
        <ellipse cx="770" cy="310" rx="90" ry="66" fill="#f5c6dd" />
        <ellipse cx="955" cy="300" rx="120" ry="90" fill="#ffffff" />
        <ellipse cx="1139" cy="245" rx="150" ry="110" fill="#fdf3f7" />
        <ellipse cx="1090" cy="300" rx="90" ry="66" fill="#f0b8d4" />
      </g>
      <g fill="#dfe5f5" opacity="0.8">
        <ellipse cx="320" cy="640" rx="120" ry="26" />
        <ellipse cx="800" cy="660" rx="150" ry="28" />
      </g>
    </svg>
  </body>
</html>
