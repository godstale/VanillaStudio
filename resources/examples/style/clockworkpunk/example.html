<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>clockwork punk</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#2b2118}
      svg{width:100%;height:100%;display:block}
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <radialGradient id="brass" cx="0.4" cy="0.35" r="0.9">
          <stop offset="0" stop-color="#f2d98c"/><stop offset="0.55" stop-color="#b98a3c"/><stop offset="1" stop-color="#6b4a22"/>
        </radialGradient>
      </defs>
      <rect width="1280" height="720" fill="#2b2118"/>
      <g id="plate" stroke="#8a6a3a" stroke-width="3" opacity="0.6"></g>
      <g id="gears"></g>
      <rect x="80" y="60" width="1120" height="600" fill="none" stroke="#c99a4a" stroke-width="10"/>
      <circle cx="80" cy="60" r="14" fill="#c99a4a"/><circle cx="1200" cy="60" r="14" fill="#c99a4a"/>
      <circle cx="80" cy="660" r="14" fill="#c99a4a"/><circle cx="1200" cy="660" r="14" fill="#c99a4a"/>
    </svg>
    <script>
      const seed = (i) => { const x = Math.sin(i * 241.7 + 17.3) * 31147.9211; return x - Math.floor(x); };
      let p = '';
      for (let i = 0; i < 12; i += 1) for (let j = 0; j < 8; j += 1) p += `<circle cx="${140 + i * 92}" cy="${110 + j * 72}" r="3" fill="none"/>`;
      document.getElementById('plate').innerHTML = p;
      const gear = (cx, cy, r, teeth, rot) => {
        let d = '';
        for (let k = 0; k < teeth; k += 1) {
          const a = (k / teeth) * 6.2832 + rot;
          const x1 = cx + (r - 14) * Math.cos(a), y1 = cy + (r - 14) * Math.sin(a);
          const x2 = cx + (r + 16) * Math.cos(a), y2 = cy + (r + 16) * Math.sin(a);
          d += `<line x1="${x1.toFixed(0)}" y1="${y1.toFixed(0)}" x2="${x2.toFixed(0)}" y2="${y2.toFixed(0)}" stroke="#8a5f24" stroke-width="18"/>`;
        }
        let spokes = '';
        for (let k = 0; k < 5; k += 1) {
          const a = (k / 5) * 6.2832 + rot;
          spokes += `<line x1="${cx}" y1="${cy}" x2="${(cx + (r - 22) * Math.cos(a)).toFixed(0)}" y2="${(cy + (r - 22) * Math.sin(a)).toFixed(0)}" stroke="#5a3a18" stroke-width="14"/>`;
        }
        return `${d}<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#brass)" stroke="#4a2f14" stroke-width="8"/>${spokes}<circle cx="${cx}" cy="${cy}" r="26" fill="#2b2118" stroke="#4a2f14" stroke-width="8"/>`;
      };
      document.getElementById('gears').innerHTML =
        gear(400, 360, 170, 16, 0.1) + gear(700, 260, 120, 12, 0.35) + gear(720, 500, 100, 10, 0.6) + gear(950, 380, 130, 14, 0.2);
    </script>
  </body>
</html>
