<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cutout art</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #9a8f7d;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <rect width="1280" height="720" fill="#9a8f7d" />
      <polygon
        points="60,40 320,70 300,180 620,150 610,260 900,240 920,340 640,360 660,470 340,450 360,560 120,540 140,660 40,660 40,40"
        fill="#3f7d7a"
      />
      <polygon
        points="880,120 950,180 930,250 990,300 950,370 980,440 910,480 850,430 800,470 780,390 720,350 770,300 740,230 800,190"
        fill="#d9a441"
      />
      <polygon
        points="120,470 260,440 300,500 460,470 520,540 480,620 560,680 400,700 300,660 180,690 100,620 140,550"
        fill="#4a7a3a"
      />
      <polygon
        points="620,420 760,400 820,460 780,540 640,560 580,490"
        fill="#c1553b"
      />
      <polygon points="950,520 1130,500 1180,580 1120,660 970,670 920,590" fill="#31435c" />
      <circle cx="905" cy="300" r="46" fill="#f3e9d0" />
      <g fill="#e8dcc0" opacity="0.8">
        <rect x="40" y="90" width="190" height="56" transform="rotate(-14 135 118)" />
        <rect x="700" y="330" width="190" height="56" transform="rotate(10 795 358)" />
        <rect x="180" y="560" width="190" height="56" transform="rotate(-8 275 588)" />
        <rect x="960" y="560" width="170" height="56" transform="rotate(18 1045 588)" />
      </g>
    </svg>
  </body>
</html>
