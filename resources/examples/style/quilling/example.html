<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quilling</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f3ead6;
        font-family:'Segoe UI',system-ui,sans-serif}
      svg{display:block;margin:0 auto}
    </style>
  </head>
  <body>
    <svg width="1280" height="720" viewBox="0 0 1280 720">
      <defs>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="9"/>
        </filter>
      </defs>
      <!-- contact shadows -->
      <g fill="#000000" opacity=".14" filter="url(#soft)">
        <ellipse cx="640" cy="330" rx="255" ry="200"/>
        <ellipse cx="400" cy="560" rx="150" ry="60"/>
        <ellipse cx="880" cy="560" rx="150" ry="60"/>
      </g>
      <!-- stem -->
      <path d="M640 470v180" stroke="#4a7c3a" stroke-width="18" stroke-linecap="round"/>
      <!-- leaves: marquise coils -->
      <g id="leaves"></g>
      <!-- petals -->
      <g id="coils"></g>
      <!-- center coil -->
      <g id="hub"></g>
    </svg>
    <script>
      const NS = 'http://www.w3.org/2000/svg';
      const C = document.getElementById('coils');
      const H = document.getElementById('hub');
      const L = document.getElementById('leaves');
      const rings = (g, cx, cy, rr, col, edge) => {
        for (let i = 0; i < rr.length; i++) {
          const e = document.createElementNS(NS, 'circle');
          e.setAttribute('cx', cx); e.setAttribute('cy', cy);
          e.setAttribute('r', rr[i]);
          e.setAttribute('fill', i % 2 ? '#fdf6e3' : col);
          e.setAttribute('stroke', edge); e.setAttribute('stroke-width', '5');
          g.appendChild(e);
        }
        const dot = document.createElementNS(NS, 'circle');
        dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
        dot.setAttribute('r', '7'); dot.setAttribute('fill', edge);
        g.appendChild(dot);
      };
      const petal = [[52, 40, 28, 16], [58, 44, 30, 16]];
      for (let p = 0; p < 8; p++) {
        const a = (p / 8) * Math.PI * 2 - Math.PI / 2;
        const col = p % 2 ? '#e56b8a' : '#d94f70';
        rings(C, 640 + Math.cos(a) * 150, 300 + Math.sin(a) * 150, p % 2 ? petal[1] : petal[0], col, '#a02848');
      }
      rings(H, 640, 300, [46, 34, 22, 11], '#e8b53a', '#8a5f10');
      // leaves as concentric ellipses
      const leaf = (cx, cy, flip) => {
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') rotate(' + (flip ? -28 : 28) + ')');
        [[86, 40], [68, 31], [50, 22], [32, 14]].reverse().forEach(([rx, ry], i) => {
          const e = document.createElementNS(NS, 'ellipse');
          e.setAttribute('rx', rx); e.setAttribute('ry', ry);
          e.setAttribute('fill', i % 2 ? '#6aa152' : '#eef4e4');
          e.setAttribute('stroke', '#3d6631'); e.setAttribute('stroke-width', '5');
          g.appendChild(e);
        });
        L.appendChild(g);
      };
      leaf(450, 560, true); leaf(830, 560, false);
    </script>
  </body>
</html>
