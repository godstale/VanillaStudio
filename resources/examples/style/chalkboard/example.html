<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>chalkboard</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
      svg{width:100%;height:100%;display:block}
      .chalk{fill:none;stroke:#f4f1e6;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .dim{stroke-opacity:0.55}
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <rect width="1280" height="720" fill="#2e3b38"/>
      <rect x="0" y="0" width="1280" height="720" fill="none" stroke="#7a5c3e" stroke-width="44"/>
      <g id="board">
        <circle class="chalk" id="c1" cx="280" cy="300" r="130"/>
        <line class="chalk" id="c2" x1="280" y1="170" x2="280" y2="430"/>
        <line class="chalk" id="c3" x1="150" y1="300" x2="410" y2="300"/>
        <ellipse class="chalk dim" id="c4" cx="280" cy="300" rx="130" ry="52"/>
        <rect class="chalk" id="c5" x="560" y="140" width="300" height="200" rx="10"/>
        <path class="chalk" id="c6" d="M560 240 L700 140 L860 240 L700 340 Z"/>
        <line class="chalk dim" id="c7" x1="640" y1="420" x2="1080" y2="420"/>
        <path class="chalk" id="c8" d="M640 470 Q760 380 880 470 T1120 470"/>
        <path class="chalk dim" id="c9" d="M640 540 L700 540 L670 600 Z M740 540 h90 M900 540 l60 60 M980 600 l60 -60"/>
      </g>
    </svg>
    <script>
      const SECONDS = 4;
      const ids = ['c1','c2','c3','c4','c5','c6','c7','c8','c9'];
      const els = ids.map((id) => document.getElementById(id));
      const lens = els.map((el) => {
        if (el.getTotalLength) { try { return el.getTotalLength(); } catch (e) { return 600; } }
        return 2 * Math.PI * 130;
      });
      els.forEach((el, i) => {
        el.style.strokeDasharray = lens[i];
        el.style.strokeDashoffset = lens[i];
      });
      window.seekExample = (t) => {
        const phase = (t % SECONDS) / SECONDS;
        els.forEach((el, i) => {
          const start = i / (els.length + 1);
          const local = Math.min(1, Math.max(0, (phase - start) * (els.length + 1)));
          el.style.strokeDashoffset = lens[i] * (1 - local);
          el.style.opacity = local <= 0 ? 0 : 1;
        });
      };
      if (!navigator.webdriver) {
        const loop = (ms) => { window.seekExample(ms / 1000); requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
      }
      window.seekExample(0);
    </script>
  </body>
</html>
