<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>g</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#e9dfc9}
svg{display:block;width:1280px;height:720px}
</style></head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<filter id="dry"><feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
</defs>
<rect width="1280" height="720" fill="#e9dfc9"/>
<rect y="0" width="1280" height="440" fill="#3f6ea5"/>
<circle cx="1020" cy="150" r="95" fill="#e8b93c"/>
<path d="M0 470 Q320 420 640 455 T1280 445 V720 H0Z" fill="#5d7f43"/>
<g filter="url(#dry)">
<path d="M330 470 L640 250 L950 470 Z" fill="#a8432f"/>
<rect x="430" y="330" width="420" height="220" fill="#c65a3a"/>
<rect x="600" y="400" width="80" height="150" fill="#4a2c1c"/>
<rect x="470" y="380" width="70" height="60" fill="#f2e6c8"/>
<rect x="740" y="380" width="70" height="60" fill="#f2e6c8"/>
<path d="M330 470 L640 250 L950 470 L910 470 L640 300 L370 470 Z" fill="#7e2f20"/>
<rect x="120" y="520" width="180" height="60" fill="#8a9a4b"/>
<rect x="980" y="530" width="200" height="60" fill="#8a9a4b"/>
<g id="trees"></g>
</g>
<rect x="470" y="380" width="70" height="60" fill="none" stroke="#4a2c1c" stroke-width="8"/>
<rect x="740" y="380" width="70" height="60" fill="none" stroke="#4a2c1c" stroke-width="8"/>
</svg>
<script>
(function(){
function h(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
var g=document.getElementById('trees'),s='';
var i,x;
for(i=0;i<14;i++){x=40+h(i*3)*1200;
var y=500+h(i*7)*120,sz=40+h(i*11)*40;
s+='<g><rect x="'+(x-8).toFixed(0)+'" y="'+y.toFixed(0)+'" width="16" height="46" fill="#5a3d22"/>';
s+='<circle cx="'+x.toFixed(0)+'" cy="'+(y-10).toFixed(0)+'" r="'+sz.toFixed(0)+'" fill="'+(i%2?'#3f6b2f':'#548239')+'"/></g>';}
g.innerHTML=s;
})();
</script>
</body>
</html>
