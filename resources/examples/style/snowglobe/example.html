<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snowglobe</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden;
        background: linear-gradient(#1c2a3a, #0c141d); display: grid; place-items: center; }
      svg { width: 640px; height: 640px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 640 640">
      <defs><clipPath id="dome"><circle cx="320" cy="280" r="210" /></clipPath></defs>
      <ellipse cx="320" cy="590" rx="200" ry="22" fill="#000" opacity="0.5" />
      <rect x="180" y="520" width="280" height="60" rx="10" fill="#5e3a1e" />
      <rect x="200" y="540" width="240" height="14" rx="7" fill="#c9a227" />
      <g clip-path="url(#dome)">
        <circle cx="320" cy="280" r="210" fill="#9fc4dd" />
        <ellipse cx="320" cy="420" rx="200" ry="70" fill="#eef6fa" />
        <g>
          <rect x="250" y="330" width="60" height="60" fill="#b3541e" />
          <polygon points="250,330 280,295 310,330" fill="#7c3a10" />
          <rect x="330" y="350" width="44" height="40" fill="#2c4a63" />
          <polygon points="330,350 352,322 374,350" fill="#1c2f42" />
        </g>
        <g id="snow" fill="#fff"></g>
        <circle cx="320" cy="280" r="210" fill="none" stroke="#dcebf5" stroke-width="14" opacity="0.85" />
        <path d="M160 200 Q220 120 320 105" stroke="#fff" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round" />
      </g>
    </svg>
    <script>
      const SECONDS = 6;
      const N = 60;
      // Fixed-seed pseudo random: pure function of index, no Math.random.
      const rnd = (i, s) => {
        const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const snow = document.getElementById('snow');
      let html = '';
      for (let i = 0; i < N; i += 1) {
        html += `<circle data-i="${i}" r="${2 + rnd(i, 1) * 3}" />`;
      }
      snow.innerHTML = html;
      const flakes = [...snow.children];
      window.seekExample = (t) => {
        const phase = ((t % SECONDS) + SECONDS) % SECONDS / SECONDS;
        flakes.forEach((f, k) => {
          const i = Number(f.dataset.i);
          const x = 130 + rnd(i, 2) * 380;
          const fall = (rnd(i, 3) + phase * (0.25 + rnd(i, 4) * 0.4)) % 1;
          const y = 90 + fall * 380;
          const sway = Math.sin((phase * 6.28 + rnd(i, 5) * 6.28)) * 12;
          f.setAttribute('cx', x + sway);
          f.setAttribute('cy', y);
          f.setAttribute('opacity', 0.5 + rnd(i, 6) * 0.5);
        });
      };
      if (!navigator.webdriver) {
        const loop = (ms) => { window.seekExample(ms / 1000); requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
      }
      window.seekExample(0);
    </script>
  </body>
</html>
