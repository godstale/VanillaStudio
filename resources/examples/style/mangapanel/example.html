<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>manga panel</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fff}
      svg{width:100%;height:100%;display:block}
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <pattern id="tone" width="12" height="12" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="2.2" fill="#111"/><circle cx="9" cy="9" r="2.2" fill="#111"/>
        </pattern>
        <pattern id="tone2" width="9" height="9" patternUnits="userSpaceOnUse">
          <circle cx="4.5" cy="4.5" r="1.6" fill="#111"/>
        </pattern>
      </defs>
      <rect width="1280" height="720" fill="#fff"/>
      <g stroke="#111" stroke-width="10">
        <rect x="40" y="40" width="580" height="640" fill="#fff"/>
        <rect x="660" y="40" width="580" height="300" fill="#fff"/>
        <rect x="660" y="380" width="580" height="300" fill="#111"/>
      </g>
      <circle cx="330" cy="330" r="120" fill="url(#tone)" stroke="#111" stroke-width="9"/>
      <circle cx="330" cy="330" r="120" fill="none" stroke="#111" stroke-width="9"/>
      <circle cx="300" cy="310" r="30" fill="#fff" stroke="#111" stroke-width="7"/>
      <circle cx="362" cy="310" r="30" fill="#fff" stroke="#111" stroke-width="7"/>
      <circle cx="302" cy="314" r="10" fill="#111"/><circle cx="360" cy="314" r="10" fill="#111"/>
      <path d="M290 400 Q330 430 370 400" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round"/>
      <rect x="90" y="500" width="480" height="120" fill="url(#tone2)" stroke="#111" stroke-width="7"/>
      <rect x="700" y="70" width="500" height="240" fill="url(#tone)" stroke="#111" stroke-width="7"/>
      <polygon points="830,280 800,340 860,340" fill="#111"/>
      <polygon points="1000,280 970,340 1030,340" fill="#111"/>
      <polygon points="1120,280 1090,340 1150,340" fill="#111"/>
      <g id="speedB" stroke="#111" stroke-width="7"></g>
      <ellipse cx="950" cy="530" rx="230" ry="110" fill="#fff" stroke="#fff" stroke-width="6"/>
      <path d="M760 530 Q950 420 1140 530 Q950 640 760 530Z" fill="#fff" stroke="#fff" stroke-width="6"/>
      <g id="speedW" stroke="#fff" stroke-width="7"></g>
      <ellipse cx="950" cy="530" rx="150" ry="60" fill="none" stroke="#fff" stroke-width="8"/>
    </svg>
    <script>
      const seed = (i) => { const x = Math.sin(i * 391.7 + 57.1) * 18913.8211; return x - Math.floor(x); };
      let s = '';
      for (let i = 0; i < 26; i += 1) {
        const a = seed(i) * 6.28;
        const r0 = 60 + seed(i + 40) * 40, r1 = 130 + seed(i + 60) * 30, r2 = 250 + seed(i + 80) * 80;
        const y = (r) => (530 + r * Math.sin(a) * 0.55).toFixed(0);
        const x = (r) => (950 + r * Math.cos(a)).toFixed(0);
        s += `<line x1="${x(r0)}" y1="${y(r0)}" x2="${x(r1)}" y2="${y(r1)}"/>`;
        document.getElementById('speedW').innerHTML += `<line x1="${x(r1)}" y1="${y(r1)}" x2="${x(r2)}" y2="${y(r2)}"/>`;
      }
      document.getElementById('speedB').innerHTML = s;
    </script>
  </body>
</html>
