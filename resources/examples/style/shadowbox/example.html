<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shadow box</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#22242c;
        font-family:'Segoe UI',system-ui,sans-serif}
      .box{position:absolute;left:290px;top:26px;width:700px;height:668px;background:#4a3220;
        border-radius:12px;box-shadow:0 30px 70px #000000aa,inset 0 0 0 10px #33241a}
      .layer{position:absolute;border-radius:4px}
    </style>
  </head>
  <body>
    <div class="box">
      <div class="layer" style="inset:44px;background:linear-gradient(#2c3a55,#7a90ad)"></div>
      <div class="layer" style="inset:44px;display:grid;place-items:center">
        <div style="width:190px;height:190px;border-radius:50%;background:#fdf3d0;box-shadow:0 0 70px #fdf3d0"></div>
      </div>
      <svg class="layer" style="inset:44px" width="612" height="580" viewBox="0 0 612 580">
        <defs><filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".55"/></filter>
        </defs>
        <g filter="url(#inner)">
          <path d="M0 380L110 290l90 60 110-90 100 80 90-50 112 70v220H0z" fill="#5a6a7a"/>
          <path d="M0 460l130-70 110 50 120-60 120 50 132-30v180H0z" fill="#3a4450"/>
          <path d="M0 530l150-40 140 30 150-40 172 10v90H0z" fill="#232a33"/>
        </g>
        <g fill="#232a33">
          <rect x="90" y="330" width="14" height="70"/><ellipse cx="97" cy="320" rx="42" ry="30"/>
          <rect x="480" y="350" width="14" height="70"/><ellipse cx="487" cy="340" rx="42" ry="30"/>
        </g>
        <g fill="#f6e8d8"><circle cx="160" cy="120" r="5"/><circle cx="300" cy="80" r="4"/><circle cx="430" cy="150" r="5"/><circle cx="520" cy="90" r="4"/></g>
      </svg>
      <div class="layer" style="inset:44px;box-shadow:inset 0 0 90px #00000099"></div>
    </div>
  </body>
</html>
