<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>sm</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f3eee1}
svg{display:block;width:1280px;height:720px}
</style></head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<filter id="ink" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
<linearGradient id="stalk" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#2b2b2e"/><stop offset=".5" stop-color="#6b6b66"/><stop offset="1" stop-color="#2b2b2e"/>
</linearGradient>
</defs>
<rect width="1280" height="720" fill="#f3eee1"/>
<!-- faint fiber texture -->
<g id="fib" opacity=".5"></g>
<!-- three confident bamboo stalks -->
<g stroke-linecap="round">
<path d="M420 700 L440 420 L430 140" stroke="url(#stalk)" stroke-width="26" fill="none" filter="url(#ink)"/>
<path d="M650 700 L640 380 L655 90" stroke="url(#stalk)" stroke-width="30" fill="none" filter="url(#ink)"/>
<path d="M880 700 L900 450 L890 200" stroke="url(#stalk)" stroke-width="22" fill="none" filter="url(#ink)"/>
<g stroke="#2b2b2e" stroke-width="7">
<line x1="408" y1="540" x2="452" y2="540"/>
<line x1="414" y1="380" x2="456" y2="378"/>
<line x1="612" y1="520" x2="660" y2="518"/>
<line x1="618" y1="340" x2="664" y2="338"/>
<line x1="872" y1="560" x2="912" y2="558"/>
<line x1="878" y1="400" x2="916" y2="398"/>
</g>
<!-- leaves: single confident strokes -->
<g id="lv" fill="#2e2e32"></g>
</g>
<rect x="150" y="540" width="70" height="70" rx="6" fill="#a83a2c"/>
</svg>
<script>
(function(){
function h(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
var lv=document.getElementById('lv'),s='';
var bases=[[440,420],[430,140],[640,380],[655,90],[900,450],[890,200]];
for(var i=0;i<42;i++){
var b=bases[i%bases.length];
var dir=i%2?1:-1;
var x=b[0]+dir*(30+h(i+3)*130),y=b[1]+(h(i+7)-.5)*120;
var len=70+h(i+11)*90;
var mx=(b[0]+x)/2,my=(b[1]+y)/2;
var dx=x-b[0],dy=y-b[1],L=Math.sqrt(dx*dx+dy*dy)||1;
var nx=(-dy/L*7).toFixed(1),ny=(dx/L*7).toFixed(1);
s+='<path d="M'+b[0]+' '+b[1]+' Q'+(mx+ +nx).toFixed(0)+' '+(my+ +ny).toFixed(0)+' '+x.toFixed(0)+' '+y.toFixed(0)+' Q'+(mx-nx).toFixed(0)+' '+(my-ny).toFixed(0)+' '+b[0]+' '+b[1]+' Z" fill="#2e2e32" opacity=".9"/>';
}
lv.innerHTML=s;
var f=document.getElementById('fib'),t='';
for(var k=0;k<90;k++){var y2=h(k+500)*720;
t+='<line x1="0" y1="'+y2.toFixed(0)+'" x2="1280" y2="'+y2.toFixed(0)+'" stroke="#d8d0bc" stroke-width="1" opacity=".6"/>';}
f.innerHTML=t;
})();
</script>
</body>
</html>
