<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Android bust</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0b0e14; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <radialGradient id="bg" cx="50%" cy="38%" r="75%">
          <stop offset="0%" stop-color="#1c2635" />
          <stop offset="100%" stop-color="#0b0e14" />
        </radialGradient>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#3a4356" />
          <stop offset="45%" stop-color="#9aa6bd" />
          <stop offset="55%" stop-color="#7c879c" />
          <stop offset="100%" stop-color="#2c3342" />
        </linearGradient>
        <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#222936" />
          <stop offset="50%" stop-color="#4a5468" />
          <stop offset="100%" stop-color="#1b212d" />
        </linearGradient>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="9" />
        </filter>
      </defs>
      <rect width="1280" height="720" fill="url(#bg)" />
      <ellipse cx="640" cy="660" rx="330" ry="40" fill="#000" opacity="0.55" />
      <!-- shoulders -->
      <path d="M340 720 Q350 560 520 530 L760 530 Q930 560 940 720 Z" fill="url(#dark)" stroke="#12161f" stroke-width="6" />
      <path d="M470 560 h340 M410 620 h460 M380 680 h520" stroke="#12161f" stroke-width="5" />
      <!-- glowing chest joint -->
      <ellipse cx="640" cy="640" rx="120" ry="26" fill="#22d3ee" opacity="0.35" filter="url(#soft)" />
      <rect x="530" y="628" width="220" height="22" rx="11" fill="#0e2a33" stroke="#22d3ee" stroke-width="4" />
      <circle cx="640" cy="639" r="9" fill="#a5f3fc" />
      <!-- neck -->
      <rect x="585" y="440" width="110" height="110" fill="url(#steel)" stroke="#12161f" stroke-width="6" />
      <line x1="585" y1="475" x2="695" y2="475" stroke="#12161f" stroke-width="4" />
      <line x1="585" y1="512" x2="695" y2="512" stroke="#12161f" stroke-width="4" />
      <circle cx="640" cy="493" r="10" fill="#22d3ee" filter="url(#soft)" />
      <circle cx="640" cy="493" r="5" fill="#d9fbff" />
      <!-- head -->
      <rect x="500" y="180" width="280" height="280" rx="90" fill="url(#steel)" stroke="#12161f" stroke-width="7" />
      <line x1="640" y1="180" x2="640" y2="250" stroke="#12161f" stroke-width="5" />
      <line x1="500" y1="330" x2="560" y2="330" stroke="#12161f" stroke-width="4" />
      <line x1="720" y1="330" x2="780" y2="330" stroke="#12161f" stroke-width="4" />
      <!-- eyes -->
      <ellipse cx="640" cy="300" rx="130" ry="34" fill="#22d3ee" opacity="0.3" filter="url(#soft)" />
      <rect x="560" y="288" width="70" height="22" rx="11" fill="#062a33" stroke="#22d3ee" stroke-width="4" />
      <rect x="650" y="288" width="70" height="22" rx="11" fill="#062a33" stroke="#22d3ee" stroke-width="4" />
      <rect x="568" y="293" width="54" height="12" rx="6" fill="#a5f3fc" />
      <rect x="658" y="293" width="54" height="12" rx="6" fill="#a5f3fc" />
      <!-- temple joints -->
      <circle cx="500" cy="330" r="22" fill="#22d3ee" opacity="0.35" filter="url(#soft)" />
      <circle cx="780" cy="330" r="22" fill="#22d3ee" opacity="0.35" filter="url(#soft)" />
      <circle cx="500" cy="330" r="11" fill="#0e2a33" stroke="#a5f3fc" stroke-width="4" />
      <circle cx="780" cy="330" r="11" fill="#0e2a33" stroke="#a5f3fc" stroke-width="4" />
      <!-- circuit traces on cheeks and shoulders -->
      <g fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.9">
        <path d="M560 380 h60 v40 h60" />
        <path d="M720 380 h-60 v40 h-30" />
        <path d="M430 600 h80 v40" />
        <path d="M850 600 h-80 v40" />
      </g>
      <g fill="#a5f3fc">
        <circle cx="560" cy="380" r="7" />
        <circle cx="680" cy="420" r="7" />
        <circle cx="720" cy="380" r="7" />
        <circle cx="630" cy="420" r="7" />
        <circle cx="430" cy="600" r="7" />
        <circle cx="510" cy="640" r="7" />
        <circle cx="850" cy="600" r="7" />
        <circle cx="770" cy="640" r="7" />
      </g>
      <!-- mouth grille -->
      <g stroke="#12161f" stroke-width="5">
        <line x1="590" y1="400" x2="690" y2="400" />
        <line x1="596" y1="414" x2="684" y2="414" />
      </g>
    </svg>
  </body>
</html>
