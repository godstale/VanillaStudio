<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>retro anime 80s</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden}
      svg{width:100%;height:100%;display:block}
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0b1026"/><stop offset="0.6" stop-color="#3b1d5a"/><stop offset="1" stop-color="#ff6e7f"/>
        </linearGradient>
        <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fffbe8"/><stop offset="0.7" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <rect width="1280" height="720" fill="url(#nsky)"/>
      <g id="stars" fill="#fff"></g>
      <circle cx="1020" cy="140" r="120" fill="url(#moon)" opacity="0.8"/>
      <circle cx="1020" cy="140" r="52" fill="#fff7d6"/>
      <g filter="url(#soft)">
        <rect x="80" y="330" width="120" height="250" fill="#1c2340"/>
        <rect x="230" y="260" width="140" height="320" fill="#232b4d"/>
        <rect x="400" y="350" width="100" height="230" fill="#1c2340"/>
        <rect x="530" y="230" width="150" height="350" fill="#2a1f45"/>
        <rect x="710" y="310" width="120" height="270" fill="#1c2340"/>
        <rect x="860" y="250" width="130" height="330" fill="#232b4d"/>
      </g>
      <g id="wins" fill="#ffd166"></g>
      <rect y="580" width="1280" height="140" fill="#120e24"/>
      <g stroke="#ff4fd8" stroke-width="4" opacity="0.9">
        <line x1="0" y1="610" x2="1280" y2="610"/><line x1="0" y1="640" x2="1280" y2="640"/><line x1="0" y1="675" x2="1280" y2="675"/>
      </g>
      <g stroke="#4fd8ff" stroke-width="3" opacity="0.7">
        <line x1="200" y1="580" x2="80" y2="720"/><line x1="500" y1="580" x2="440" y2="720"/><line x1="780" y1="580" x2="840" y2="720"/><line x1="1080" y1="580" x2="1200" y2="720"/>
      </g>
      <ellipse cx="640" cy="580" rx="420" ry="26" fill="#ff4fd8" opacity="0.35" filter="url(#soft)"/>
    </svg>
    <script>
      const seed = (i) => { const x = Math.sin(i * 269.5 + 183.3) * 28001.8384; return x - Math.floor(x); };
      let s = '';
      for (let i = 0; i < 110; i += 1) s += `<circle cx="${(seed(i) * 1280).toFixed(0)}" cy="${(seed(i + 500) * 300).toFixed(0)}" r="${(0.8 + seed(i + 900) * 1.8).toFixed(1)}" opacity="${(0.4 + seed(i + 1300) * 0.6).toFixed(2)}"/>`;
      document.getElementById('stars').innerHTML = s;
      let w = '';
      const blocks = [[80,330,120,250],[230,260,140,320],[530,230,150,350],[860,250,130,330]];
      blocks.forEach(([x, y, bw, bh], bi) => {
        for (let r = 0; r < 6; r += 1) for (let c = 0; c < 3; c += 1) {
          if (seed(bi * 31 + r * 7 + c * 13) > 0.45) w += `<rect x="${x + 12 + c * 34}" y="${y + 16 + r * 38}" width="20" height="24"/>`;
        }
      });
      document.getElementById('wins').innerHTML = w;
    </script>
  </body>
</html>
