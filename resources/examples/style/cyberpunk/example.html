<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rain street</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #070a16; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0b1030" />
          <stop offset="60%" stop-color="#3b1d5e" />
          <stop offset="100%" stop-color="#0a0d1d" />
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#141a38" />
          <stop offset="100%" stop-color="#05060f" />
        </linearGradient>
        <linearGradient id="signP" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff5ad2" />
          <stop offset="100%" stop-color="#a3127e" />
        </linearGradient>
        <linearGradient id="signC" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5af2ff" />
          <stop offset="100%" stop-color="#0e7fa8" />
        </linearGradient>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="10" />
        </filter>
      </defs>
      <rect width="1280" height="520" fill="url(#sky)" />
      <circle cx="640" cy="150" r="60" fill="#f2e7ff" opacity="0.85" />
      <circle cx="640" cy="150" r="95" fill="#b79bff" opacity="0.25" filter="url(#soft)" />
      <!-- towers -->
      <g>
        <rect x="40" y="60" width="200" height="460" fill="#0d1124" />
        <rect x="280" y="150" width="150" height="370" fill="#11162c" />
        <rect x="850" y="120" width="160" height="400" fill="#11162c" />
        <rect x="1040" y="40" width="200" height="480" fill="#0d1124" />
        <g fill="#ffd166" opacity="0.9">
          <rect x="60" y="90" width="26" height="20" /><rect x="100" y="90" width="26" height="20" />
          <rect x="60" y="125" width="26" height="20" /><rect x="140" y="125" width="26" height="20" />
          <rect x="870" y="150" width="26" height="20" /><rect x="910" y="190" width="26" height="20" />
          <rect x="1060" y="80" width="26" height="20" /><rect x="1100" y="120" width="26" height="20" />
        </g>
        <g fill="#5af2ff" opacity="0.9">
          <rect x="140" y="90" width="26" height="20" /><rect x="100" y="160" width="26" height="20" />
          <rect x="300" y="180" width="24" height="18" /><rect x="340" y="230" width="24" height="18" />
          <rect x="870" y="230" width="26" height="20" /><rect x="1060" y="160" width="26" height="20" />
        </g>
        <g fill="#ff5ad2" opacity="0.9">
          <rect x="60" y="160" width="26" height="20" /><rect x="300" y="280" width="24" height="18" />
          <rect x="910" y="150" width="26" height="20" /><rect x="1100" y="200" width="26" height="20" />
        </g>
      </g>
      <!-- signs -->
      <rect x="255" y="230" width="34" height="200" rx="14" fill="url(#signP)" />
      <rect x="255" y="230" width="34" height="200" rx="14" fill="#ff5ad2" opacity="0.4" filter="url(#soft)" />
      <rect x="990" y="200" width="34" height="220" rx="14" fill="url(#signC)" />
      <rect x="990" y="200" width="34" height="220" rx="14" fill="#5af2ff" opacity="0.4" filter="url(#soft)" />
      <!-- haze bands -->
      <rect x="0" y="330" width="1280" height="50" fill="#8f7bff" opacity="0.16" />
      <rect x="0" y="420" width="1280" height="60" fill="#5af2ff" opacity="0.12" />
      <!-- wet road -->
      <rect y="520" width="1280" height="200" fill="url(#road)" />
      <g opacity="0.55" filter="url(#soft)">
        <rect x="248" y="525" width="48" height="150" fill="#ff5ad2" />
        <rect x="983" y="525" width="48" height="160" fill="#5af2ff" />
        <rect x="615" y="525" width="50" height="120" fill="#b79bff" />
        <rect x="70" y="525" width="30" height="110" fill="#ffd166" />
        <rect x="1070" y="525" width="30" height="110" fill="#ffd166" />
      </g>
      <g stroke="#cfe6ff" stroke-width="3" opacity="0.35">
        <line x1="120" y1="540" x2="112" y2="600" /><line x1="420" y1="540" x2="412" y2="600" />
        <line x1="700" y1="540" x2="692" y2="600" /><line x1="980" y1="540" x2="972" y2="600" />
        <line x1="260" y1="560" x2="252" y2="620" /><line x1="560" y1="560" x2="552" y2="620" />
        <line x1="860" y1="560" x2="852" y2="620" /><line x1="1150" y1="560" x2="1142" y2="620" />
      </g>
    </svg>
  </body>
</html>
