<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>charcoal drawing</title>
    <style>
      html,body{margin:0;width:1280px;height:720px;overflow:hidden}
      svg{width:100%;height:100%;display:block}
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
          <feComposite in="SourceGraphic" in2="n" operator="in"/>
        </filter>
        <filter id="smudge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <rect width="1280" height="720" fill="#d9cfbd"/>
      <g id="paper" stroke="#b8ab90" stroke-width="2" opacity="0.5"></g>
      <ellipse cx="640" cy="420" rx="230" ry="200" fill="#8a8071" filter="url(#smudge)" opacity="0.8"/>
      <ellipse cx="600" cy="380" rx="150" ry="150" fill="#3a3733" filter="url(#smudge)"/>
      <ellipse cx="640" cy="400" rx="170" ry="170" fill="none" stroke="#1c1a18" stroke-width="22" filter="url(#grain)"/>
      <path d="M500 300 Q560 220 680 230 Q790 245 800 340" fill="none" stroke="#1c1a18" stroke-width="18" stroke-linecap="round" filter="url(#grain)"/>
      <path d="M480 420 Q470 520 560 570 Q680 620 770 540" fill="none" stroke="#1c1a18" stroke-width="16" stroke-linecap="round" filter="url(#grain)"/>
      <g id="strokes" stroke="#1c1a18" stroke-linecap="round" filter="url(#grain)"></g>
      <ellipse cx="585" cy="370" rx="26" ry="30" fill="#d9cfbd" opacity="0.85"/>
      <ellipse cx="700" cy="365" rx="30" ry="24" fill="#d9cfbd" opacity="0.8"/>
    </svg>
    <script>
      const seed = (i) => { const x = Math.sin(i * 377.7 + 131.1) * 24113.6111; return x - Math.floor(x); };
      let p = '';
      for (let i = 0; i < 40; i += 1) {
        const x = 100 + seed(i) * 1080, y = 60 + seed(i + 90) * 600;
        p += `<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x + 40 + seed(i + 50) * 90).toFixed(0)}" y2="${(y + (seed(i + 70) - 0.5) * 30).toFixed(0)}" stroke-width="${(2 + seed(i + 30) * 5).toFixed(1)}" opacity="${(0.15 + seed(i + 10) * 0.3).toFixed(2)}"/>`;
      }
      document.getElementById('paper').innerHTML = p;
      let s = '';
      for (let i = 0; i < 26; i += 1) {
        const y = 250 + i * 13;
        s += `<path d="M${(470 + seed(i) * 30).toFixed(0)} ${y} Q640 ${y + 26} ${(810 - seed(i + 5) * 30).toFixed(0)} ${y - 8}" stroke-width="${(5 + seed(i + 15) * 7).toFixed(1)}" fill="none" opacity="0.85"/>`;
      }
      document.getElementById('strokes').innerHTML = s;
    </script>
  </body>
</html>
