<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sorting grid</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #ddd6c4; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <rect width="1280" height="720" fill="#ddd6c4" />
      <g stroke="#b3a98f" stroke-width="3">
        <line x1="240" y1="140" x2="1040" y2="140" />
        <line x1="240" y1="300" x2="1040" y2="300" />
        <line x1="240" y1="460" x2="1040" y2="460" />
        <line x1="240" y1="600" x2="1040" y2="600" />
        <line x1="240" y1="140" x2="240" y2="600" />
        <line x1="440" y1="140" x2="440" y2="600" />
        <line x1="640" y1="140" x2="640" y2="600" />
        <line x1="840" y1="140" x2="840" y2="600" />
        <line x1="1040" y1="140" x2="1040" y2="600" />
      </g>
      <g id="parts" stroke-linejoin="round">
        <g id="p0"><circle r="52" fill="#b33a3a" stroke="#5d1d1d" stroke-width="8" /><circle r="18" fill="#ddd6c4" /></g>
        <g id="p1"><rect x="-60" y="-40" width="120" height="80" rx="10" fill="#3f6f8f" stroke="#223c4d" stroke-width="8" /><line x1="-40" y1="0" x2="40" y2="0" stroke="#223c4d" stroke-width="8" /></g>
        <g id="p2"><path d="M-55 30 L0 -45 L55 30 Z" fill="#d9a441" stroke="#6b4a15" stroke-width="8" /><circle cy="5" r="12" fill="#6b4a15" /></g>
        <g id="p3"><rect x="-25" y="-60" width="50" height="120" rx="22" fill="#5d7d3c" stroke="#2c3d1c" stroke-width="8" /><circle cy="-60" r="16" fill="none" stroke="#2c3d1c" stroke-width="8" /></g>
        <g id="p4"><circle r="48" fill="#7b2ff7" stroke="#3d177c" stroke-width="8" /><circle r="48" fill="none" stroke="#c9aaff" stroke-width="4" stroke-dasharray="14 10" /></g>
        <g id="p5"><rect x="-55" y="-55" width="110" height="110" rx="14" fill="#e0d3b8" stroke="#6b5f45" stroke-width="8" /><line x1="-30" y1="-25" x2="30" y2="-25" stroke="#6b5f45" stroke-width="7" /><line x1="-30" y1="5" x2="30" y2="5" stroke="#6b5f45" stroke-width="7" /></g>
        <g id="p6"><path d="M-60 20 L-20 -30 L20 20 L60 -40 L60 40 L-60 40 Z" fill="#3a3f4a" stroke="#171a20" stroke-width="8" /></g>
        <g id="p7"><ellipse rx="60" ry="38" fill="#e0784a" stroke="#5d2f15" stroke-width="8" /><line x1="-35" y1="0" x2="35" y2="0" stroke="#5d2f15" stroke-width="7" /></g>
      </g>
    </svg>
    <script>
      const SECONDS = 3;
      const grid = [[340, 220], [540, 220], [740, 220], [940, 220], [340, 530], [540, 530], [740, 530], [940, 530]];
      const scatter = [[150, 620, 40], [1130, 200, -35], [150, 120, 70], [1150, 560, -60], [640, 90, 25], [90, 380, -50], [1190, 380, 55], [640, 660, -30]];
      const parts = [];
      for (let i = 0; i < 8; i += 1) parts.push(document.getElementById(`p${i}`));
      const ease = (x) => x * x * (3 - 2 * x);
      const clamp01 = (x) => Math.min(1, Math.max(0, x));

      window.seekExample = (t) => {
        const phase = (t % SECONDS) / SECONDS;
        for (let i = 0; i < 8; i += 1) {
          const local = ease(clamp01((phase * 1.25 - i * 0.05) / 0.55));
          const x = scatter[i][0] + (grid[i][0] - scatter[i][0]) * local;
          const y = scatter[i][1] + (grid[i][1] - scatter[i][1]) * local;
          const r = scatter[i][2] * (1 - local);
          parts[i].setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(1)})`);
        }
      };

      if (!navigator.webdriver) {
        const loop = (ms) => {
          window.seekExample(ms / 1000);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
      window.seekExample(0);
    </script>
  </body>
</html>
