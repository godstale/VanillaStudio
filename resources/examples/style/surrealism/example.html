<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>su</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#dfe8ee}
svg{display:block;width:1280px;height:720px}
</style></head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<linearGradient id="ssky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#a8c8d8"/><stop offset=".7" stop-color="#dfe8ee"/><stop offset="1" stop-color="#efe6d2"/>
</linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#ssky)"/>
<circle cx="300" cy="140" r="70" fill="#f7f2e2" opacity=".95"/>
<!-- empty plain -->
<path d="M0 480 H1280 V720 H0Z" fill="#e3d3ae"/>
<path d="M0 480 H1280 V500 H0Z" fill="#c9b489"/>
<ellipse cx="880" cy="470" rx="180" ry="16" fill="#8a7350" opacity=".5"/>
<!-- long calm shadows -->
<g fill="#6b5a40" opacity=".45">
<polygon points="880,470 1150,640 1090,650 860,480"/>
<polygon points="480,560 700,700 660,710 450,570"/>
<polygon points="240,600 360,700 330,710 215,605"/>
</g>
<!-- impossible object: floating rock with tree, stairs to nowhere -->
<g>
<ellipse cx="880" cy="300" rx="40" ry="10" fill="#6b5a40" opacity=".35"/>
<path d="M790 300 L830 380 L930 380 L970 300 Q880 270 790 300Z" fill="#8a7350"/>
<path d="M790 300 L830 380 L880 380 L850 295Z" fill="#6e5a3e"/>
<rect x="872" y="200" width="14" height="80" fill="#4a3a28"/>
<ellipse cx="880" cy="185" rx="60" ry="34" fill="#4d7f52"/>
<ellipse cx="850" cy="175" rx="30" ry="20" fill="#6fa05e"/>
<!-- staircase rising off the rock into sky -->
<g fill="#b09c80" stroke="#4a3a28" stroke-width="5">
<rect x="930" y="270" width="44" height="18"/>
<rect x="958" y="248" width="44" height="18"/>
<rect x="986" y="226" width="44" height="18"/>
<rect x="1014" y="204" width="44" height="18"/>
</g>
</g>
<!-- giant key standing on plain -->
<g transform="rotate(12 480 430)">
<rect x="466" y="330" width="28" height="230" rx="10" fill="#b8894f" stroke="#4a3a28" stroke-width="6"/>
<circle cx="480" cy="300" r="46" fill="none" stroke="#b8894f" stroke-width="26"/>
<circle cx="480" cy="300" r="46" fill="none" stroke="#4a3a28" stroke-width="6"/>
<rect x="494" y="500" width="44" height="20" fill="#b8894f" stroke="#4a3a28" stroke-width="6"/>
<rect x="494" y="530" width="30" height="20" fill="#b8894f" stroke="#4a3a28" stroke-width="6"/>
</g>
<!-- small drifting boat on sand -->
<path d="M180 590 Q240 640 330 595 L310 575 Q240 610 200 572Z" fill="#7a5a3a"/>
</svg>
</body>
</html>
