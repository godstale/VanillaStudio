<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pinned notes</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#6e5232;}
svg{width:1280px;height:720px;display:block;}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#6e5232"/>
<rect x="110" y="60" width="1060" height="600" fill="#b0824a"/>
<g id="speck"></g>
<g transform="rotate(-6 400 340)">
<rect x="260" y="200" width="280" height="280" fill="#fdf6e0"/>
<rect x="260" y="200" width="280" height="280" fill="#000" opacity="0.12"/>
<g stroke="#8a93a0" stroke-width="5" stroke-linecap="round"><line x1="290" y1="260" x2="510" y2="260"/><line x1="290" y1="300" x2="470" y2="300"/><line x1="290" y1="340" x2="510" y2="340"/><line x1="290" y1="380" x2="430" y2="380"/></g>
<circle cx="400" cy="222" r="14" fill="#c93a3a"/><circle cx="395" cy="217" r="5" fill="#ff8a8a"/>
</g>
<g transform="rotate(5 850 360)">
<rect x="720" y="220" width="260" height="280" fill="#fff3a8"/>
<g stroke="#8a93a0" stroke-width="5" stroke-linecap="round"><line x1="750" y1="300" x2="950" y2="300"/><line x1="750" y1="340" x2="910" y2="340"/><line x1="750" y1="380" x2="950" y2="380"/></g>
<circle cx="850" cy="244" r="14" fill="#2a5fc9"/><circle cx="845" cy="239" r="5" fill="#9dc0ff"/>
</g>
<g transform="rotate(-3 620 480)">
<rect x="500" y="400" width="240" height="180" fill="#d6ecff"/>
<rect x="520" y="440" width="200" height="100" fill="#9dc4e4"/>
<circle cx="620" cy="420" r="14" fill="#2a9d4a"/><circle cx="615" cy="415" r="5" fill="#b8f2c6"/>
</g>
</svg>
<script>
const H=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
let s='';
for(let i=0;i<420;i++){s+='<ellipse cx="'+(120+H(i)*1040).toFixed(0)+'" cy="'+(70+H(i+1)*580).toFixed(0)+'" rx="'+(2+H(i+2)*5).toFixed(1)+'" ry="'+(1.5+H(i+3)*3).toFixed(1)+'" fill="'+(H(i+4)<0.5?'#7a5426':'#d8ab6a')+'" opacity="0.6"/>';}
document.getElementById('speck').innerHTML=s;
</script>
</body>
</html>
