<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dot tone</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #f4efe2; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <rect x="0" y="0" width="1280" height="720" fill="#f4efe2" />
      <g id="dots" fill="#1d1a15"></g>
    </svg>
    <script>
      const g = document.getElementById('dots');
      const tone = (x, y) => {
        const dx = (x - 640) / 330, dy = (y - 330) / 260;
        const head = dx * dx + dy * dy;
        const sunX = (x - 950) / 130, sunY = (y - 170) / 130;
        const sun = sunX * sunX + sunY * sunY;
        let v = 0.12 + 0.25 * (y / 720);
        if (head < 1) v = 0.85 - 0.15 * head;
        if (sun < 1) v = 0.9;
        if (y > 560) v = Math.max(v, 0.55);
        return Math.min(1, Math.max(0, v));
      };
      let s = '';
      for (let r = 0; r < 44; r++) {
        for (let c = 0; c < 78; c++) {
          const x = 12 + c * 16.2, y = 12 + r * 16.2;
          const rad = (tone(x, y) * 7.4).toFixed(2);
          if (rad > 0.4) s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad}" />`;
        }
      }
      g.innerHTML = s;
    </script>
  </body>
</html>
