<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tile fish</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #3a3733; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <rect x="0" y="0" width="1280" height="720" fill="#3a3733" />
      <rect x="240" y="60" width="800" height="600" fill="#3a3733" />
      <g id="tiles"></g>
      <rect x="240" y="60" width="800" height="600" fill="none" stroke="#201d1a" stroke-width="16" />
    </svg>
    <script>
      const g = document.getElementById('tiles');
      const h = (n) => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
      const inBody = (x, y) => ((x - 640) * (x - 640)) / (300 * 300) + ((y - 360) * (y - 360)) / (150 * 150) < 1;
      const inTail = (x, y) => x > 880 && x < 1010 && Math.abs(y - 360) < (x - 880) * 0.55;
      const inEye = (x, y) => ((x - 470) * (x - 470)) + ((y - 330) * (y - 330)) < 26 * 26;
      const inFin = (x, y) => ((x - 640) * (x - 640)) / (90 * 90) + ((y - 230) * (y - 230)) / (50 * 50) < 1;
      let s = '';
      let k = 0;
      for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 20; c++) {
          const x = 244 + c * 40, y = 64 + r * 40;
          const jx = (h(k) - 0.5) * 9, jy = (h(k + 999) - 0.5) * 9;
          const cx = x + 20, cy = y + 20;
          let f;
          if (inEye(cx, cy)) f = '#201d1a';
          else if (inBody(cx, cy)) f = ['#e8e2d0', '#e8b48c', '#d97b4a', '#7fb3c8'][Math.floor(h(k + 7) * 4)];
          else if (inTail(cx, cy) || inFin(cx, cy)) f = '#d97b4a';
          else f = ['#2e6b7a', '#35809b', '#2e6b7a', '#4090ab'][Math.floor(h(k + 13) * 4)];
          s += `<polygon points="${(x + 3 + jx).toFixed(1)},${(y + 3 + jy).toFixed(1)} ${(x + 37 + jx).toFixed(1)},${(y + 5 - jy).toFixed(1)} ${(x + 35 - jx).toFixed(1)},${(y + 37 + jy).toFixed(1)} ${(x + 5 + jx).toFixed(1)},${(y + 35 - jy).toFixed(1)}" fill="${f}" />`;
          k++;
        }
      }
      g.innerHTML = s;
    </script>
  </body>
</html>
