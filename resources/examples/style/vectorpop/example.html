<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vector pop</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #f4f1ea;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <rect width="1280" height="720" fill="#f4f1ea" />
      <g fill="#141414">
        <polygon points="0,0 260,0 120,140 0,140" />
        <polygon points="340,0 460,0 320,140 200,140" />
        <polygon points="1020,580 1160,580 1280,720 1140,720" />
        <polygon points="820,580 940,580 1060,720 940,720" />
      </g>
      <g transform="translate(640 350)">
        <rect x="-230" y="-230" width="460" height="460" fill="#e4002b" />
        <rect x="-230" y="-230" width="460" height="460" fill="#e4002b" transform="rotate(30)" />
        <rect x="-230" y="-230" width="460" height="460" fill="#e4002b" transform="rotate(60)" />
        <circle r="160" fill="#e4002b" />
      </g>
      <polygon
        points="700,110 520,390 622,390 580,610 780,310 668,310"
        fill="#141414"
      />
      <polygon points="180,420 260,420 220,300" fill="#e4002b" />
      <polygon points="1060,180 1140,180 1100,300" fill="#141414" />
      <polygon points="960,520 1070,520 1015,640" fill="#e4002b" />
      <circle cx="230" cy="540" r="34" fill="#141414" />
      <circle cx="1050" cy="470" r="26" fill="#141414" />
      <circle cx="330" cy="180" r="22" fill="#e4002b" />
    </svg>
  </body>
</html>
