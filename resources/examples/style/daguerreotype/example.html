<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Brass oval</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #241a12; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720">
      <defs>
        <radialGradient id="brass" cx="50%" cy="42%" r="65%">
          <stop offset="0%" stop-color="#f2d98c" />
          <stop offset="55%" stop-color="#b08a3e" />
          <stop offset="100%" stop-color="#5d451c" />
        </radialGradient>
        <radialGradient id="plate" cx="42%" cy="34%" r="85%">
          <stop offset="0%" stop-color="#f0f0f2" />
          <stop offset="45%" stop-color="#b9bdc6" />
          <stop offset="80%" stop-color="#83878f" />
          <stop offset="100%" stop-color="#5f636c" />
        </radialGradient>
        <clipPath id="oval"><ellipse cx="640" cy="360" rx="250" ry="300" /></clipPath>
      </defs>
      <rect width="1280" height="720" fill="#241a12" />
      <rect x="120" y="60" width="1040" height="600" rx="26" fill="#17100a" />
      <ellipse cx="640" cy="360" rx="300" ry="330" fill="url(#brass)" />
      <ellipse cx="640" cy="360" rx="272" ry="308" fill="#3a2c14" />
      <ellipse cx="640" cy="360" rx="250" ry="290" fill="url(#plate)" />
      <g clip-path="url(#oval)">
        <!-- sitter bust -->
        <ellipse cx="640" cy="720" rx="200" ry="170" fill="#54575f" />
        <rect x="600" y="430" width="80" height="120" fill="#4a4d55" />
        <circle cx="640" cy="330" r="105" fill="#5b5e67" />
        <circle cx="640" cy="330" r="105" fill="none" stroke="#43464d" stroke-width="6" />
        <path d="M550 290 q90 -70 180 0 l-14 -70 q-76 -44 -152 0 Z" fill="#3f4249" />
        <ellipse cx="610" cy="330" rx="34" ry="44" fill="#6e7178" opacity="0.7" />
        <!-- mirror sheen -->
        <path d="M500 60 L610 60 L480 660 L410 660 Z" fill="#ffffff" opacity="0.22" />
        <!-- tarnish only at the rim -->
        <g fill="#33302a" opacity="0.85">
          <ellipse cx="420" cy="120" rx="70" ry="52" />
          <ellipse cx="860" cy="140" rx="76" ry="56" />
          <ellipse cx="410" cy="600" rx="72" ry="60" />
          <ellipse cx="870" cy="590" rx="70" ry="62" />
        </g>
        <g fill="#5c5545" opacity="0.55">
          <ellipse cx="455" cy="160" rx="36" ry="26" />
          <ellipse cx="825" cy="180" rx="38" ry="28" />
          <ellipse cx="450" cy="560" rx="38" ry="30" />
          <ellipse cx="830" cy="555" rx="36" ry="30" />
        </g>
      </g>
      <ellipse cx="640" cy="360" rx="250" ry="290" fill="none" stroke="#8a6a2c" stroke-width="6" />
    </svg>
  </body>
</html>
