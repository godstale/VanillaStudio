<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lowpoly valley</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
      body { background: #bfe0f2; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1280 720" width="1280" height="720">
      <rect x="0" y="0" width="1280" height="720" fill="#bfe0f2" />
      <circle cx="960" cy="150" r="70" fill="#fff6d8" />
      <circle cx="960" cy="150" r="110" fill="#fff6d8" opacity="0.3" />
      <!-- far mountains: cool facets -->
      <g stroke="#5a6b8c" stroke-width="3">
        <polygon points="0,470 180,220 360,470" fill="#8fa3c7" />
        <polygon points="180,220 270,345 360,470 180,470" fill="#6b7fa8" />
        <polygon points="180,220 240,300 130,310" fill="#e8eef7" />
        <polygon points="280,470 520,180 760,470" fill="#7d90b8" />
        <polygon points="520,180 640,330 760,470 520,470" fill="#5d7099" />
        <polygon points="520,180 580,260 470,270" fill="#eef2fa" />
        <polygon points="700,470 950,240 1200,470" fill="#8fa3c7" />
        <polygon points="950,240 1070,360 1200,470 950,470" fill="#677b9f" />
      </g>
      <!-- mid hills -->
      <g stroke="#3e5a44" stroke-width="3">
        <polygon points="0,520 220,420 430,540 0,560" fill="#6fa06a" />
        <polygon points="220,420 430,540 220,550" fill="#4e7a4e" />
        <polygon points="430,540 700,430 950,550 700,580" fill="#7fb377" />
        <polygon points="700,430 950,550 700,580" fill="#55855a" />
        <polygon points="950,550 1150,440 1280,540 1280,580 950,580" fill="#6fa06a" />
        <polygon points="1150,440 1280,540 1150,580" fill="#4a7a52" />
      </g>
      <!-- lake with sun glint -->
      <polygon points="380,585 900,585 820,700 460,700" fill="#3f7fa8" stroke="#2c5a78" stroke-width="3" />
      <polygon points="560,600 720,600 680,640 600,640" fill="#bfe0f2" />
      <polygon points="620,650 760,650 730,685 650,685" fill="#8fc3e0" />
      <!-- near ground facets -->
      <g stroke="#33482f" stroke-width="3">
        <polygon points="0,560 300,560 180,720 0,720" fill="#5d8a52" />
        <polygon points="300,560 640,580 420,720 180,720" fill="#4c7345" />
        <polygon points="640,580 980,560 1100,720 420,720" fill="#5d8a52" />
        <polygon points="980,560 1280,580 1280,720 1100,720" fill="#42663c" />
      </g>
      <!-- faceted pines -->
      <g stroke="#2c4a2c" stroke-width="3">
        <polygon points="250,620 290,540 330,620" fill="#3f6b3f" />
        <polygon points="290,540 330,620 290,620" fill="#2c4f2e" />
        <rect x="284" y="620" width="12" height="30" fill="#5a4226" />
        <polygon points="1010,630 1050,550 1090,630" fill="#3f6b3f" />
        <polygon points="1050,550 1090,630 1050,630" fill="#2c4f2e" />
        <rect x="1044" y="630" width="12" height="30" fill="#5a4226" />
      </g>
    </svg>
  </body>
</html>
