<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Thesis</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#10141c;color:#f4f1ea;font-family:'Segoe UI',system-ui,sans-serif}
.wrap{height:100%;padding:60px 80px;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr auto}
.kicker{font-size:21px;letter-spacing:.24em;color:#ffb347}
h1{margin:16px 0 0;font-size:88px;line-height:1.04;letter-spacing:-.02em;max-width:1000px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:34px}
.card{border-radius:20px;background:#1b2334;border:1px solid #2b3a52;padding:32px 36px}
.card.old{opacity:.75}
.card h2{margin:0 0 12px;font-size:26px;letter-spacing:.14em;color:#8fa1bb}
.card p{margin:0;font-size:30px;line-height:1.4}
.card.new{border-color:#ffb347}
.card.new h2{color:#ffb347}
.foot{display:flex;align-items:center;gap:18px;margin-top:26px}
.dots{display:flex;gap:10px}
.dots i{width:40px;height:10px;border-radius:6px;background:#2c3549}
.dots i.on{background:#ffb347}
.foot span{margin-left:auto;font-size:21px;letter-spacing:.2em;color:#8fa1bb}
</style>
</head>
<body>
<div class="wrap">
<div><div class="kicker">02 / SYSTEM VIEW</div><h1>One shift changes the whole pipeline.</h1></div>
<div class="cards">
<div class="card old"><h2>BEFORE</h2><p>Scattered files, manual handoffs, lost versions.</p></div>
<div class="card new"><h2>AFTER</h2><p>One canvas, shared states, instant review.</p></div>
</div>
<div class="foot"><div class="dots"><i class="on"></i><i class="on"></i><i></i><i></i></div><span>04 STEPS</span></div>
</div>
</body>
</html>
