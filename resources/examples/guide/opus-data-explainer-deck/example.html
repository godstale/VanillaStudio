<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ledger</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4efe4;color:#1c1b19;font-family:Georgia,serif}
main{display:grid;grid-template-columns:1fr 1fr;gap:48px;height:100%;padding:64px 72px;box-sizing:border-box}
small{font:600 19px 'Segoe UI',system-ui,sans-serif;letter-spacing:.22em;color:#8a6d00}
h1{margin:14px 0 10px;font-size:66px;line-height:1.05}
p{margin:0;font:400 23px 'Segoe UI',system-ui,sans-serif;line-height:1.5;color:#4a463d}
.chart{border-left:3px solid #1c1b19;border-bottom:3px solid #1c1b19;padding:18px 0 0 18px;height:300px;display:flex;align-items:flex-end;gap:22px}
.chart i{flex:1;border-radius:6px 6px 0 0;background:#a11e4e}
.chart i:nth-child(2){background:#d98e04}
.chart i:nth-child(4){background:#1c6e4e}
.scale{margin-top:26px;display:flex;align-items:center;gap:14px;font:600 20px 'Segoe UI',system-ui,sans-serif}
.scale b{padding:8px 20px;border-radius:999px;background:#1c1b19;color:#f4efe4}
.scale span{flex:1;height:3px;background:#1c1b19;position:relative}
.scale span::after{content:'';position:absolute;right:0;top:-7px;border:9px solid transparent;border-left-color:#1c1b19}
.steps{margin-top:22px;display:flex;gap:10px}
.steps i{width:44px;height:10px;border-radius:6px;background:#c9c2b2}
.steps i.on{background:#a11e4e}
</style>
</head>
<body>
<main>
<section>
<small>REPORT 03 / SCALE VIEW</small>
<h1>Small signals,<br/>measured clearly</h1>
<p>Three indicators compared side by side, then placed on one scale from trial to full rollout.</p>
<div class="scale"><b>TRIAL</b><span></span><b>FULL</b></div>
<div class="steps"><i class="on"></i><i class="on"></i><i></i><i></i></div>
</section>
<section>
<div class="chart">
<i style="height:46%"></i><i style="height:72%"></i><i style="height:58%"></i><i style="height:92%"></i>
</div>
<p style="margin-top:16px">Four cohorts, one axis, no decoration.</p>
</section>
</main>
</body>
</html>
