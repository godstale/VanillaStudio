<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Derivation</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0d1117;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif}
canvas{position:absolute;inset:0;width:1280px;height:720px}
.eq{position:absolute;left:64px;top:56px;font-size:34px;letter-spacing:.04em}
.eq b{color:#39d5f2}.eq i{color:#ff9ec6;font-style:normal}.eq u{color:#ffd97a;text-decoration:none}
.hudnum{position:absolute;right:64px;top:56px;font-family:Consolas,monospace;font-size:30px;color:#39d5f2;text-align:right}
svg.frame{position:absolute;inset:0;width:1280px;height:720px}
</style>
</head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<div class="eq"><b>y</b> = <i>a&#8321;</i> sin <u>&#952;</u> + <i>a&#8323;</i> sin <u>3&#952;</u> + &#183;&#183;&#183;</div>
<div class="hudnum" id="num">N = 1<br/>f = 00.0</div>
<svg class="frame" viewBox="0 0 1280 720"><path d="M24 64V24h40M1216 24h40v40M24 656v40h40M1256 656v40h-40" fill="none" stroke="#39d5f2" stroke-width="3" opacity=".6"/></svg>
<script>
const SECONDS=8;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const num=document.getElementById('num');
window.seekExample=(t)=>{
const p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
const a=p*Math.PI*2;
ctx.fillStyle='#0d1117';
ctx.fillRect(0,0,1280,720);
ctx.strokeStyle='rgba(120,140,160,.25)';
ctx.lineWidth=1;
for(let x=80;x<1210;x+=46){ctx.beginPath();ctx.moveTo(x,120);ctx.lineTo(x,660);ctx.stroke();}
for(let y=140;y<670;y+=46){ctx.beginPath();ctx.moveTo(60,y);ctx.lineTo(1220,y);ctx.stroke();}
const cx=330,cy=400;
const n=p<.375?1:p<.75?3:5;
const R=[120,52,30,20,14];
let x=cx,y=cy;
ctx.lineWidth=3;
const cols=['#39d5f2','#ff9ec6','#ffd97a','#7ee787','#a371f7'];
for(let i=0;i<n;i++){
const rr=R[i];
const ang=a*(2*i+1)+i;
const nx=x+rr*Math.cos(ang),ny=y+rr*Math.sin(ang);
ctx.strokeStyle='rgba(150,170,190,.5)';
ctx.beginPath();ctx.arc(x,y,rr,0,7);ctx.stroke();
ctx.strokeStyle=cols[i];
ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.stroke();
ctx.fillStyle=cols[i];
ctx.beginPath();ctx.arc(nx,ny,6,0,7);ctx.fill();
x=nx;y=ny;
}
ctx.strokeStyle='#39d5f2';
ctx.lineWidth=4;
ctx.shadowColor='#39d5f2';
ctx.shadowBlur=12;
ctx.beginPath();
for(let px=0;px<=560;px+=4){
let wy=0;
for(let i=0;i<n;i++)wy+=R[i]*Math.sin((a+px*.02)*(2*i+1)+i);
const yy=cy-wy*.9;
if(px===0)ctx.moveTo(560+px,yy);else ctx.lineTo(560+px,yy);
}
ctx.stroke();
ctx.shadowBlur=0;
ctx.fillStyle='#39d5f2';
ctx.beginPath();ctx.arc(560,cy,5,0,7);ctx.fill();
ctx.strokeStyle='rgba(57,213,242,.6)';
ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(560,y);ctx.stroke();
if(p>=.75){
for(let i=0;i<5;i++){
const bh=(i<n?120:30)+i*8;
ctx.fillStyle=cols[i];
ctx.fillRect(150+i*60,660-bh*.8,34,bh*.8);
}
}
num.innerHTML='N = '+n+'<br/>f = '+(p*8).toFixed(1);
};
if(!navigator.webdriver){const loop=(ms)=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
