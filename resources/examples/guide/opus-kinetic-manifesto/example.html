<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chorus</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#141210;color:#f5efe2;font-family:'Segoe UI',system-ui,sans-serif}
.line{position:absolute;left:110px;right:110px;overflow:hidden}
.line h1{margin:0;font-weight:800;letter-spacing:-.02em}
.l0{top:120px}.l0 h1{font-size:110px}
.l1{top:250px}.l1 h1{font-size:110px;color:#c96f2e}
.l2{top:390px}.l2 h1{font-size:64px;font-style:italic;font-weight:400;font-family:Georgia,serif}
.idx{position:absolute;font-size:22px;letter-spacing:.24em;color:#8a7f68}
#orbitWrap{position:absolute;inset:0}
#orbitWrap text{font-size:30px;letter-spacing:.42em;fill:#e8c15a;font-weight:700}
#core{position:absolute;left:50%;top:52%;width:220px;height:220px;margin:-110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0b45a,#8a4a1a 70%);box-shadow:0 0 90px rgba(240,180,90,.45)}
.end{position:absolute;inset:0;display:grid;place-content:center;background:#c9362b;opacity:0}
.end h1{margin:0;font-size:88px;font-weight:800;color:#fff;letter-spacing:-.02em}
svg.stage{position:absolute;inset:0;width:1280px;height:720px}
</style>
</head>
<body>
<div id="core"></div>
<div class="line l0"><h1 id="w0">RAISE THE FLOOR</h1></div>
<div class="line l1"><h1 id="w1">HOLD THE LINE</h1></div>
<div class="line l2"><h1 id="w2">and the room begins to turn</h1></div>
<div class="idx" style="left:110px;top:80px">[ 01 ]</div>
<div class="idx" style="right:110px;bottom:70px">[ 04 ]</div>
<div class="end" id="end"><h1>BUILT TO LAST</h1></div>
<svg class="stage" viewBox="0 0 1280 720">
<ellipse id="orb" cx="640" cy="380" rx="430" ry="150" fill="none" stroke="#e8c15a" stroke-width="2" stroke-dasharray="8 10" opacity=".6"/>
<text id="orbText" font-size="30" letter-spacing="10" fill="#e8c15a" font-weight="700"><textPath id="orbPath" href="#orb">SHIFT THE WEIGHT &#183; TURN THE ROOM &#183; SHIFT THE WEIGHT &#183; TURN THE ROOM &#183;</textPath></text>
</svg>
<script>
const SECONDS=8;
const words=[0,1,2].map(i=>document.getElementById('w'+i));
const end=document.getElementById('end');
const core=document.getElementById('core');
const orbText=document.getElementById('orbText');
const orbPath=document.getElementById('orbPath');
function seg(p,from,to){return Math.min(1,Math.max(0,(p-from)/(to-from)));}
window.seekExample=(t)=>{
const p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
const rises=[0,.12,.24];
words.forEach((w,i)=>{w.style.transform=`translateY(${(1-seg(p,rises[i],rises[i]+.1))*110}%)`;});
const pulse=.5+.5*Math.sin(p*Math.PI*2*4);
w0.style.letterSpacing=(.02*pulse-.01)+'em';
core.style.transform=`scale(${1+.12*Math.sin(p*Math.PI*2*2)})`;
let off=(p*120)%40;
orbPath.setAttribute('startOffset',off+'%');
orbText.setAttribute('opacity',String(seg(p,.3,.45)*(1-seg(p,.68,.78))));
end.style.opacity=seg(p,.78,.88);
};
if(!navigator.webdriver){const loop=(ms)=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
