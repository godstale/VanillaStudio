<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Technique study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#1c1e24}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<linearGradient id="tp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cdd1d8"/><stop offset=".55" stop-color="#9aa0a8"/><stop offset="1" stop-color="#5f656d"/></linearGradient>
<radialGradient id="key" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="fil" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6ea8ff" stop-opacity=".22"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="720" fill="#1c1e24"/>
<circle cx="330" cy="330" r="280" fill="url(#key)"/>
<circle cx="990" cy="360" r="260" fill="url(#fil)"/>
<rect y="560" width="1280" height="160" fill="#14161b"/>
<ellipse cx="560" cy="586" rx="200" ry="22" fill="#000" opacity=".55"/>
<circle cx="180" cy="140" r="40" fill="url(#key)"/>
<circle cx="180" cy="140" r="14" fill="#ffd9a0"/>
<circle cx="1100" cy="180" r="34" fill="url(#fil)"/>
<circle cx="1100" cy="180" r="12" fill="#bcd6ff"/>
<circle cx="640" cy="80" r="10" fill="#fff" opacity=".9"/>
<circle cx="560" cy="400" r="150" fill="url(#tp)"/>
<path d="M668 290 A 150 150 0 0 1 668 510" fill="none" stroke="#ffe6c4" stroke-width="7"/>
<ellipse cx="512" cy="348" rx="32" ry="20" fill="#fff" opacity=".5"/>
<rect x="790" y="330" width="200" height="230" fill="#8f959d"/>
<rect x="790" y="330" width="90" height="230" fill="#b9bec5"/>
<line x1="990" y1="340" x2="990" y2="560" stroke="#ffe6c4" stroke-width="6"/>
</svg>
</body>
</html>
