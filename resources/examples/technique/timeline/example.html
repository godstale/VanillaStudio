<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#23211d;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#f4f1ea"/>
<text x="90" y="120" font-size="60" font-weight="800" fill="#23211d">One day, five lights</text>
<line x1="90" y1="400" x2="1190" y2="400" stroke="#23211d" stroke-width="8"/>
<g text-anchor="middle">
<g><circle cx="180" cy="400" r="26" fill="#e8933c" stroke="#23211d" stroke-width="6"/><rect x="80" y="180" width="200" height="150" rx="18" fill="#fffdf8" stroke="#23211d" stroke-width="5"/><text x="180" y="245" font-size="34" font-weight="800" fill="#23211d">First light</text><text x="180" y="290" font-size="28" fill="#6b675c">05:40</text></g>
<g><circle cx="435" cy="400" r="26" fill="#f2c879" stroke="#23211d" stroke-width="6"/><rect x="335" y="450" width="200" height="150" rx="18" fill="#fffdf8" stroke="#23211d" stroke-width="5"/><text x="435" y="515" font-size="34" font-weight="800" fill="#23211d">Midday</text><text x="435" y="560" font-size="28" fill="#6b675c">12:10</text></g>
<g><circle cx="690" cy="400" r="26" fill="#d9502f" stroke="#23211d" stroke-width="6"/><rect x="590" y="180" width="200" height="150" rx="18" fill="#fffdf8" stroke="#23211d" stroke-width="5"/><text x="690" y="245" font-size="32" font-weight="800" fill="#23211d">Golden hour</text><text x="690" y="290" font-size="28" fill="#6b675c">17:50</text></g>
<g><circle cx="945" cy="400" r="26" fill="#2f6bff" stroke="#23211d" stroke-width="6"/><rect x="845" y="450" width="200" height="150" rx="18" fill="#fffdf8" stroke="#23211d" stroke-width="5"/><text x="945" y="515" font-size="34" font-weight="800" fill="#23211d">Blue hour</text><text x="945" y="560" font-size="28" fill="#6b675c">19:20</text></g>
<g><circle cx="1150" cy="400" r="26" fill="#23211d" stroke="#23211d" stroke-width="6"/><rect x="1050" y="180" width="200" height="150" rx="18" fill="#23211d"/><text x="1150" y="245" font-size="34" font-weight="800" fill="#f4f1ea">Night</text><text x="1150" y="290" font-size="28" fill="#b9b4a6">22:00</text></g>
</g>
</svg>
</body>
</html>
