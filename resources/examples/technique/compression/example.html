<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#2B2135}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><rect x="240" y="560" width="800" height="8" fill="#F5B942"/><g id="b"><rect x="-110" y="-110" width="220" height="220" rx="30" fill="#8B7CF6"/></g></svg>
<script>
const SECONDS=2;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
let sy,y;
if(p<0.4){const q=p/0.4;sy=1-0.55*q;y=560-110*sy;}
else{const q=(p-0.4)/0.6;sy=1+0.55*Math.sin(q*Math.PI*2)*Math.exp(-3*q);y=560-110-360*Math.sin(q*Math.PI);}
$('b').setAttribute('transform','translate(640 '+y.toFixed(1)+') scale('+(1+(1-sy)*0.6).toFixed(3)+' '+sy.toFixed(3)+')');
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
