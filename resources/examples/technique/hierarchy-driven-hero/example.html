<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#23211d;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#10141c"/>
<circle cx="1050" cy="180" r="240" fill="#1b2431"/>
<circle cx="1050" cy="360" r="120" fill="#2ed3b1"/>
<text x="90" y="150" font-size="34" font-weight="700" fill="#7f8ea3">01 · Walk slowly</text>
<text x="90" y="330" font-size="120" font-weight="800" fill="#f4f1ea">See the</text>
<text x="90" y="450" font-size="120" font-weight="800" fill="#f4f1ea">whole bay</text>
<text x="90" y="530" font-size="38" fill="#b9c4d2">A calm route along the water, marked step by step.</text>
<rect x="90" y="570" width="240" height="76" rx="38" fill="#2ed3b1"/>
<text x="138" y="620" font-size="34" font-weight="800" fill="#10141c">Start here</text>
<rect x="350" y="570" width="240" height="76" rx="38" fill="none" stroke="#7f8ea3" stroke-width="4"/>
<text x="408" y="620" font-size="34" font-weight="700" fill="#b9c4d2">Read on</text>
</svg>
</body>
</html>
