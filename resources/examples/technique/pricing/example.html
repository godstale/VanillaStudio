<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#23211d;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#f4f1ea"/>
<text x="640" y="110" text-anchor="middle" font-size="60" font-weight="800" fill="#23211d">Choose a pace</text>
<g text-anchor="middle">
<rect x="120" y="170" width="300" height="460" rx="24" fill="#fffdf8" stroke="#23211d" stroke-width="5"/>
<text x="270" y="250" font-size="38" font-weight="800" fill="#23211d">Day</text>
<text x="270" y="360" font-size="96" font-weight="800" fill="#23211d">$9</text>
<rect x="470" y="130" width="340" height="500" rx="24" fill="#23211d"/>
<text x="640" y="215" font-size="40" font-weight="800" fill="#f2c879">Weekend</text>
<text x="640" y="335" font-size="110" font-weight="800" fill="#f4f1ea">$19</text>
<rect x="860" y="170" width="300" height="460" rx="24" fill="#fffdf8" stroke="#23211d" stroke-width="5"/>
<text x="1010" y="250" font-size="38" font-weight="800" fill="#23211d">Season</text>
<text x="1010" y="360" font-size="96" font-weight="800" fill="#23211d">$29</text>
</g>
<g fill="#b9b4a6">
<rect x="160" y="410" width="220" height="16" rx="8"/><rect x="160" y="442" width="180" height="16" rx="8"/><rect x="160" y="474" width="200" height="16" rx="8"/>
<rect x="530" y="390" width="220" height="16" rx="8" fill="#7f8ea3"/><rect x="530" y="422" width="180" height="16" rx="8" fill="#7f8ea3"/><rect x="530" y="454" width="200" height="16" rx="8" fill="#7f8ea3"/>
<rect x="900" y="410" width="220" height="16" rx="8"/><rect x="900" y="442" width="180" height="16" rx="8"/><rect x="900" y="474" width="200" height="16" rx="8"/>
</g>
<rect x="540" y="500" width="200" height="64" rx="32" fill="#e8933c"/>
<text x="640" y="544" text-anchor="middle" font-size="32" font-weight="800" fill="#23211d">Select</text>
</svg>
</body>
</html>
