<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#23211d;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#1c1b19"/>
<rect x="90" y="110" width="220" height="60" rx="12" fill="#f4f1ea"/>
<g fill="#7f8ea3">
<rect x="90" y="220" width="150" height="30" rx="6" font-size="20"/>
<text x="90" y="215" font-size="30" font-weight="800" fill="#f4f1ea">Paths</text>
<rect x="90" y="240" width="150" height="22" rx="6"/><rect x="90" y="276" width="120" height="22" rx="6"/><rect x="90" y="312" width="140" height="22" rx="6"/>
<text x="420" y="215" font-size="30" font-weight="800" fill="#f4f1ea">Notes</text>
<rect x="420" y="240" width="150" height="22" rx="6"/><rect x="420" y="276" width="120" height="22" rx="6"/><rect x="420" y="312" width="140" height="22" rx="6"/>
<text x="750" y="215" font-size="30" font-weight="800" fill="#f4f1ea">About</text>
<rect x="750" y="240" width="150" height="22" rx="6"/><rect x="750" y="276" width="120" height="22" rx="6"/><rect x="750" y="312" width="140" height="22" rx="6"/>
</g>
<circle cx="1090" cy="280" r="60" fill="none" stroke="#e8933c" stroke-width="8"/>
<circle cx="1090" cy="280" r="24" fill="#e8933c"/>
<line x1="90" y1="560" x2="1190" y2="560" stroke="#4a463d" stroke-width="3"/>
<text x="90" y="620" font-size="30" fill="#b9b4a6">Harbor Notes. Walk gently.</text>
<text x="1190" y="620" text-anchor="end" font-size="30" fill="#b9b4a6">2026 · All paths open</text>
</svg>

</html>
