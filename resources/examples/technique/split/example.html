<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Split</title>
    <style>
      html, body {
        margin: 0; width: 1280px; height: 720px; overflow: hidden;
        background: #E9E4D6; color: #22262E;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; height: 100%; padding: 72px; box-sizing: border-box; }
      .left { align-self: center; }
      .title { height: 52px; border-radius: 8px; background: #22262E; }
      .line { height: 20px; margin-top: 20px; border-radius: 10px; background: #B9B2A0; }
      .line.short { margin-right: 140px; }
      .btn { width: 220px; height: 60px; margin-top: 36px; border-radius: 999px; background: #2456D6; }
      .right { border-radius: 24px; background: linear-gradient(135deg, #E07830, #2456D6); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="left">
        <div class="title"></div>
        <div class="line"></div>
        <div class="line short"></div>
        <div class="btn"></div>
      </div>
      <div class="right"></div>
    </div>
  </body>
</html>
