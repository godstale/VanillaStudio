<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contrast AA</title>
    <style>
      html, body {
        margin: 0; width: 1280px; height: 720px; overflow: hidden;
        background: #E9E4D6;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; height: 100%; padding: 72px; box-sizing: border-box; }
      .panel { border-radius: 24px; background: #FFFFFF; display: grid; place-content: center; justify-items: center; gap: 8px; }
      .aa { font-size: 200px; font-weight: 800; line-height: 1; }
      .pass .aa { color: #1A1E26; }
      .fail .aa { color: #B9B9B9; }
      .mark { width: 96px; height: 96px; }
      .cap { width: 220px; height: 26px; border-radius: 13px; }
      .pass .cap { background: #2E9E5B; }
      .fail .cap { background: #C9C9C9; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel pass">
        <svg class="mark" viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="#2E9E5B"/><path d="M30 49l13 13 24-28" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="aa">Aa</div><div class="cap"></div>
      </div>
      <div class="panel fail">
        <svg class="mark" viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="#C9C9C9"/><path d="M36 36l24 24M60 36L36 60" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>
        <div class="aa">Aa</div><div class="cap"></div>
      </div>
    </div>
  </body>
</html>
