<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#23211d;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#f4f1ea"/>
<text x="140" y="120" font-size="60" font-weight="800" fill="#23211d">Good to know</text>
<g font-size="36" font-weight="700" fill="#23211d">
<text x="140" y="210">When does it open?</text>
<rect x="140" y="235" width="760" height="60" rx="12" fill="#e2dccb"/>
<text x="160" y="278" font-size="30" font-weight="400" fill="#4a463d">At first light, every day.</text>
<text x="140" y="360">Is it quiet?</text>
<text x="140" y="440">Can I bring food?</text>
<text x="140" y="520">What if it rains?</text>
<text x="140" y="600">How do I find it?</text>
</g>
<g fill="#23211d">
<circle cx="1060" cy="200" r="16"/><circle cx="1060" cy="350" r="16"/><circle cx="1060" cy="430" r="16"/><circle cx="1060" cy="510" r="16"/><circle cx="1060" cy="590" r="16"/>
</g>
<g stroke="#b9b4a6" stroke-width="3">
<line x1="140" y1="310" x2="1140" y2="310"/><line x1="140" y1="390" x2="1140" y2="390"/><line x1="140" y1="470" x2="1140" y2="470"/><line x1="140" y1="550" x2="1140" y2="550"/><line x1="140" y1="630" x2="1140" y2="630"/>
</g>
</svg>
</body>
</html>
