<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#23211d;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#f4f1ea"/>
<text x="90" y="130" font-size="60" font-weight="800" fill="#23211d">Four small comforts</text>
<g font-size="34" font-weight="800" fill="#23211d">
<rect x="90" y="180" width="260" height="400" rx="24" fill="#fffdf8" stroke="#23211d" stroke-width="5"/>
<circle cx="220" cy="280" r="52" fill="#d9502f"/><text x="150" y="390">Tide</text><text x="150" y="434">tables</text>
<rect x="375" y="180" width="260" height="400" rx="24" fill="#fffdf8" stroke="#23211d" stroke-width="5"/>
<circle cx="505" cy="280" r="52" fill="#0b6e5e"/><text x="435" y="390">Trail</text><text x="435" y="434">maps</text>
<rect x="660" y="180" width="260" height="400" rx="24" fill="#fffdf8" stroke="#23211d" stroke-width="5"/>
<circle cx="790" cy="280" r="52" fill="#e8933c"/><text x="720" y="390">Quiet</text><text x="720" y="434">rooms</text>
<rect x="945" y="180" width="260" height="400" rx="24" fill="#fffdf8" stroke="#23211d" stroke-width="5"/>
<circle cx="1075" cy="280" r="52" fill="#2f6bff"/><text x="1005" y="390">Warm</text><text x="1005" y="434">drinks</text>
</g>
<g fill="#b9b4a6">
<rect x="130" y="470" width="180" height="16" rx="8"/><rect x="130" y="500" width="140" height="16" rx="8"/>
<rect x="415" y="470" width="180" height="16" rx="8"/><rect x="415" y="500" width="140" height="16" rx="8"/>
<rect x="700" y="470" width="180" height="16" rx="8"/><rect x="700" y="500" width="140" height="16" rx="8"/>
<rect x="985" y="470" width="180" height="16" rx="8"/><rect x="985" y="500" width="140" height="16" rx="8"/>
</g>
</svg>
</body>
</html>
