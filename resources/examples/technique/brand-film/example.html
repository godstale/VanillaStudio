<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0e0f13;color:#f4f1ea;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a4a"/><stop offset=".6" stop-color="#7a5a8c"/><stop offset="1" stop-color="#e08a5f"/></linearGradient></defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<circle cx="640" cy="430" r="120" fill="#ffd9a0"/>
<rect y="430" width="1280" height="290" fill="#14161c" opacity=".85"/>
<rect y="400" width="1280" height="60" fill="#fff" opacity=".12"/>
<rect y="440" width="1280" height="40" fill="#fff" opacity=".08"/>
<circle cx="640" cy="470" r="10" fill="#f4f1ea"/>
<rect x="0" y="0" width="1280" height="90" fill="#000"/><rect y="630" width="1280" height="90" fill="#000"/>
<circle cx="640" cy="675" r="22" fill="none" stroke="#f4f1ea" stroke-width="5"/>
</svg>
</body>
</html>
