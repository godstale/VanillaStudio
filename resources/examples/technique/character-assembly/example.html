<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#1B2230}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><rect x="340" y="470" width="600" height="10" rx="5" fill="#3A465E"/><circle id="a0" r="54" fill="#FF6B5E"/><circle id="a1" r="54" fill="#F5B942"/><circle id="a2" r="54" fill="#39D0C4"/><circle id="a3" r="54" fill="#8B7CF6"/><circle id="a4" r="54" fill="#B8E356"/></svg>
<script>
const SECONDS=3;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
const SX=[180,1080,240,1040,640],SY=[140,180,600,580,120];
for(let i=0;i<5;i++){const e=ss(p*1.15-i*0.03);const c=$('a'+i);c.setAttribute('cx',lerp(SX[i],400+i*120,e).toFixed(1));c.setAttribute('cy',lerp(SY[i],360,e).toFixed(1));c.setAttribute('opacity',(0.35+0.65*e).toFixed(3));}
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
