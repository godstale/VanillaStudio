<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0e0f13;color:#f4f1ea;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#111"/>
<text id="tc" x="640" y="400" text-anchor="middle" font-size="130" font-weight="800" fill="#f4f1ea" letter-spacing="60">DRAW CLOSE</text></svg>
<script>
const SECONDS = 3;
window.seekExample = (t) => {
const phase = (t % SECONDS) / SECONDS;
document.getElementById('tc').setAttribute('letter-spacing',60*(1-phase));
};
if (!navigator.webdriver) {
const loop = (ms) => {
window.seekExample(ms / 1000);
requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
}
window.seekExample(0);
</script>
</body>
</html>
