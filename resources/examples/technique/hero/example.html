<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#23211d;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0e3a34"/>
<ellipse cx="640" cy="760" rx="700" ry="220" fill="#0b6e5e"/>
<circle cx="640" cy="200" r="90" fill="#f2c879"/>
<text x="640" y="400" text-anchor="middle" font-size="110" font-weight="800" fill="#f4f1ea">A calmer day</text>
<text x="640" y="470" text-anchor="middle" font-size="38" fill="#cfe3da">One path, clear marks, no rush.</text>
<rect x="520" y="520" width="240" height="76" rx="38" fill="#f2c879"/>
<text x="640" y="570" text-anchor="middle" font-size="34" font-weight="800" fill="#0e3a34">Join the walk</text>
</svg>
</body>
</html>
