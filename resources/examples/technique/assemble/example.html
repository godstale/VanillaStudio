<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#1E2A38}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><g id="q0"><rect x="-120" y="-95" width="240" height="190" fill="#F5B942"/></g><g id="q1"><polygon points="0,-70 120,50 -120,50" fill="#E4572E"/></g><g id="q2"><circle r="34" fill="#39D0C4"/></g><g id="q3"><rect x="-35" y="-55" width="70" height="110" fill="#2E4057"/></g></svg>
<script>
const SECONDS=3;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
const HX=[200,1080,220,1060],HY=[150,160,590,590],TX=[640,640,640,640],TY=[450,300,450,490];
for(let i=0;i<4;i++){const e=ss((p-i*0.12)/0.64);
$('q'+i).setAttribute('transform','translate('+lerp(HX[i],TX[i],e).toFixed(1)+' '+lerp(HY[i],TY[i],e).toFixed(1)+') rotate('+((1-e)*(i%2?-40:40)).toFixed(1)+')');}
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
