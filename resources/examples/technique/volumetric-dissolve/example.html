<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#2A1E2E}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><rect id="v0" width="64" height="64" rx="12" fill="#E8B4F0"/><rect id="v1" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v2" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v3" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v4" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v5" width="64" height="64" rx="12" fill="#E8B4F0"/><rect id="v6" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v7" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v8" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v9" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v10" width="64" height="64" rx="12" fill="#E8B4F0"/><rect id="v11" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v12" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v13" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v14" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v15" width="64" height="64" rx="12" fill="#E8B4F0"/><rect id="v16" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v17" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v18" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v19" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v20" width="64" height="64" rx="12" fill="#E8B4F0"/><rect id="v21" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v22" width="64" height="64" rx="12" fill="#B48BE0"/><rect id="v23" width="64" height="64" rx="12" fill="#B48BE0"/></svg>
<script>
const SECONDS=3;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
const BX=[412, 488, 564, 640, 716, 792, 412, 488, 564, 640, 716, 792, 412, 488, 564, 640, 716, 792, 412, 488, 564, 640, 716, 792],BY=[204, 204, 204, 204, 204, 204, 280, 280, 280, 280, 280, 280, 356, 356, 356, 356, 356, 356, 432, 432, 432, 432, 432, 432];
for(let i=0;i<24;i++){const e=ss(p*1.3-H(i+50)*0.3);
const x=BX[i]+(H(i+90)-0.5)*160*e,y=BY[i]-260*e,s=1-0.5*e;
$('v'+i).setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(3)+')');$('v'+i).setAttribute('opacity',(1-e).toFixed(3));}
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
