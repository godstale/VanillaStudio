<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#191423}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><g id="ctx"><rect x="80" y="60" width="1120" height="600" fill="none" stroke="#F5B942" stroke-width="6"/><rect x="120" y="120" width="180" height="120" rx="16" fill="#3A465E"/><rect x="980" y="120" width="180" height="120" rx="16" fill="#3A465E"/><rect x="490" y="580" width="300" height="24" rx="12" fill="#3A465E"/></g><g id="s"><circle r="120" fill="#FF6B5E"/><circle r="120" fill="none" stroke="#A32E22" stroke-width="10" opacity="0.6"/></g></svg>
<script>
const SECONDS=3;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
const e=ss(p);
$('s').setAttribute('transform','translate(640 360) scale('+(1.5-0.9*e).toFixed(3)+')');
$('ctx').setAttribute('opacity',ss((p-0.3)/0.7).toFixed(3));
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
