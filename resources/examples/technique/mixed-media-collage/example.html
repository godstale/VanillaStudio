<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#1c1b19;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#e8b4b8"/><circle cx="11" cy="11" r="5" fill="#1c1b19"/></pattern></defs>
<rect width="1280" height="720" fill="#efe6d4"/>
<g transform="rotate(-8 640 360)"><rect x="300" y="140" width="680" height="440" fill="url(#dots)"/></g>
<g transform="rotate(6 640 360)"><rect x="380" y="200" width="520" height="320" fill="#2e4057"/></g>
<circle cx="640" cy="360" r="120" fill="#e07a5f"/>
<g transform="rotate(-14 300 560)"><rect x="180" y="520" width="260" height="60" fill="#c9b458" opacity=".85"/></g>
<g transform="rotate(10 1000 200)"><rect x="900" y="170" width="220" height="56" fill="#8a9b6e" opacity=".85"/></g>
<path d="M150 150 q120 40 200 160 t300 120" stroke="#1c1b19" stroke-width="12" fill="none" stroke-linecap="round"/>
<rect x="840" y="480" width="240" height="120" fill="#f4f1ea" stroke="#1c1b19" stroke-width="6"/>
<text x="960" y="553" text-anchor="middle" font-size="44" font-weight="800" fill="#1c1b19">HELLO</text>
</svg>
</body>
</html>
