<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#10141c;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#10141c"/>
<text id="big" x="640" y="360" font-size="230" font-weight="900" fill="#f5f5f2" text-anchor="middle" dominant-baseline="central">PULSE</text>
<rect id="bar" x="390" y="520" width="500" height="22" rx="11" fill="#ff6a2a"/>
<g id="ticks" fill="#3a4356"></g>
</svg>
<script>
const SECONDS = 4;
const big = document.getElementById('big');
const bar = document.getElementById('bar');
const ticksG = document.getElementById('ticks');
const STEPS = [900, 700, 500, 400];
const ticks = [];
for (let i = 0; i < 8; i += 1) {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', (448 + i * 52).toFixed(1));
  c.setAttribute('cy', '610');
  c.setAttribute('r', '14');
  ticksG.appendChild(c);
  ticks.push(c);
}
window.seekExample = (t) => {
  const beat = Math.floor(t / 0.5) % 8;
  const frac = (t % 0.5) / 0.5;
  const step = Math.min(3, Math.floor(frac * 4));
  const punch = Math.exp(-6 * frac);
  big.setAttribute('font-weight', String(STEPS[step]));
  big.setAttribute('letter-spacing', (6 + 44 * punch).toFixed(1));
  big.setAttribute('transform', 'translate(640 360) scale(' + (1 + 0.13 * punch).toFixed(3) + ') translate(-640 -360)');
  bar.setAttribute('transform', 'translate(640 531) scale(' + (0.35 + 0.65 * punch).toFixed(3) + ' 1) translate(-640 -531)');
  for (let i = 0; i < 8; i += 1) {
    ticks[i].setAttribute('fill', i === beat ? '#ff6a2a' : (i < beat ? '#8a6d55' : '#3a4356'));
  }
};
if (!navigator.webdriver) {
  const loop = (ms) => { window.seekExample(ms / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
window.seekExample(0);
</script>
</body>
</html>
