<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#1A2B2B}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><rect x="240" y="560" width="800" height="8" fill="#3A465E"/><g id="b"><circle r="110" fill="#FF6B5E"/><circle r="110" fill="none" stroke="#A32E22" stroke-width="8" opacity="0.5"/></g></svg>
<script>
const SECONDS=3;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
const c=Math.abs(Math.cos(p*Math.PI*2));
const sy=0.55+0.45*c,sx=1.35-0.35*c;
$('b').setAttribute('transform','translate(640 '+(430-190*c).toFixed(1)+') scale('+sx.toFixed(3)+' '+sy.toFixed(3)+')');
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
