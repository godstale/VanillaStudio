<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#20242E}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><rect id="b0" x="160" width="120" height="34" rx="17" fill="#FF6B5E"/><rect id="b1" x="320" width="120" height="34" rx="17" fill="#F5B942"/><rect id="b2" x="480" width="120" height="34" rx="17" fill="#39D0C4"/><rect id="b3" x="640" width="120" height="34" rx="17" fill="#8B7CF6"/><rect id="b4" x="800" width="120" height="34" rx="17" fill="#B8E356"/><rect id="b5" x="960" width="120" height="34" rx="17" fill="#FF7AB8"/></svg>
<script>
const SECONDS=3;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
for(let i=0;i<6;i++){const c=clamp((p-i*0.09)/0.46,0,1);const e=1-Math.pow(1-c,3);
$('b'+i).setAttribute('y',lerp(-60,500,e).toFixed(1));$('b'+i).setAttribute('opacity',(0.2+0.8*e).toFixed(3));}
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
