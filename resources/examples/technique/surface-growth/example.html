<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#1E2A24}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><rect x="64" y="560" width="1152" height="10" fill="#3A465E"/><rect id="k0" x="64" width="28" rx="14" fill="#F5B942"/><rect id="k1" x="112" width="28" rx="14" fill="#7BD88F"/><rect id="k2" x="160" width="28" rx="14" fill="#7BD88F"/><rect id="k3" x="208" width="28" rx="14" fill="#7BD88F"/><rect id="k4" x="256" width="28" rx="14" fill="#F5B942"/><rect id="k5" x="304" width="28" rx="14" fill="#7BD88F"/><rect id="k6" x="352" width="28" rx="14" fill="#7BD88F"/><rect id="k7" x="400" width="28" rx="14" fill="#7BD88F"/><rect id="k8" x="448" width="28" rx="14" fill="#F5B942"/><rect id="k9" x="496" width="28" rx="14" fill="#7BD88F"/><rect id="k10" x="544" width="28" rx="14" fill="#7BD88F"/><rect id="k11" x="592" width="28" rx="14" fill="#7BD88F"/><rect id="k12" x="640" width="28" rx="14" fill="#F5B942"/><rect id="k13" x="688" width="28" rx="14" fill="#7BD88F"/><rect id="k14" x="736" width="28" rx="14" fill="#7BD88F"/><rect id="k15" x="784" width="28" rx="14" fill="#7BD88F"/><rect id="k16" x="832" width="28" rx="14" fill="#F5B942"/><rect id="k17" x="880" width="28" rx="14" fill="#7BD88F"/><rect id="k18" x="928" width="28" rx="14" fill="#7BD88F"/><rect id="k19" x="976" width="28" rx="14" fill="#7BD88F"/><rect id="k20" x="1024" width="28" rx="14" fill="#F5B942"/><rect id="k21" x="1072" width="28" rx="14" fill="#7BD88F"/><rect id="k22" x="1120" width="28" rx="14" fill="#7BD88F"/><rect id="k23" x="1168" width="28" rx="14" fill="#7BD88F"/></svg>
<script>
const SECONDS=3;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
const q=pp(p);
for(let i=0;i<24;i++){const h=300*ss(q*1.4-i*0.018);
$('k'+i).setAttribute('y',(560-h).toFixed(1));$('k'+i).setAttribute('height',Math.max(2,h).toFixed(1));}
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
