$('t'+i).setAttribute('cx',lerp(SX[i],EX[i],e).toFixed(1));$('t'+i).setAttribute('cy',lerp(SY[i],EY[i],e).toFixed(1));$('t'+i).setAttribute('opacity',(0.3+0.7*e).toFixed(3));}
};
