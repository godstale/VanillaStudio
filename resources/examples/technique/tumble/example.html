<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#221D33}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><rect x="240" y="560" width="800" height="8" fill="#3A465E"/><ellipse id="sh" cx="640" cy="566" rx="130" ry="12" fill="#000" opacity="0.3"/><g id="t"><rect x="-100" y="-100" width="200" height="200" rx="24" fill="#8B7CF6"/><rect x="-56" y="-56" width="112" height="112" rx="14" fill="#B8A6FF"/></g></svg>
<script>
const SECONDS=3;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
const c=Math.abs(Math.cos(p*Math.PI*2));
$('t').setAttribute('transform','translate(640 '+(360-110*Math.abs(Math.sin(p*Math.PI*2))).toFixed(1)+') rotate('+(p*720).toFixed(1)+') scale(1 '+Math.max(0.08,c).toFixed(3)+')');
$('sh').setAttribute('rx',(60+70*(1-c)).toFixed(1));
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
