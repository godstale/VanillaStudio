<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0e0f13;color:#f4f1ea;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<defs><radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#0e0f13"/></radialGradient>
<radialGradient id="glass" cx="35%" cy="30%" r="90%"><stop offset="0" stop-color="#8fd0ff"/><stop offset=".55" stop-color="#3a6ea8"/><stop offset="1" stop-color="#14273c"/></radialGradient>
<linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<polygon points="640,60 430,600 850,600" fill="url(#cone)"/>
<ellipse cx="640" cy="600" rx="250" ry="34" fill="#000" opacity=".55"/>
<rect x="560" y="560" width="160" height="34" rx="6" fill="#1d2230"/>
<rect x="520" y="220" width="240" height="350" rx="44" fill="#222a3a"/>
<rect x="520" y="220" width="240" height="350" rx="44" fill="none" stroke="#4d5a76" stroke-width="4"/>
<rect x="548" y="252" width="184" height="220" rx="24" fill="url(#glass)"/>
<ellipse cx="600" cy="300" rx="52" ry="30" fill="#fff" opacity=".35"/>
<circle cx="640" cy="520" r="16" fill="#8fd0ff"/>
<text x="640" y="120" text-anchor="middle" font-size="44" letter-spacing="10" fill="#f4f1ea">CALM MORNINGS</text>
</svg>
</body>
</html>
