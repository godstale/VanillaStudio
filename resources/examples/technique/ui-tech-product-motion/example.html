<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0e0f13;color:#f4f1ea;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#14161c"/>
<rect x="240" y="120" width="560" height="480" rx="20" fill="#1e2230"/>
<rect id="panel" x="830" y="120" width="330" height="480" rx="20" fill="#2e9df0"/>
<rect x="280" y="170" width="480" height="60" rx="12" fill="#2b3242"/>
<rect x="280" y="260" width="300" height="40" rx="8" fill="#3a6ea8"/>
<rect id="tog" x="280" y="340" width="120" height="60" rx="30" fill="#3a4150"/><circle id="togk" cx="310" cy="370" r="24" fill="#fff"/>
<g id="cur"><polygon points="0,0 0,52 14,40 22,58 30,54 22,36 34,36" fill="#fff" stroke="#111" stroke-width="2"/><circle id="ring" cx="6" cy="10" r="10" fill="none" stroke="#f5b942" stroke-width="5"/></g></svg>
<script>
const SECONDS = 3;
window.seekExample = (t) => {
const phase = (t % SECONDS) / SECONDS;
const ease=(x)=>x<0?0:x>1?1:x*x*(3-2*x);
const cx=300+560*ease(phase/0.5),cy=200+220*ease(phase/0.5);
document.getElementById('cur').setAttribute('transform','translate('+cx+' '+cy+')');
document.getElementById('ring').setAttribute('r',10+40*((phase>0.5&&phase<0.7)?(phase-0.5)/0.2:0));
document.getElementById('ring').setAttribute('opacity',(phase>0.5&&phase<0.7)?1:0);
const on=phase>0.55;
document.getElementById('tog').setAttribute('fill',on?'#33b86a':'#3a4150');
document.getElementById('togk').setAttribute('cx',on?370:310);
document.getElementById('panel').setAttribute('x',830+120*ease((phase-0.55)/0.3));
};
if (!navigator.webdriver) {
const loop = (ms) => {
window.seekExample(ms / 1000);
requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
}
window.seekExample(0);
</script>
</body>
</html>
