<script>
const SECONDS=3;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
const PX=[140.0, 223.3, 306.7, 390.0, 473.3, 556.7, 640.0, 723.3, 806.7, 890.0, 973.3, 1056.7, 1140.0],PY=[130.0, 206.7, 283.3, 360.0, 436.7, 513.3, 590.0];
const wx=140+1000*p;
$('wb').setAttribute('x',(wx-30).toFixed(1));
let n=0;
for(let r=0;r<7;r++)for(let c=0;c<13;c++){const dx=PX[c]-wx;
const off=130*Math.exp(-(dx*dx)/16200);
$('w'+n).setAttribute('cy',(PY[r]+(PY[r]<360?-off:off)).toFixed(1));n++;}
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
