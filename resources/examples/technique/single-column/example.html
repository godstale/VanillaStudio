<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Single column</title>
    <style>
      html, body {
        margin: 0; width: 1280px; height: 720px; overflow: hidden;
        background: #E9E4D6; color: #22262E;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .col {
        width: 560px; margin: 56px auto 0;
      }
      .hero {
        height: 240px; border-radius: 24px;
        background: linear-gradient(135deg, #2456D6, #7AA2F7);
      }
      .title { height: 44px; margin: 32px 60px 0; border-radius: 8px; background: #22262E; }
      .line { height: 20px; margin: 18px 40px 0; border-radius: 10px; background: #B9B2A0; }
      .line.short { margin-left: 140px; margin-right: 140px; }
      .btn {
        width: 240px; height: 64px; margin: 36px auto 0;
        border-radius: 999px; background: #2456D6;
      }
    </style>
  </head>
  <body>
    <div class="col">
      <div class="hero"></div>
      <div class="title"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line short"></div>
      <div class="btn"></div>
    </div>
  </body>
</html>
