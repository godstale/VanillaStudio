<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#2E3B4E}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><g id="w"><circle cx="980" cy="140" r="70" fill="#F5B942"/><ellipse cx="320" cy="480" rx="330" ry="120" fill="#3E6B4F"/><ellipse cx="980" cy="520" rx="360" ry="130" fill="#35603F"/><rect x="540" y="330" width="200" height="150" fill="#EFD9B4"/><polygon points="540,330 740,330 640,250" fill="#E4572E"/><rect x="0" y="560" width="1280" height="160" fill="#2C4A38"/></g></svg>
<script>
const SECONDS=3;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
$('w').setAttribute('transform','translate(0 '+(-260+520*ss(p)).toFixed(1)+')');
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
