<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zoom</title>
    <style>
      html, body {
        margin: 0; width: 1280px; height: 720px; overflow: hidden;
        background: #10141C;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .stage { position: absolute; inset: 0; display: grid; place-items: center; }
      .card {
        width: 420px; height: 300px; border-radius: 32px;
        background: linear-gradient(135deg, #8E4394, #2456D6);
      }
    </style>
  </head>
  <body>
    <div class="stage"><div class="card" id="card"></div></div>
    <svg width="0" height="0" viewBox="0 0 10 10"></svg>
    <script>
      const SECONDS = 3;
      const card = document.getElementById('card');

      window.seekExample = (t) => {
        const phase = (t % SECONDS) / SECONDS;
        const eased = 1 - Math.pow(1 - phase, 3);
        const scale = 0.35 + 1.65 * eased;
        card.style.transform = `scale(${scale})`;
        card.style.opacity = 0.25 + 0.75 * eased;
      };

      if (!navigator.webdriver) {
        const loop = (ms) => {
          window.seekExample(ms / 1000);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
      window.seekExample(0);
    </script>
  </body>
</html>
