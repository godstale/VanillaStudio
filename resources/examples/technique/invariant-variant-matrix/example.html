<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#23211d;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#f4f1ea"/>
<text x="90" y="130" font-size="60" font-weight="800" fill="#23211d">One roof, three rooms</text>
<g>
<rect x="90" y="180" width="340" height="440" rx="24" fill="#fffdf8" stroke="#23211d" stroke-width="5"/>
<rect x="90" y="180" width="340" height="150" rx="24" fill="#23211d"/>
<text x="130" y="272" font-size="40" font-weight="800" fill="#f4f1ea">Harbor</text>
<rect x="130" y="380" width="260" height="180" rx="18" fill="#d9502f"/>
</g>
<g>
<rect x="470" y="180" width="340" height="440" rx="24" fill="#fffdf8" stroke="#23211d" stroke-width="5"/>
<rect x="470" y="180" width="340" height="150" rx="24" fill="#23211d"/>
<text x="510" y="272" font-size="40" font-weight="800" fill="#f4f1ea">Harbor</text>
<circle cx="640" cy="470" r="95" fill="#0b6e5e"/>
</g>
<g>
<rect x="850" y="180" width="340" height="440" rx="24" fill="#fffdf8" stroke="#23211d" stroke-width="5"/>
<rect x="850" y="180" width="340" height="150" rx="24" fill="#23211d"/>
<text x="890" y="272" font-size="40" font-weight="800" fill="#f4f1ea">Harbor</text>
<polygon points="1020,380 1140,560 900,560" fill="#2f6bff"/>
</g>
</svg>
</body>
</html>
