<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;font-family:'Segoe UI',system-ui,sans-serif}
.tab{position:absolute;top:80px;width:170px;height:64px;line-height:64px;text-align:center;font-size:30px;font-weight:800;border-radius:999px;background:#e2dccb;color:#6b675c}.tile{position:absolute;border-radius:22px}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#f4f1ea"/></svg>
<div class="tab" id="tabA" style="left:385px">All</div><div class="tab" id="tabW" style="left:575px">Warm</div><div class="tab" id="tabC" style="left:765px">Cool</div>
<div id="grid"></div>
<script>
const SECONDS = 3;
const ez = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const NS2 = 'http://www.w3.org/1999/xhtml';
const grid = document.getElementById('grid');
const CATS = [0, 1, 2, 1, 0, 2, 2, 0, 1];
const COLS = ['#d9502f', '#2f6b8f', '#b9b4a6'];
const AX = [310, 544, 778], AY = [220, 428, 636], SZ = 190;
const WT = [[256, 240], [520, 240], [784, 240]];
const tiles = [];
for (let i = 0; i < 9; i++) {
const d = document.createElementNS(NS2, 'div');
grid.appendChild(d); tiles.push(d);
}
window.seekExample = (t) => {
const p = (t % SECONDS) / SECONDS;
const k = Math.min(1, Math.max(0, ez((p - 0.15) / 0.25) - ez((p - 0.6) / 0.25)));
let wi = 0;
for (let i = 0; i < 9; i++) {
const cx = i % 3, cy = Math.floor(i / 3);
let l = AX[cx], tp = AY[cy], s = SZ, op = 1;
if (CATS[i] === 0) { l = WT[wi][0]; tp = WT[wi][1]; s = 240; wi++; }
else { s = SZ * (1 - 0.95 * k); op = 1 - 0.85 * k; }
const d = tiles[i];
d.className = 'tile';
d.style.background = COLS[CATS[i]];
d.style.left = (AX[cx] + (l - AX[cx]) * k) + 'px';
d.style.top = (AY[cy] + (tp - AY[cy]) * k) + 'px';
d.style.width = (SZ + (s - SZ) * k) + 'px';
d.style.height = (SZ + (s - SZ) * k) + 'px';
d.style.opacity = String(op);
}
document.getElementById('tabW').style.background = k > 0.5 ? '#23211d' : '#e2dccb';
document.getElementById('tabW').style.color = k > 0.5 ? '#fff' : '#6b675c';
document.getElementById('tabA').style.background = k > 0.5 ? '#e2dccb' : '#23211d';
document.getElementById('tabA').style.color = k > 0.5 ? '#6b675c' : '#fff';
};
if (!navigator.webdriver) {
const loop = (ms) => {
window.seekExample(ms / 1000);
requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
}
window.seekExample(0);
</script>
</body>
</html>
