<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#23211d;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#f4f1ea"/>
<rect x="60" y="60" width="770" height="600" fill="#0e3a34"/>
<circle cx="620" cy="280" r="110" fill="#f2c879"/>
<path d="M60 480 Q 250 420 445 470 T 830 460 V 660 H 60 Z" fill="#0b6e5e"/>
<path d="M60 540 Q 300 500 560 530 T 830 520 V 660 H 60 Z" fill="#084a45"/>
<text x="110" y="150" font-size="72" font-weight="800" fill="#f4f1ea">Morning on</text>
<text x="110" y="640" font-size="72" font-weight="800" fill="#f4f1ea">the water</text>
<rect x="830" y="60" width="390" height="600" fill="none"/>
<rect x="830" y="60" width="390" height="290" fill="#e8933c"/>
<text x="870" y="200" font-size="52" font-weight="800" fill="#23211d">Slow</text>
<text x="870" y="262" font-size="52" font-weight="800" fill="#23211d">start</text>
<rect x="830" y="350" width="390" height="310" fill="#23211d"/>
<text x="870" y="480" font-size="44" font-weight="800" fill="#f4f1ea">Quiet</text>
<text x="870" y="536" font-size="44" font-weight="800" fill="#f4f1ea">hours</text>
<rect x="60" y="60" width="1160" height="600" fill="none" stroke="#23211d" stroke-width="6"/>
<line x1="830" y1="60" x2="830" y2="660" stroke="#23211d" stroke-width="6"/>
<line x1="830" y1="350" x2="1220" y2="350" stroke="#23211d" stroke-width="6"/>
</svg>
</body>
</html>
