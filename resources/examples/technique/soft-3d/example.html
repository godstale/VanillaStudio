<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0e0f13;color:#f4f1ea;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<defs><radialGradient id="p1" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#ffd9e8"/><stop offset="1" stop-color="#e0608f"/></radialGradient>
<radialGradient id="p2" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#d6f4ff"/><stop offset="1" stop-color="#4aa3d8"/></radialGradient>
<radialGradient id="p3" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#e0a83c"/></radialGradient></defs>
<rect width="1280" height="720" fill="#232733"/>
<ellipse cx="420" cy="580" rx="220" ry="30" fill="#000" opacity=".4"/>
<ellipse cx="860" cy="590" rx="240" ry="30" fill="#000" opacity=".4"/>
<circle cx="420" cy="400" r="170" fill="url(#p1)"/>
<ellipse cx="365" cy="340" rx="52" ry="34" fill="#fff" opacity=".75"/>
<circle cx="850" cy="420" r="150" fill="url(#p2)"/>
<ellipse cx="800" cy="368" rx="44" ry="28" fill="#fff" opacity=".75"/>
<circle cx="660" cy="230" r="90" fill="url(#p3)"/>
<ellipse cx="632" cy="200" rx="26" ry="16" fill="#fff" opacity=".8"/>
</svg>
</body>
</html>
