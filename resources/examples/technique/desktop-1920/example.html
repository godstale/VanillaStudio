<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Desktop 1920</title>
    <style>
      html, body {
        margin: 0; width: 1280px; height: 720px; overflow: hidden;
        background: #14171C;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .stage { display: grid; place-content: center; height: 100%; }
      .monitor {
        width: 960px; height: 540px; border-radius: 18px; background: #2B303B;
        padding: 18px; box-sizing: border-box;
      }
      .screen {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
        width: 100%; height: 100%; border-radius: 8px; background: #F2EEE2;
        padding: 30px; box-sizing: border-box; overflow: hidden;
      }
      .tile { border-radius: 12px; background: #FFFFFF; border: 3px solid #D8D2C2; padding: 18px; box-sizing: border-box; }
      .dot { width: 54px; height: 54px; border-radius: 14px; }
      .bar { height: 18px; margin-top: 18px; border-radius: 5px; background: #22262E; }
      .line { height: 12px; margin-top: 10px; border-radius: 6px; background: #CFC8B4; }
      .neck { width: 90px; height: 46px; margin: 0 auto; background: #2B303B; }
      .foot { width: 340px; height: 18px; margin: 0 auto; border-radius: 12px; background: #2B303B; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div>
        <div class="monitor"><div class="screen">
          <div class="tile"><div class="dot" style="background:#2456D6"></div><div class="bar"></div><div class="line"></div></div>
          <div class="tile"><div class="dot" style="background:#E07830"></div><div class="bar"></div><div class="line"></div></div>
          <div class="tile"><div class="dot" style="background:#2E9E5B"></div><div class="bar"></div><div class="line"></div></div>
          <div class="tile"><div class="dot" style="background:#8E4394"></div><div class="bar"></div><div class="line"></div></div>
        </div></div>
        <div class="neck"></div><div class="foot"></div>
      </div>
    </div>
  </body>
</html>
