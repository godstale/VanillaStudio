<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Technique study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#05070c}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<radialGradient id="h1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="h2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="e1" cx="42%" cy="36%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#aef7ff"/><stop offset="1" stop-color="#0e7490"/></radialGradient>
<linearGradient id="e2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe1ae"/><stop offset="1" stop-color="#b25a1d"/></linearGradient>
</defs>
<rect width="1280" height="720" fill="#05070c"/>
<rect y="560" width="1280" height="160" fill="#0a0d14"/>
<circle cx="500" cy="400" r="230" fill="url(#h1)"/>
<circle cx="870" cy="440" r="210" fill="url(#h2)"/>
<ellipse cx="500" cy="600" rx="180" ry="20" fill="#22d3ee" opacity=".35"/>
<ellipse cx="870" cy="600" rx="150" ry="18" fill="#ffb347" opacity=".35"/>
<circle cx="500" cy="400" r="130" fill="url(#e1)"/>
<rect x="770" y="340" width="200" height="220" rx="24" fill="url(#e2)"/>
<rect x="830" y="390" width="80" height="120" rx="40" fill="#fff" opacity=".85"/>
</svg>
</body>
</html>
