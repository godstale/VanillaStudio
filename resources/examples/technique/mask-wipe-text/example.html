<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#1c1b19;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720"><defs><clipPath id="mw"><rect id="mwr" x="140" y="230" width="0" height="260"/></clipPath></defs>
<rect width="1280" height="720" fill="#f4f1ea"/>
<text x="140" y="330" font-size="110" font-weight="900">REVEALED</text>
<text x="140" y="450" font-size="110" font-weight="900" fill="#2e9df0">BY A WIPE</text>
<rect x="140" y="230" width="1000" height="260" fill="none" stroke="#1c1b19" stroke-width="4" stroke-dasharray="16 12"/>
<g clip-path="url(#mw)"><rect x="140" y="230" width="1000" height="260" fill="#1c1b19"/><text x="170" y="330" font-size="110" font-weight="900" fill="#f4f1ea">REVEALED</text><text x="170" y="450" font-size="110" font-weight="900" fill="#f5b942">BY A WIPE</text></g></svg>
<script>
const SECONDS = 3;
window.seekExample = (t) => {
const phase = (t % SECONDS) / SECONDS;
const ease=(x)=>x<0?0:x>1?1:x*x*(3-2*x);
document.getElementById('mwr').setAttribute('width',1000*ease(phase/0.7));
};
if (!navigator.webdriver) {
const loop = (ms) => {
window.seekExample(ms / 1000);
requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
}
window.seekExample(0);
</script>
</body>
</html>
