<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stacked cards</title>
    <style>
      html, body {
        margin: 0; width: 1280px; height: 720px; overflow: hidden;
        background: #2A2E37;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .stage { position: relative; width: 100%; height: 100%; }
      .card {
        position: absolute; left: 340px; width: 600px; height: 380px;
        border-radius: 28px; box-sizing: border-box; padding: 48px;
      }
      .c1 { top: 90px; background: #3A4150; transform: rotate(-4deg); }
      .c2 { top: 150px; background: #E9E4D6; transform: rotate(2deg); }
      .c3 { top: 215px; background: #FFFFFF; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
      .chip { width: 110px; height: 110px; border-radius: 26px; background: linear-gradient(135deg, #E07830, #C7A410); }
      .bar { height: 36px; margin-top: 34px; border-radius: 8px; background: #22262E; }
      .line { height: 18px; margin-top: 16px; border-radius: 9px; background: #CFC8B4; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="card c1"></div>
      <div class="card c2"></div>
      <div class="card c3"><div class="chip"></div><div class="bar"></div><div class="line"></div></div>
    </div>
  </body>
</html>
