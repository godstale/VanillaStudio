<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0d1020}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#0d1020"/>
<circle cx="640" cy="360" r="60" fill="#e8fbff" opacity=".9"/>
<g fill="none">
<rect id="f0" x="340" y="140" width="600" height="440" rx="40" stroke="#39d0c4"/>
<rect id="f1" x="340" y="140" width="600" height="440" rx="40" stroke="#7d8aff"/>
<rect id="f2" x="340" y="140" width="600" height="440" rx="40" stroke="#f5b942"/>
<rect id="f3" x="340" y="140" width="600" height="440" rx="40" stroke="#39d0c4"/>
<rect id="f4" x="340" y="140" width="600" height="440" rx="40" stroke="#e0608f"/>
</g>
</svg>
<script>
const SECONDS=4;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
for(let i=0;i<5;i++){
const q=(p+i/5)%1;
const s=0.25+q*2.4;
const c=$('f'+i);
c.setAttribute('transform','translate(640 360) scale('+s.toFixed(3)+') translate(-640 -360)');
c.setAttribute('stroke-width',(10/Math.sqrt(s)).toFixed(1));
c.setAttribute('opacity',(q>0.9?(1-q)/0.1:Math.min(1,q*5)).toFixed(3));
}
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
