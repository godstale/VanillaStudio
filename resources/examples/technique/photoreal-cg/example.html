<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0e0f13;color:#f4f1ea;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<defs><radialGradient id="ball" cx="38%" cy="32%" r="80%"><stop offset="0" stop-color="#fdfdfd"/><stop offset=".4" stop-color="#c9ced6"/><stop offset=".75" stop-color="#5a6270"/><stop offset="1" stop-color="#14171d"/></radialGradient>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4150"/><stop offset="1" stop-color="#0e0f13"/></linearGradient></defs>
<rect width="1280" height="720" fill="#0e0f13"/>
<rect y="470" width="1280" height="250" fill="url(#fl)"/>
<ellipse cx="640" cy="520" rx="300" ry="26" fill="#000" opacity=".6"/>
<circle cx="640" cy="330" r="190" fill="url(#ball)"/>
<path d="M770 220 a190 190 0 0 1 60 150" stroke="#9fd8ff" stroke-width="10" fill="none" opacity=".8" stroke-linecap="round"/>
<ellipse cx="640" cy="620" rx="200" ry="40" fill="#8a93a3" opacity=".25"/>
<ellipse cx="640" cy="620" width="1" height="1" fill="none"/>
</svg>
</body>
</html>
