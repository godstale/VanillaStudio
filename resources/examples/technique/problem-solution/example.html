<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#1c1b19;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#1c1b19"/>
<rect x="40" y="150" width="270" height="420" rx="18" fill="#4a4a52"/><path d="M80 300 q40 -60 80 0 t80 0 t60 -40" stroke="#c9c9d2" stroke-width="10" fill="none"/><text x="175" y="530" text-anchor="middle" font-size="30" fill="#e8e8ee">Tangle</text>
<rect x="340" y="150" width="270" height="420" rx="18" fill="#5a1f1f"/><polygon points="420,240 460,340 500,260 540,360 580,250" fill="none" stroke="#ff6b6b" stroke-width="12"/><text x="475" y="530" text-anchor="middle" font-size="30" fill="#ffd9d9">Strain</text>
<rect x="640" y="150" width="270" height="420" rx="18" fill="#2b3242"/><rect x="705" y="250" width="140" height="180" rx="30" fill="#8fd0ff"/><text x="775" y="530" text-anchor="middle" font-size="30" fill="#f4f1ea">Answer</text>
<rect x="940" y="150" width="300" height="420" rx="18" fill="#e8f2e4"/><circle cx="1090" cy="300" r="70" fill="#f5b942"/><rect x="990" y="400" width="200" height="26" rx="13" fill="#6fae6f"/><text x="1090" y="530" text-anchor="middle" font-size="30" fill="#2c4632">Clear</text>
</svg>
</body>
</html>
