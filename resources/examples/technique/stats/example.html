<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4f1ea;color:#23211d;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0e3a34"/>
<text x="90" y="130" font-size="56" font-weight="800" fill="#f4f1ea">The bay in numbers</text>
<g text-anchor="middle">
<text x="250" y="380" font-size="150" font-weight="800" fill="#f2c879">128</text>
<text x="250" y="450" font-size="40" font-weight="700" fill="#f4f1ea">Paths</text>
<text x="550" y="380" font-size="150" font-weight="800" fill="#2ed3b1">96</text>
<text x="550" y="450" font-size="40" font-weight="700" fill="#f4f1ea">Stops</text>
<text x="830" y="380" font-size="150" font-weight="800" fill="#e8933c">12</text>
<text x="830" y="450" font-size="40" font-weight="700" fill="#f4f1ea">Guides</text>
<text x="1070" y="380" font-size="150" font-weight="800" fill="#f4f1ea">4</text>
<text x="1070" y="450" font-size="40" font-weight="700" fill="#f4f1ea">Seasons</text>
</g>
<rect x="90" y="520" width="1100" height="26" rx="13" fill="#084a45"/>
<rect x="90" y="520" width="770" height="26" rx="13" fill="#2ed3b1"/>
</svg>
</body>
</html>
