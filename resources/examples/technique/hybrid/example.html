<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Example</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0e0f13;color:#f4f1ea;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720">
<g id="h1"><rect width="1280" height="720" fill="#dcebf5"/><rect y="420" width="1280" height="300" fill="#8fce8f"/><circle cx="400" cy="220" r="80" fill="#f5b942"/><rect x="800" y="260" width="200" height="280" rx="14" fill="#b0724e"/></g>
<g id="h2"><rect width="1280" height="720" fill="#14161c"/><rect x="480" y="180" width="320" height="360" rx="48" fill="#8fd0ff"/><circle cx="640" cy="610" r="18" fill="#f5b942"/></g></svg>
<script>
const SECONDS = 4;
window.seekExample = (t) => {
const phase = (t % SECONDS) / SECONDS;
const ease=(x)=>x<0?0:x>1?1:x*x*(3-2*x);
document.getElementById('h1').setAttribute('transform','translate('+(-300*ease(phase/0.5))+' 0)');
document.getElementById('h1').setAttribute('opacity',phase<0.5?1:0);
document.getElementById('h2').setAttribute('opacity',phase<0.5?0:1);
};
if (!navigator.webdriver) {
const loop = (ms) => {
window.seekExample(ms / 1000);
requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
}
window.seekExample(0);
</script>
</body>
</html>
