<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#1C2433}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720"><circle cx="640" cy="360" r="200" fill="none" stroke="#3A465E" stroke-width="4"/><g id="b"><rect x="-220" y="-28" width="440" height="56" rx="28" fill="#F5B942"/><circle cx="220" cy="0" r="44" fill="#E4572E"/><circle cx="0" cy="0" r="30" fill="#2E4057"/></g></svg>
<script>
const SECONDS=2;
const $=i=>document.getElementById(i);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const lerp=(a,b,e)=>a+(b-a)*e;
const pp=v=>v<0.5?v*2:2-v*2;
const H=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
window.seekExample=t=>{
const p=(t%SECONDS)/SECONDS;
$('b').setAttribute('transform','translate(640 360) rotate('+(p*360).toFixed(1)+')');
};
if(!navigator.webdriver){const loop=ms=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
