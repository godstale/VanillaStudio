<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Technique study</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#e3e0d9}
svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 1280 720">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f2ec"/><stop offset=".72" stop-color="#e3e0d9"/><stop offset=".725" stop-color="#cfccc3"/><stop offset="1" stop-color="#c0bdb4"/></linearGradient>
<linearGradient id="ped" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9298a0"/><stop offset=".5" stop-color="#d9dde2"/><stop offset="1" stop-color="#83898f"/></linearGradient>
<radialGradient id="ball" cx="38%" cy="30%" r="82%"><stop offset="0" stop-color="#ffe9c9"/><stop offset=".6" stop-color="#f0a35e"/><stop offset="1" stop-color="#b35c1d"/></radialGradient>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<ellipse cx="640" cy="606" rx="300" ry="32" fill="#000" opacity=".18"/>
<rect x="520" y="404" width="240" height="182" fill="url(#ped)"/>
<ellipse cx="640" cy="404" rx="120" ry="17" fill="#7c828a"/>
<ellipse cx="640" cy="404" rx="120" ry="17" fill="none" stroke="#6a7076" stroke-width="3"/>
<circle cx="640" cy="272" r="132" fill="url(#ball)"/>
<ellipse cx="594" cy="226" rx="35" ry="22" fill="#fff" opacity=".7"/>
</svg>
</body>
</html>
