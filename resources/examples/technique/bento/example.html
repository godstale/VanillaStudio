<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bento</title>
    <style>
      html, body {
        margin: 0; width: 1280px; height: 720px; overflow: hidden;
        background: #E9E4D6;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .bento {
        display: grid; height: 100%; padding: 64px; box-sizing: border-box;
        grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 24px;
      }
      .tile { border-radius: 22px; }
      .a { grid-column: 1 / 3; grid-row: 1 / 3; background: linear-gradient(135deg, #2456D6, #7AA2F7); }
      .b { grid-column: 3 / 5; grid-row: 1 / 2; background: #FFFFFF; }
      .c { grid-column: 3 / 4; grid-row: 2 / 4; background: #E07830; }
      .d { grid-column: 4 / 5; grid-row: 2 / 3; background: #2E9E5B; }
      .e { grid-column: 1 / 3; grid-row: 3 / 4; background: #22262E; }
      .f { grid-column: 4 / 5; grid-row: 3 / 4; background: #FFFFFF; }
    </style>
  </head>
  <body>
    <div class="bento">
      <div class="tile a"></div><div class="tile b"></div><div class="tile c"></div>
      <div class="tile d"></div><div class="tile e"></div><div class="tile f"></div>
    </div>
  </body>
</html>
