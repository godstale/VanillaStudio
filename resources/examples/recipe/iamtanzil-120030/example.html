<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Hardware header</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0a0c10;color:#eef1f6;font-family:system-ui,'Segoe UI',sans-serif}
#glow{position:absolute;left:390px;top:60px;width:500px;height:500px;background:radial-gradient(circle,#2a3c5f 0%,transparent 70%)}
#dev{position:absolute;left:440px;top:170px;width:400px;height:400px;border-radius:60px;background:linear-gradient(135deg,#3a4356,#12161f);box-shadow:0 40px 100px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.25)}
#scr{position:absolute;left:480px;top:230px;width:320px;height:200px;border-radius:20px;background:linear-gradient(135deg,#00e5ff,#4f7cff)}
h1{position:absolute;left:90px;top:150px;margin:0;font-size:96px;letter-spacing:-.03em}
.spec{position:absolute;right:90px;text-align:right}
.spec b{font-size:64px;font-variant-numeric:tabular-nums}
.spec span{display:block;font-size:24px;color:#8b96ad}
svg.frame{position:absolute;inset:0}
</style></head><body>
<div id="glow"></div><div id="dev"></div><div id="scr"></div>
<h1>Built<br/>for speed.</h1>
<div class="spec" style="top:170px"><b>0–100 · 2.9s</b><span>acceleration</span></div>
<div class="spec" style="top:320px"><b>620 km</b><span>range</span></div>
<div class="spec" style="top:470px"><b>180 kW</b><span>fast charge</span></div>
<svg class="frame" viewBox="0 0 1280 720"><rect x="30" y="30" width="1220" height="660" fill="none" stroke="#2a3c5f" stroke-width="3"/></svg>
</body></html>
