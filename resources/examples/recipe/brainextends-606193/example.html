<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Poster pulse</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0c241a;color:#f6f1df;font-family:system-ui,'Segoe UI',sans-serif}
h1{position:absolute;left:90px;top:56px;margin:0;font-size:130px;line-height:.95;letter-spacing:-.03em}
.pill{position:absolute;border:5px solid #c8f04a;border-radius:999px}
#bars{position:absolute;left:90px;right:90px;bottom:90px;display:flex;gap:12px;align-items:flex-end;height:150px}
#bars i{flex:1;background:#c8f04a;border-radius:8px}
svg.frame{position:absolute;inset:0}
</style></head><body>
<h1>NIGHT<br/>FREQUENCY</h1>
<div class="pill" id="p1" style="left:690px;top:90px;width:420px;height:230px"></div>
<div class="pill" id="p2" style="left:760px;top:360px;width:340px;height:180px"></div>
<div id="bars"></div>
<svg class="frame" viewBox="0 0 1280 720"><circle id="sun" cx="1050" cy="220" r="70" fill="#ff7a1a"/></svg>
<script>
var SECONDS=6;
function h(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
var box=document.getElementById("bars"),bars=[];
for(var i=0;i<36;i++){var b=document.createElement("i");box.appendChild(b);bars.push(b);}
var p1=document.getElementById("p1"),p2=document.getElementById("p2"),sun=document.getElementById("sun");
window.seekExample=function(t){
var p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
for(var i=0;i<36;i++){
var v=0.25+0.75*Math.abs(Math.sin(i*0.9+p*Math.PI*4*(0.5+h(i))));
bars[i].style.height=(v*150)+"px";
bars[i].style.background=(i%9===0)?"#ff7a1a":"#c8f04a";
}
p1.style.transform="translateX("+(-30*Math.sin(p*Math.PI*2))+"px)";
p2.style.transform="translateX("+(40*Math.sin(p*Math.PI*2+1))+"px)";
sun.setAttribute("r",70+10*Math.sin(p*Math.PI*4));
};
if(!navigator.webdriver){var loop=function(ms){window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script></body></html>
