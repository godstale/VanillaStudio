<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Simulator</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#101623;color:#eaf0fa;font-family:system-ui,'Segoe UI',sans-serif}
#dock{position:absolute;left:90px;top:110px;width:380px;height:500px;background:#1a2338;border-radius:22px;padding:34px}
.sl{margin:26px 0}.sl label{font-size:24px;color:#9fb0cc}
.sl .tr{margin-top:10px;height:16px;background:#0c1220;border-radius:8px}
.sl .fl{height:100%;border-radius:8px;background:#38e1c6}
#pills{display:flex;gap:12px;margin-top:30px}
#pills b{padding:12px 26px;border-radius:999px;background:#26314d;font-size:24px}
#pills b.on{background:#38e1c6;color:#101623}
#read{position:absolute;left:540px;top:110px;right:90px;height:500px;background:#0c1220;border-radius:22px;padding:34px}
#read b{font-size:60px;font-variant-numeric:tabular-nums}
svg.frame{position:absolute;inset:0}
</style></head><body>
<div id="dock">
<div class="sl"><label>frequency</label><div class="tr"><div class="fl" style="width:70%"></div></div></div>
<div class="sl"><label>damping</label><div class="tr"><div class="fl" style="width:40%"></div></div></div>
<div class="sl"><label>drive</label><div class="tr"><div class="fl" style="width:85%"></div></div></div>
<div id="pills"><b class="on">CALM</b><b>FAST</b><b>WILD</b></div>
</div>
<div id="read"><b>2.40 Hz</b>
<svg viewBox="0 0 620 330" width="620" height="330"><path d="M0,165 C60,60 120,60 180,165 S300,270 360,165 S480,60 540,165 S600,220 620,165" fill="none" stroke="#38e1c6" stroke-width="8"/><line x1="0" y1="165" x2="620" y2="165" stroke="#26314d" stroke-width="2"/></svg>
</div>
<svg class="frame" viewBox="0 0 1280 720"><rect x="30" y="30" width="1220" height="660" fill="none" stroke="#26314d" stroke-width="3"/></svg>
</body></html>
