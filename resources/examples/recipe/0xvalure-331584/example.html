<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Emblem reveal</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f3efe4;color:#15130e;font-family:system-ui,'Segoe UI',sans-serif}
#tag{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:44px;letter-spacing:.28em}
svg.stage{position:absolute;inset:0}
</style></head><body>
<div id="tag">SHAPE IN MOTION</div>
<svg class="stage" viewBox="0 0 1280 720">
<circle id="ring" cx="640" cy="330" r="150" fill="none" stroke="#15130e" stroke-width="6"/>
<circle id="c" r="62" fill="#e4572e"/>
<rect id="q" width="110" height="110" fill="#1d5fa8"/>
<polygon id="tr" points="0,-72 66,40 -66,40" fill="#e8a91c"/>
</svg>
<svg class="frame" viewBox="0 0 1280 720" style="position:absolute;inset:0"><rect x="26" y="26" width="1228" height="668" fill="none" stroke="#15130e" stroke-width="4"/></svg>
<script>
var SECONDS=5;
var c=document.getElementById("c"),q=document.getElementById("q"),tr=document.getElementById("tr"),
ring=document.getElementById("ring"),tag=document.getElementById("tag");
function ease(x){x=x<0?0:x>1?1:x;var k=1.4;return 1+ (k+1)*Math.pow(x-1,3)+k*Math.pow(x-1,2);}
window.seekExample=function(t){
var p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS,e=ease(Math.min(1,p/0.7));
c.setAttribute("cx",640+(-420)*(1-e));c.setAttribute("cy",330+(-180)*(1-e));
q.setAttribute("x",640-55+430*(1-e));q.setAttribute("y",330-55+170*(1-e));
q.setAttribute("transform","rotate("+(90*(1-e))+" 640 330)");
tr.setAttribute("transform","translate(640 "+(330+120*(1-e))+") rotate("+(-120*(1-e))+")");
ring.setAttribute("r",150+130*(1-Math.min(1,p/0.7))+((p>0.7)?(p-0.7)*160:0));
ring.setAttribute("opacity",(p>0.85)?(1-(p-0.85)/0.15):1);
tag.style.opacity=Math.min(1,Math.max(0,(p-0.55)/0.2));
};
if(!navigator.webdriver){var loop=function(ms){window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script></body></html>
