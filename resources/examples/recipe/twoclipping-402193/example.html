<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Shape morph loop</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0e1116;color:#f2f4f8;font-family:system-ui,'Segoe UI',sans-serif}
.wrap{position:absolute;inset:0;display:grid;place-items:center}
#shape{display:grid;place-items:center;overflow:hidden}
#glyph{font-weight:800;letter-spacing:.06em;white-space:nowrap}
#bar{position:absolute;left:440px;right:440px;bottom:56px;display:flex;gap:10px}
#bar i{height:8px;flex:1;background:#2a3140;border-radius:4px}
#bar i.on{background:#7c5cff}
svg.frame{position:absolute;inset:0}
</style></head><body>
<div class="wrap"><div id="shape"><div id="glyph"></div></div></div>
<div id="bar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<svg class="frame" viewBox="0 0 1280 720"><circle id="ring" cx="640" cy="336" r="250" fill="none" stroke="#2a3140" stroke-width="2"/></svg>
<script>
var SECONDS=6;
var ST=[["SEARCH",420,120,60,"#7c5cff",44],["WAVE",560,150,75,"#00c2a8",44],["CHART",520,200,28,"#ff9f1c",44],["BADGE",300,300,150,"#ff5a5f",40],["SWITCH",380,140,70,"#3a86ff",44],["TABS",600,130,24,"#8338ec",40],["MIXER",560,190,40,"#06d6a0",44],["DONE",340,180,90,"#f2f4f8",44]];
var shape=document.getElementById("shape"),glyph=document.getElementById("glyph"),
ring=document.getElementById("ring"),bars=document.querySelectorAll("#bar i");
window.seekExample=function(t){
var p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
var idx=Math.floor(p*8)%8,fr=p*8-Math.floor(p*8);
var s=ST[idx];
shape.style.width=s[1]+"px";shape.style.height=s[2]+"px";
shape.style.borderRadius=s[3]+"px";shape.style.background=s[4];
glyph.textContent=s[0];glyph.style.fontSize=s[5]+"px";
glyph.style.color=(idx===7?"#0e1116":"#f2f4f8");
ring.setAttribute("r",250+34*Math.max(0,1-fr*4));
for(var i=0;i<8;i++){bars[i].className=(i===idx?"on":"");}
};
if(!navigator.webdriver){var loop=function(ms){window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script></body></html>
