<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Reel opener</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0b12;color:#fff;font-family:system-ui,'Segoe UI',sans-serif}
#mag{position:absolute;inset:0;background:#ff2fb3;clip-path:polygon(0 0,62% 0,38% 100%,0 100%)}
#cyn{position:absolute;inset:0;background:#00e5ff;clip-path:polygon(62% 0,100% 0,100% 100%,38% 100%)}
#word{position:absolute;inset:0;display:grid;place-items:center}
#word div{overflow:hidden}
#word span{display:block;font-size:220px;font-weight:900;letter-spacing:-.04em;background:#0b0b12;padding:0 60px}
.bar{position:absolute;left:-20%;width:140%;height:70px;background:#0b0b12}
svg.frame{position:absolute;inset:0}
</style></head><body>
<div id="mag"></div><div id="cyn"></div>
<div class="bar" id="b1"></div><div class="bar" id="b2"></div>
<div id="word"><div><span id="w">MOTION</span></div></div>
<svg class="frame" viewBox="0 0 1280 720"><rect x="30" y="30" width="1220" height="660" fill="none" stroke="#fff" stroke-width="5"/></svg>
<script>
var SECONDS=4;
var w=document.getElementById("w"),b1=document.getElementById("b1"),b2=document.getElementById("b2");
window.seekExample=function(t){
var p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
w.style.transform="translateY("+((1-Math.min(1,p/0.25))*260)+"px) skewX("+(-8+16*p)+"deg)";
b1.style.top=(120+560*p)+"px";b1.style.transform="rotate(-8deg)";
b2.style.top=(620-560*p)+"px";b2.style.transform="rotate(-8deg)";
b1.style.opacity=b2.style.opacity=(p>0.12&&p<0.88)?1:0;
};
if(!navigator.webdriver){var loop=function(ms){window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script></body></html>
