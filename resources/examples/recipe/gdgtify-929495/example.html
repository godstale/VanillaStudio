<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Speech film</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f4efe4;color:#141412;font-family:system-ui,'Segoe UI',sans-serif}
.mask{position:absolute;left:90px;right:90px;overflow:hidden}
.m1{top:90px;height:170px}.m2{top:275px;height:170px}.m3{top:460px;height:170px}
.line{font-size:118px;font-weight:900;letter-spacing:-.03em;line-height:1.35;white-space:nowrap}
.alt{font-style:italic;font-weight:400}
#grid{position:absolute;inset:0;opacity:.14}
svg.frame{position:absolute;inset:0}
</style></head><body>
<div id="grid"><svg width="1280" height="720"><g stroke="#141412" stroke-width="2"><line x1="640" y1="0" x2="640" y2="720"/><line x1="0" y1="360" x2="1280" y2="360"/><line x1="140" y1="0" x2="140" y2="720"/><line x1="1140" y1="0" x2="1140" y2="720"/></g></svg></div>
<div class="mask m1"><div class="line" id="l1">RAISE YOUR</div></div>
<div class="mask m2"><div class="line alt" id="l2">quiet voice</div></div>
<div class="mask m3"><div class="line" id="l3">HOLD THE FLOOR</div></div>
<svg class="frame" viewBox="0 0 1280 720"><rect x="40" y="40" width="1200" height="640" fill="none" stroke="#d83a00" stroke-width="6"/></svg>
<script>
var SECONDS=6;
var l1=document.getElementById("l1"),l2=document.getElementById("l2"),l3=document.getElementById("l3");
function beat(p,at){var d=p-at;if(d<0)d+=1;return Math.max(0,1-d*6);}
window.seekExample=function(t){
var p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
l1.style.transform="translateY("+(-170*(p<0.45?0:1))+"px) rotate("+(-4*beat(p,0.0))+"deg)";
l2.style.transform="translateX("+(120*beat(p,0.33)-40*beat(p,0.0))+"px) rotate("+(2*beat(p,0.5))+"deg)";
l3.style.transform="translateY("+(170*(p<0.4?1:0))+"px) rotate("+(3*beat(p,0.66))+"deg)";
l3.style.color=(p>0.4?"#d83a00":"#141412");
};
if(!navigator.webdriver){var loop=function(ms){window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script></body></html>
