<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Recursion</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#141019;color:#f4eefc;font-family:system-ui,'Segoe UI',sans-serif}
.lv{position:absolute;display:grid;place-items:center;border-radius:18px}
#lab{position:absolute;left:80px;top:70px;font-size:44px;font-weight:800}
#lab small{display:block;font-size:26px;color:#a99bc4;font-weight:400}
svg.frame{position:absolute;inset:0}
</style></head><body>
<div id="lab">depth <span id="dn">1</span><small>each frame calls a smaller copy</small></div>
<div class="lv" id="L0"></div><div class="lv" id="L1"></div><div class="lv" id="L2"></div><div class="lv" id="L3"></div><div class="lv" id="L4"></div>
<svg class="frame" viewBox="0 0 1280 720"><rect x="30" y="30" width="1220" height="660" fill="none" stroke="#8a5cff" stroke-width="5"/></svg>
<script>
var SECONDS=6;
function h(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
var COLS=["#2b2140","#3a2c5c","#4c3a7d","#5f4a9e","#8a5cff"];
var els=[0,1,2,3,4].map(function(i){return document.getElementById("L"+i);});
var dn=document.getElementById("dn");
window.seekExample=function(t){
var p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
var d=1+Math.floor(p*5)%5,fr=p*5-Math.floor(p*5);
dn.textContent=d;
for(var i=0;i<5;i++){
var on=i<d?1:0,last=(i===d-1)?1:0;
var sc=1-i*0.13+last*0.03*Math.sin(fr*Math.PI);
var w=760*sc,hh=460*sc;
els[i].style.width=w+"px";els[i].style.height=hh+"px";
els[i].style.left=(640-w/2)+"px";els[i].style.top=(400-hh/2)+"px";
els[i].style.background=COLS[i];els[i].style.opacity=on?1:0.12;
els[i].style.border=(last?"6px solid #ffd166":"3px solid rgba(255,255,255,.25)");
els[i].style.transform="rotate("+((h(i*3.7)-0.5)*6)+"deg)";
}
};
if(!navigator.webdriver){var loop=function(ms){window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script></body></html>
