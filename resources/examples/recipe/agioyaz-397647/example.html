<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Prism film</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#050507;font-family:system-ui,'Segoe UI',sans-serif}
canvas{width:1280px;height:720px;display:block}
svg.frame{position:absolute;inset:0}
</style></head><body>
<canvas id="cv" width="640" height="360"></canvas>
<svg class="frame" viewBox="0 0 1280 720"><rect x="22" y="22" width="1236" height="676" fill="none" stroke="#4a4a58" stroke-width="3"/><text x="80" y="650" fill="#8b8b98" font-size="28" letter-spacing="8">WHITE SPACE · DISPERSION STUDY</text></svg>
<script>
var SECONDS=6;
function h(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var SP=["#ff3b30","#ff9500","#ffcc00","#34c759","#0a84ff","#bf5af2"];
window.seekExample=function(t){
var p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
ctx.fillStyle="#050507";ctx.fillRect(0,0,640,360);
for(var s=0;s<40;s++){var mx=(h(s*3.1)*640+p*20*(0.3+h(s)))%640;
ctx.fillStyle="rgba(255,255,255,"+(0.12+0.25*h(s*7.7))+")";ctx.fillRect(mx,h(s*5.3)*360,1.4,1.4);}
ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=5;
ctx.beginPath();ctx.moveTo(0,240);ctx.lineTo(268,196);ctx.stroke();
var sway=Math.sin(p*6.283)*0.06;
for(var i=0;i<6;i++){ctx.strokeStyle=SP[i];ctx.globalAlpha=0.85;ctx.lineWidth=7-i;
ctx.beginPath();ctx.moveTo(372,196);
var a2=-0.25+i*0.13+sway;ctx.lineTo(372+300*Math.cos(a2),196+300*Math.sin(a2));ctx.stroke();}
ctx.globalAlpha=1;
ctx.fillStyle="rgba(200,220,255,.16)";ctx.beginPath();
ctx.moveTo(320,120);ctx.lineTo(424,272);ctx.lineTo(216,272);ctx.fill();
ctx.strokeStyle="rgba(220,235,255,.8)";ctx.lineWidth=2;ctx.stroke();
};
if(!navigator.webdriver){var loop=function(ms){window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script></body></html>
