<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Pitch slide</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0f1220;color:#f2f4fa;font-family:system-ui,'Segoe UI',sans-serif}
.eyebrow{position:absolute;left:100px;top:70px;font-size:26px;letter-spacing:.3em;color:#8b93b8}
h1{position:absolute;left:100px;top:120px;margin:0;font-size:96px;letter-spacing:-.03em;line-height:1.02}
h1 em{font-style:normal;color:#7c8cff}
#card{position:absolute;left:100px;top:400px;width:520px;height:220px;background:#1a2138;border-radius:20px;padding:30px 36px}
#card b{font-size:30px}#card div{font-size:64px;font-weight:800;margin-top:8px}
#chart{position:absolute;left:700px;top:400px;right:100px;height:220px;display:flex;gap:18px;align-items:flex-end}
#chart i{flex:1;border-radius:10px}
svg.frame{position:absolute;inset:0}
</style></head><body>
<div class="eyebrow">PITCH DECK</div>
<h1>One slide,<br/><em>one decision.</em></h1>
<div id="card"><b>weekly active teams</b><div>48,210</div></div>
<div id="chart"><i style="height:30%;background:#3a4666"></i><i style="height:48%;background:#3a4666"></i><i style="height:64%;background:#3a4666"></i><i style="height:100%;background:#7c8cff"></i></div>
<svg class="frame" viewBox="0 0 1280 720"><rect x="40" y="40" width="1200" height="640" fill="none" stroke="#3a4666" stroke-width="3"/><circle cx="1150" cy="130" r="14" fill="#7c8cff"/></svg>
</body></html>
