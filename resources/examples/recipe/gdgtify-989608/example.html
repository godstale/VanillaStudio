<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Orbit poster</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0e1a;color:#f2ead8;font-family:system-ui,'Segoe UI',sans-serif}
h1{position:absolute;left:0;right:0;top:250px;margin:0;text-align:center;font-size:150px;letter-spacing:-.02em}
h1 em{font-style:normal;color:#ff7a59}
svg.stage{position:absolute;inset:0}
.tick{font-size:22px;fill:#8b93ad;font-family:system-ui,sans-serif}
</style></head><body>
<svg class="stage" viewBox="0 0 1280 720">
<ellipse cx="640" cy="360" rx="430" ry="150" fill="none" stroke="#3d4a6e" stroke-width="2"/>
<ellipse cx="640" cy="360" rx="300" ry="215" fill="none" stroke="#3d4a6e" stroke-width="2"/>
<path id="orb" d="M210,360 a430,150 0 1,0 860,0 a430,150 0 1,0 -860,0" fill="none"/>
<text style="font-size:34px;letter-spacing:14px" fill="#e8b64c"><textPath id="tp" href="#orb">DRIFT BEYOND THE QUIET ORBIT DRIFT BEYOND THE QUIET ORBIT</textPath></text>
<circle id="pl" r="20" fill="#ff7a59"/>
<circle id="plhalo" r="34" fill="none" stroke="#ff7a59" stroke-width="3" opacity=".6"/>
<g id="ticks"></g>
</svg>
<h1>WANDE<em>R</em></h1>
<svg class="frame" viewBox="0 0 1280 720" style="position:absolute;inset:0"><rect x="26" y="26" width="1228" height="668" fill="none" stroke="#e8b64c" stroke-width="4"/></svg>
<script>
var SECONDS=6;
var NS2="http://www.w3.org/2000/svg";
var tp=document.getElementById("tp"),pl=document.getElementById("pl"),halo=document.getElementById("plhalo"),
ticks=document.getElementById("ticks");
for(var i=0;i<24;i++){var L=document.createElementNS(NS2,"line");
var a2=i/24*2*Math.PI,x1=640+470*Math.cos(a2),y1=360+190*Math.sin(a2),x2=640+492*Math.cos(a2),y2=360+212*Math.sin(a2);
L.setAttribute("x1",x1);L.setAttribute("y1",y1);L.setAttribute("x2",x2);L.setAttribute("y2",y2);
L.setAttribute("stroke","#8b93ad");L.setAttribute("stroke-width","3");ticks.appendChild(L);}
window.seekExample=function(t){
var p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS,a2=p*2*Math.PI;
tp.setAttribute("startOffset",(p*100)+"%");
var px=640+430*Math.cos(a2),py=360+150*Math.sin(a2);
pl.setAttribute("cx",px);pl.setAttribute("cy",py);
halo.setAttribute("cx",px);halo.setAttribute("cy",py);
halo.setAttribute("r",30+8*Math.sin(p*12.56));
};
if(!navigator.webdriver){var loop=function(ms){window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script></body></html>
