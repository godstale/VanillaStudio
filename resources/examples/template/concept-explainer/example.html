<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Concept explainer skeleton</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden;
        background: #f6f1e5; color: #22301f; font-family: 'Segoe UI', system-ui, sans-serif; }
      .slide { position: absolute; inset: 0 0 96px; display: grid; place-content: center;
        justify-items: center; gap: 14px; text-align: center; opacity: 0; }
      h1 { margin: 0; font-size: 80px; letter-spacing: -0.02em; }
      p { margin: 0; color: #6c7263; font-size: 28px; }
      .board { width: 640px; height: 180px; border: 10px solid #2e3d33; border-radius: 14px;
        background: #22301f; color: #f6f1e5; display: grid; place-items: center; font-size: 44px; }
      .flat { display: flex; gap: 24px; }
      .flat i { width: 110px; height: 110px; border-radius: 26px; display: block; }
      .steps { display: flex; gap: 18px; font-size: 60px; font-weight: 700; }
      .steps span { padding: 10px 26px; border-radius: 16px; background: #22301f; color: #f6f1e5; }
      nav { position: absolute; right: 56px; bottom: 30px; left: 56px; display: flex; gap: 10px; }
      nav div { height: 42px; border-top: 4px solid #cfc6ae; color: #8a8471;
        font-size: 20px; line-height: 42px; }
      nav div.on { border-color: #2e7d4f; color: #22301f; }
    </style>
  </head>
  <body>
    <div class="slide"><div class="board">Why does it float?</div><p>Question: pose it large</p></div>
    <div class="slide"><div class="flat"><i style="background:#e07b39"></i><i style="background:#2e7d4f"></i><i style="background:#3d6fb4"></i></div><h1>Like boats on water</h1><p>Analogy: one familiar picture</p></div>
    <div class="slide"><div class="steps"><span>1</span><span>2</span><span>3</span></div><h1>How it works</h1><p>Mechanism: step by step</p></div>
    <div class="slide"><h1>Three lines to keep</h1><p>Recap: numbered summary</p></div>
    <nav id="nav"></nav>
    <script>
      const SECONDS = 9;
      const BEATS = [['Question', 6], ['Analogy', 10], ['Mechanism', 14], ['Recap', 6]];
      const total = BEATS.reduce((s, [, x]) => s + x, 0);
      const nav = document.getElementById('nav');
      nav.innerHTML = BEATS.map(([n, s]) => `<div style="flex:${s}">${n} · ${s}s</div>`).join('');
      const slides = [...document.querySelectorAll('.slide')];
      const tabs = [...nav.children];
      window.seekExample = (t) => {
        const cyc = ((t % SECONDS) + SECONDS) % SECONDS;
        let at = (cyc / SECONDS) * total;
        const active = BEATS.findIndex(([, s]) => (at < s ? true : ((at -= s), false)));
        slides.forEach((s, i) => (s.style.opacity = i === active ? 1 : 0));
        tabs.forEach((b, i) => b.classList.toggle('on', i === active));
      };
      if (!navigator.webdriver) {
        const loop = (ms) => { window.seekExample(ms / 1000); requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
      }
      window.seekExample(0);
    </script>
  </body>
</html>
