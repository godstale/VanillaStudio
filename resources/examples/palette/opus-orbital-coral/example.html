<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Opus Orbital Coral</title>
    <style>
      :root {
        --canvas: #080D23;
        --ink: #FFF4DD;
        --primary: #FF654F;
        --accent: #6685FF;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--canvas);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
      }
      main {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 56px;
        height: 100%;
        padding: 72px;
        box-sizing: border-box;
      }
      small {
        color: var(--accent);
        font: 600 20px 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 20px 0;
        font-size: 84px;
        line-height: 1.04;
      }
      p {
        max-width: 560px;
        font-size: 26px;
        line-height: 1.45;
      }
      button {
        margin-top: 20px;
        padding: 16px 32px;
        border: 0;
        border-radius: 6px;
        background: var(--primary);
        color: var(--canvas);
        font: 600 24px 'Segoe UI', system-ui, sans-serif;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 22px;
        height: 100%;
        border-bottom: 4px solid var(--ink);
      }
      .bars i {
        flex: 1;
        background: var(--primary);
      }
      .bars i:nth-child(even) {
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <small>Canvas · Ink · Primary · Accent</small>
        <h1>Quiet numbers, warm pages</h1>
        <p>Body copy sits in ink on canvas. The primary color carries one action.</p>
        <button>Primary action</button>
      </section>
      <div class="bars">
        <i style="height: 42%"></i>
        <i style="height: 58%"></i>
        <i style="height: 50%"></i>
        <i style="height: 74%"></i>
        <i style="height: 92%"></i>
      </div>
    </main>
  </body>
</html>
