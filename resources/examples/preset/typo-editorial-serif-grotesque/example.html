<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Contrast</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#f1e9d6;color:#1c1b19;font-family:'Segoe UI',system-ui,sans-serif}
.idx{position:absolute;font-size:22px;letter-spacing:.24em;color:#8a7f68}
.rule{position:absolute;left:110px;right:110px;top:200px;height:2px;background:#1c1b19;opacity:.4}
.line{position:absolute;left:110px;right:110px;overflow:hidden}
.a{top:230px}.a h1{font-size:96px;font-weight:800;margin:0;letter-spacing:-.01em}
.b{top:350px}.b h1{font-size:96px;font-weight:400;font-style:italic;margin:0;font-family:Georgia,serif;color:#7a2e12}
.c{top:480px;font-size:26px;letter-spacing:.12em;color:#4a463d}
svg.hud{position:absolute;inset:0;width:1280px;height:720px}
</style>
</head>
<body>
<div class="idx" style="left:110px;top:110px">[ 02 ]</div>
<div class="idx" style="right:110px;top:110px">FOLIO 04</div>
<div class="rule"></div>
<div class="line a"><h1 id="w0">SPEAK PLAINLY</h1></div>
<div class="line b"><h1 id="w1">mean it warmly</h1></div>
<div class="line c" id="w2">GROTESQUE WEIGHT MEETS SERIF ACCENT</div>
<svg class="hud" viewBox="0 0 1280 720"><rect x="70" y="70" width="1140" height="580" fill="none" stroke="#1c1b19" stroke-width="2" opacity=".35"/></svg>
<script>
const SECONDS=4;
const w0=document.getElementById('w0');
const w1=document.getElementById('w1');
const w2=document.getElementById('w2');
function seg(p,a,b){return Math.min(1,Math.max(0,(p-a)/(b-a)));}
window.seekExample=(t)=>{
const p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
w0.style.transform=`translateY(${(1-seg(p,0,.2))*110}%)`;
w1.style.transform=`translateY(${(1-seg(p,.12,.32))*110}%)`;
const pulse=.5+.5*Math.sin(p*Math.PI*4);
w1.style.opacity=.75+.25*pulse;
w2.style.transform=`translateY(${(1-seg(p,.25,.45))*110}%)`;
};
if(!navigator.webdriver){const loop=(ms)=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
