<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Weight</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#141210;color:#f5efe2;font-family:'Segoe UI',system-ui,sans-serif}
.line{position:absolute;left:130px;right:130px;overflow:hidden}
.a{top:190px}.a h1{font-size:110px;font-weight:800;margin:0}
.b{top:330px}.b h1{font-size:72px;font-weight:400;font-style:italic;margin:0;font-family:Georgia,serif;color:#e8c15a}
svg.stage{position:absolute;inset:0;width:1280px;height:720px}
#orbText{font-size:28px;letter-spacing:9px;fill:#e8c15a;font-weight:700}
</style>
</head>
<body>
<div class="line a"><h1 id="w0">PRESS HARDER</h1></div>
<div class="line b"><h1 id="w1">then let it ring</h1></div>
<svg class="stage" viewBox="0 0 1280 720">
<ellipse id="orb" cx="640" cy="420" rx="420" ry="140" fill="none" stroke="#e8c15a" stroke-width="2" stroke-dasharray="8 10" opacity=".65"/>
<text id="orbText"><textPath id="orbPath" href="#orb">HARDER &#183; SOFTER &#183; HARDER &#183; SOFTER &#183; HARDER &#183; SOFTER &#183;</textPath></text>
</svg>
<script>
const SECONDS=4;
const w0=document.getElementById('w0');
const w1=document.getElementById('w1');
const orbPath=document.getElementById('orbPath');
function seg(p,a,b){return Math.min(1,Math.max(0,(p-a)/(b-a)));}
window.seekExample=(t)=>{
const p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
w0.style.transform=`translateY(${(1-seg(p,0,.16))*112}%)`;
w1.style.transform=`translateY(${(1-seg(p,.12,.28))*112}%)`;
const beat=Math.abs(Math.sin(p*Math.PI*4));
w0.style.letterSpacing=(.05*beat-.02)+'em';
w0.style.opacity=.6+.4*beat;
orbPath.setAttribute('startOffset',((p*100)%25)+'%');
};
if(!navigator.webdriver){const loop=(ms)=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
