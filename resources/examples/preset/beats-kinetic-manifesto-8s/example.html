<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Speech</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#141210;color:#f5efe2;font-family:'Segoe UI',system-ui,sans-serif}
.line{position:absolute;left:120px;right:120px;overflow:hidden}
.line h1{margin:0;font-weight:800}
.a{top:150px}.a h1{font-size:100px;letter-spacing:-.02em}
.b{top:280px}.b h1{font-size:100px;color:#c96f2e}
.c{top:410px}.c h1{font-size:56px;font-weight:400;font-style:italic;font-family:Georgia,serif}
.end{position:absolute;inset:0;display:grid;place-content:center;background:#c9362b;opacity:0}
.end h1{margin:0;font-size:92px;font-weight:800;color:#fff}
svg.stage{position:absolute;inset:0;width:1280px;height:720px}
#orbText{font-size:30px;letter-spacing:10px;fill:#e8c15a;font-weight:700}
</style>
</head>
<body>
<div class="line a"><h1 id="w0">HOLD THE BASE</h1></div>
<div class="line b"><h1 id="w1">TURN THE ROOM</h1></div>
<div class="line c"><h1 id="w2">and every voice finds its weight</h1></div>
<div class="end" id="end"><h1>STAND TOGETHER</h1></div>
<svg class="stage" viewBox="0 0 1280 720">
<ellipse id="orb" cx="640" cy="390" rx="440" ry="150" fill="none" stroke="#e8c15a" stroke-width="2" stroke-dasharray="8 10" opacity=".6"/>
<text id="orbText"><textPath id="orbPath" href="#orb">TURN THE ROOM &#183; HOLD THE BASE &#183; TURN THE ROOM &#183; HOLD THE BASE &#183;</textPath></text>
</svg>
<script>
const SECONDS=6;
const words=[document.getElementById('w0'),document.getElementById('w1'),document.getElementById('w2')];
const end=document.getElementById('end');
const orbPath=document.getElementById('orbPath');
const orbText=document.getElementById('orbText');
function seg(p,a,b){return Math.min(1,Math.max(0,(p-a)/(b-a)));}
window.seekExample=(t)=>{
const p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
const starts=[0,.1,.2];
words.forEach((w,i)=>{w.style.transform=`translateY(${(1-seg(p,starts[i],starts[i]+.09))*110}%)`;});
const pulse=.5+.5*Math.sin(p*Math.PI*2*3);
words[0].style.letterSpacing=(.03*pulse-.015)+'em';
orbPath.setAttribute('startOffset',((p*120)%40)+'%');
orbText.setAttribute('opacity',String(seg(p,.32,.42)*(1-seg(p,.68,.78))));
end.style.opacity=seg(p,.78,.9);
};
if(!navigator.webdriver){const loop=(ms)=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
