<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Arc</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#10141c;color:#f4f1ea;font-family:'Segoe UI',system-ui,sans-serif}
#zoom{position:absolute;inset:0;transform-origin:780px 430px}
.mask{position:absolute;left:0;right:0;top:130px;overflow:hidden;text-align:center}
.mask h1{margin:0;font-size:112px;font-weight:800;letter-spacing:-.04em}
.card{position:absolute;left:390px;top:380px;width:500px;border-radius:20px;background:#1b2334;padding:30px 36px;border:1px solid #2b3a52}
.card .row{display:flex;align-items:center;gap:12px;font-size:24px;margin:10px 0}
.card .row i{flex:1;height:14px;border-radius:8px;background:#2c3549;overflow:hidden}
.card .row i b{display:block;height:100%;background:#ffb347;transform-origin:left}
#n{font-size:64px;font-weight:800;color:#ffb347}
#cursor{position:absolute;width:34px;height:34px}
#ring{position:absolute;width:20px;height:20px;margin:-10px;border:3px solid #ffb347;border-radius:50%;opacity:0}
.end{position:absolute;inset:0;display:grid;place-content:center;background:#ffb347;color:#10141c;opacity:0}
.end h1{margin:0;font-size:104px;font-weight:800;letter-spacing:-.03em}
.ticks{position:absolute;left:120px;right:120px;bottom:40px;display:flex;gap:8px}
.ticks i{flex:1;height:6px;border-radius:4px;background:#2c3549}
.ticks i.on{background:#ffb347}
svg.hud{position:absolute;inset:0;width:1280px;height:720px}
</style>
</head>
<body>
<div id="zoom">
<div class="mask"><h1 id="hook">BEGIN ANYWHERE</h1></div>
<div class="card" id="card"><div id="n">0</div><div class="row">PACK <i><b id="f0"></b></i></div><div class="row">SHIP <i><b id="f1"></b></i></div></div>
<div id="cursor"><svg width="34" height="34" viewBox="0 0 34 34"><path d="M6 3l22 13-10 2-4 10z" fill="#fff" stroke="#111" stroke-width="2"/></svg></div>
<div id="ring"></div>
</div>
<div class="end" id="end"><h1>OPEN NOW</h1></div>
<div class="ticks" id="ticks"><i></i><i></i><i></i><i></i></div>
<svg class="hud" viewBox="0 0 1280 720"><path d="M24 64V24h40M1216 24h40v40M24 656v40h40M1256 656v40h-40" fill="none" stroke="#ffb347" stroke-width="3" opacity=".6"/></svg>
<script>
const SECONDS=6;
const zoom=document.getElementById('zoom');
const hook=document.getElementById('hook');
const cur=document.getElementById('cursor');
const ring=document.getElementById('ring');
const end=document.getElementById('end');
const card=document.getElementById('card');
const n=document.getElementById('n');
const fills=[document.getElementById('f0'),document.getElementById('f1')];
const ticks=[...document.querySelectorAll('#ticks i')];
function seg(p,a,b){return Math.min(1,Math.max(0,(p-a)/(b-a)));}
window.seekExample=(t)=>{
const p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
hook.style.transform=`translateY(${(1-seg(p,0,.08))*110}%)`;
const cq=seg(p,.25,.55);
const u=1-cq;
const x=u*u*200+2*u*cq*560+cq*cq*760;
const y=u*u*560+2*u*cq*300+cq*cq*450;
cur.style.left=x+'px';cur.style.top=y+'px';
cur.style.opacity=cq>0&&cq<1?1:0;
const rq=seg(p,.55,.63);
ring.style.opacity=rq<1&&p>.55?String(1-rq):'0';
ring.style.left='760px';ring.style.top='450px';
ring.style.transform=`scale(${1+rq*5})`;
zoom.style.transform=`scale(${1+.3*seg(p,.5,.66)})`;
const mq=seg(p,.6,.75);
n.textContent=Math.round(480*mq);
fills.forEach((f,i)=>{f.style.transform=`scaleX(${seg(p,.6+i*.05,.75)})`;});
card.style.opacity=seg(p,.3,.4)*(1-seg(p,.78,.84));
end.style.opacity=seg(p,.8,.87);
const idx=p<.25?0:p<.58?1:p<.83?2:3;
ticks.forEach((el,i)=>el.classList.toggle('on',i===idx));
};
if(!navigator.webdriver){const loop=(ms)=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
