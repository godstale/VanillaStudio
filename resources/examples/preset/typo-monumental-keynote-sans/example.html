<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mass</title>
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0c0f16;color:#fff;font-family:'Segoe UI',system-ui,sans-serif}
.mask{position:absolute;left:0;right:0;top:170px;overflow:hidden;text-align:center}
.mask h1{margin:0;font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:1}
.mask h1 span{color:#b8e62e}
.rule{height:6px;background:#b8e62e;margin:26px auto 0;width:200px}
.read{position:absolute;left:0;right:0;bottom:110px;text-align:center;font-family:Consolas,monospace;font-size:64px;letter-spacing:.1em;color:#b8e62e}
.read small{display:block;font-size:20px;letter-spacing:.4em;color:#8fa1bb}
svg.hud{position:absolute;inset:0;width:1280px;height:720px}
</style>
</head>
<body>
<div class="mask"><h1 id="big">MOVE <span>FAST</span></h1><div class="rule"></div></div>
<div class="read"><small>RATE / SEC</small><span id="num">000</span></div>
<svg class="hud" viewBox="0 0 1280 720"><path d="M24 64V24h40M1216 24h40v40M24 656v40h40M1256 656v40h-40" fill="none" stroke="#b8e62e" stroke-width="3" opacity=".6"/></svg>
<script>
const SECONDS=4;
const big=document.getElementById('big');
const num=document.getElementById('num');
function seg(p,a,b){return Math.min(1,Math.max(0,(p-a)/(b-a)));}
window.seekExample=(t)=>{
const p=((t%SECONDS)+SECONDS)%SECONDS/SECONDS;
big.style.transform=`translateY(${(1-seg(p,0,.18))*108}%)`;
const cyc=(p*2)%1;
num.textContent=String(Math.floor(seg(cyc,0,.9)*999)).padStart(3,'0');
};
if(!navigator.webdriver){const loop=(ms)=>{window.seekExample(ms/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.seekExample(0);
</script>
</body>
</html>
